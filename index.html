<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>POLIMAXX IRPC Production</title>
    <link rel="stylesheet" href="./css/polimaxx_styles.css" />
    <link rel="shortcut icon" href="#" />
    <!-- fix favicon.ico -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "lil-gui": "https://unpkg.com/lil-gui@0.17.0/dist/lil-gui.esm.min.js",
          "qrcode": "https://esm.sh/qrcode@1.5.3"
        }
      }
    </script>
  </head>
  <body>
    <div class="controls">
      <button id="btn-reset" class="active">รีเซ็ตตำแหน่ง</button>
      <button id="btn-align">จ้องมองถุง</button>
      <button id="btn-wall-toggle">ซ่อน/แสดงผนัง</button>
    </div>
    <div class="stack-lift" aria-label="ยก/ลดกองถุง">
      <button id="btn-lift-up" class="lift-btn" title="ยกกองถุงขึ้น">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 5l7 7h-4v7h-6v-7H5z" fill="currentColor" />
        </svg>
      </button>
      <button id="btn-lift-down" class="lift-btn" title="ลดกองถุงลง">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 19l-7-7h4V5h6v7h4z" fill="currentColor" />
        </svg>
      </button>
    </div>
    <script type="module" src="./js/polimaxx_app.js"></script>
  </body>
</html>
