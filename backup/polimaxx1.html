<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: http: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;">
    <title>POLIMAXX - 2 Pallets + 1 Layer (10 bags × 25kg = 250kg)</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222222;
            font-family: 'Arial', sans-serif;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border-left: 4px solid #f37021;
            pointer-events: none;
            z-index: 100;
        }
        h1 { margin: 0; font-size: 16px; color: #f37021; text-transform: uppercase; letter-spacing: 1px; }
        p { margin: 5px 0 0; font-size: 12px; opacity: 0.9; }
        .stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ccc;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            border-left: 4px solid #4CAF50;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="ui-panel">
        <h1>POLIMAXX - 10 Bags × 25kg = 250kg</h1>
        <p>✅ 2 พาเลทพลาสติก 1100x1100mm | 1 ชั้น = 10 ถุง x 25 กก. = 250 กก. | สลับรูปแบบการเรียงเพื่อความเสถียร</p>
    </div>
    <div class="stats">
        📦 2 Pallets × 5 bags = 10 bags × 25kg = 250kg | 🔄 Alternating 2+3 / 3+2 pattern on each pallet
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Plastic Pallet Class ---
        class PlasticPallet {
            constructor(options = {}) {
                // ขนาดมาตรฐาน 1100x1100x150 mm
                this.width = options.width || 2.3;      // 1100mm scale
                this.depth = options.depth || 2.3;      // 1100mm scale
                this.height = options.height || 0.15;   // 150mm
                this.color = options.color || 0x5a6b7c;
                this.legColor = options.legColor || 0x4a5b6c;
                
                this.group = new THREE.Group();
                this.createPallet();
            }
            
            createPallet() {
                // Top deck
                const topDeckGeo = new THREE.BoxGeometry(this.width, 0.018, this.depth);
                const topDeckMat = new THREE.MeshStandardMaterial({
                    color: this.color,
                    roughness: 0.75,
                    metalness: 0.15,
                    emissive: new THREE.Color(0x222222),
                    emissiveIntensity: 0.1
                });
                const topDeck = new THREE.Mesh(topDeckGeo, topDeckMat);
                topDeck.position.y = this.height - 0.01;
                topDeck.castShadow = true;
                topDeck.receiveShadow = true;
                this.group.add(topDeck);
                
                // Bottom deck
                const bottomDeckGeo = new THREE.BoxGeometry(this.width - 0.1, 0.016, this.depth - 0.1);
                const bottomDeckMat = new THREE.MeshStandardMaterial({
                    color: this.legColor,
                    roughness: 0.8,
                    metalness: 0.1
                });
                const bottomDeck = new THREE.Mesh(bottomDeckGeo, bottomDeckMat);
                bottomDeck.position.y = 0.01;
                bottomDeck.castShadow = true;
                bottomDeck.receiveShadow = true;
                this.group.add(bottomDeck);
                
                // ขา 9 จุด
                const legGeo = new THREE.BoxGeometry(0.18, this.height - 0.03, 0.18);
                const legMat = new THREE.MeshStandardMaterial({
                    color: this.legColor,
                    roughness: 0.8,
                    metalness: 0.1
                });
                
                const xPositions = [-0.8, 0, 0.8];
                const zPositions = [-0.8, 0, 0.8];
                
                xPositions.forEach(x => {
                    zPositions.forEach(z => {
                        const leg = new THREE.Mesh(legGeo, legMat);
                        leg.position.set(x, this.height/2, z);
                        leg.castShadow = true;
                        leg.receiveShadow = true;
                        this.group.add(leg);
                    });
                });
                
                // คานเสริม
                const beamGeo = new THREE.BoxGeometry(0.1, 0.05, this.depth - 0.3);
                const beamMat = new THREE.MeshStandardMaterial({
                    color: this.legColor,
                    roughness: 0.7,
                    metalness: 0.1
                });
                
                [-0.8, 0, 0.8].forEach(x => {
                    const beam = new THREE.Mesh(beamGeo, beamMat);
                    beam.position.set(x, this.height/2.5, 0);
                    beam.castShadow = true;
                    beam.receiveShadow = true;
                    this.group.add(beam);
                });
                
                const crossBeamGeo = new THREE.BoxGeometry(this.width - 0.3, 0.05, 0.1);
                const crossBeamMat = new THREE.MeshStandardMaterial({
                    color: this.legColor,
                    roughness: 0.7,
                    metalness: 0.1
                });
                
                [-0.8, 0, 0.8].forEach(z => {
                    const crossBeam = new THREE.Mesh(crossBeamGeo, crossBeamMat);
                    crossBeam.position.set(0, this.height/2.5, z);
                    crossBeam.castShadow = true;
                    crossBeam.receiveShadow = true;
                    this.group.add(crossBeam);
                });
                
                // พื้นผิวกันลื่น
                const gripMat = new THREE.MeshStandardMaterial({
                    color: this.color,
                    roughness: 0.9,
                    metalness: 0.05
                });
                
                for (let i = -3; i <= 3; i++) {
                    const gripGeo = new THREE.BoxGeometry(0.02, 0.003, this.depth - 0.4);
                    const grip = new THREE.Mesh(gripGeo, gripMat);
                    grip.position.set(i * 0.35, this.height, 0);
                    grip.castShadow = true;
                    grip.receiveShadow = true;
                    this.group.add(grip);
                }
                
                for (let i = -3; i <= 3; i++) {
                    const gripGeo = new THREE.BoxGeometry(this.width - 0.4, 0.003, 0.02);
                    const grip = new THREE.Mesh(gripGeo, gripMat);
                    grip.position.set(0, this.height, i * 0.35);
                    grip.castShadow = true;
                    grip.receiveShadow = true;
                    this.group.add(grip);
                }
                
                // ช่องรถยก
                const pocketMat = new THREE.MeshStandardMaterial({
                    color: 0x2a3a4a,
                    roughness: 0.9,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.2
                });
                
                [-0.4, 0.4].forEach(x => {
                    const pocketGeo = new THREE.BoxGeometry(0.3, 0.1, 0.2);
                    const pocket = new THREE.Mesh(pocketGeo, pocketMat);
                    pocket.position.set(x, 0.06, -1.0);
                    pocket.castShadow = true;
                    pocket.receiveShadow = true;
                    this.group.add(pocket);
                    
                    const pocket2 = new THREE.Mesh(pocketGeo, pocketMat);
                    pocket2.position.set(x, 0.06, 1.0);
                    pocket2.castShadow = true;
                    pocket2.receiveShadow = true;
                    this.group.add(pocket2);
                });
            }
            
            get() {
                return this.group;
            }
            
            setPosition(x, y, z) {
                this.group.position.set(x, y, z);
            }
            
            setRotation(x, y, z) {
                this.group.rotation.set(x, y, z);
            }
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 4, 8);  // ปรับกล้องให้เห็น 2 พาเลท 1 ชั้น 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
        mainLight.position.set(5, 8, 7);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0x88aacc, 0.6);
        fillLight.position.set(-4, 3, 5);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xccaa88, 0.4);
        backLight.position.set(-2, 2, -8);
        scene.add(backLight);

        // --- Texture Creation: Top/Bottom (เติมสีแดงวงกลม 4 วง) ---
        function createTopTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            ctx.textAlign = 'center';
            
            ctx.fillStyle = '#0e3a66';
            ctx.font = 'bold 220px sans-serif';
            ctx.fillText('POLIMAXX', centerX, 400);
            
            ctx.strokeStyle = '#f37021';
            ctx.lineWidth = 4;
            ctx.beginPath(); 
            ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2); 
            ctx.stroke();

            ctx.fillStyle = '#f37021';
            ctx.font = 'bold 360px sans-serif';
            ctx.fillText('PP', centerX, 840);

            ctx.fillStyle = '#0e3a66';
            ctx.font = 'bold 150px sans-serif';
            ctx.fillText('POLYETHYLENE', centerX, 1040);

            ctx.strokeStyle = '#f37021'; 
            ctx.lineWidth = 30;
            ctx.beginPath(); ctx.arc(1760, 400, 120, 0, Math.PI * 2); ctx.stroke();
            
            ctx.lineWidth = 20; 
            ctx.beginPath(); ctx.arc(1840, 640, 60, 0, Math.PI * 2); ctx.stroke();

            // วงกลม 4 วงเหนือ NET WEIGHT (เติมสีแดงด้านใน)
            for(let i=0; i<4; i++) {
                const x = 400 + (i * 170);
                const y = 1360;
                
                ctx.fillStyle = '#ff0000';
                ctx.beginPath(); 
                ctx.arc(x, y, 64, 0, Math.PI * 2); 
                ctx.fill();
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 6;
                ctx.beginPath(); 
                ctx.arc(x, y, 64, 0, Math.PI * 2); 
                ctx.stroke();
                
                ctx.fillStyle = '#ff6666';
                ctx.beginPath();
                ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.textAlign = 'left'; 
            ctx.fillStyle = '#111'; 
            ctx.font = 'bold 120px sans-serif';
            ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Texture Creation: Side Original ---
        function createSideTextureOriginal() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000000';
            ctx.textAlign = 'left';
            
            ctx.font = 'bold 100px sans-serif';
            ctx.fillText('1126NK 026020408', 150, 280);

            const symbolX = 1100;
            const symbolY = 250;
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(symbolX, symbolY - 60);
            ctx.lineTo(symbolX + 60, symbolY);
            ctx.lineTo(symbolX, symbolY + 60);
            ctx.lineTo(symbolX - 60, symbolY);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX, symbolY - 60); ctx.lineTo(symbolX, symbolY + 60); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX - 30, symbolY); ctx.lineTo(symbolX + 30, symbolY); ctx.stroke();

            ctx.font = 'bold 40px sans-serif';
            ctx.fillText('TIS.1306-2', symbolX + 85, 235);
            ctx.fillText('PP-01-1-5', symbolX + 85, 295);
            
            ctx.font = 'bold 55px sans-serif';
            ctx.fillText('P (RoHS)', 1550, 275);

            const qrX = 1800;
            const qrY = 190;
            ctx.fillRect(qrX, qrY, 120, 120); 
            ctx.fillStyle = '#fff';
            ctx.fillRect(qrX + 25, qrY + 25, 25, 25);
            ctx.fillRect(qrX + 70, qrY + 70, 25, 25);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Blank Texture ---
        function createBlankTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return new THREE.CanvasTexture(canvas);
        }

        const topTex = createTopTexture();
        const sideTexOriginal = createSideTextureOriginal();
        const blankTex = createBlankTexture();

        // --- SACK: ถุงพลาสติก ---
        // ลดสัดส่วนถุงลง 10% เพื่อป้องกันการล้นพาเลท
        const bagLength = 0.81;      // ความยาว (was 0.9)
        const bagWidth = 0.72;       // ความกว้าง (was 0.8)
        const bagHeight = 0.22;     // ความสูง (ลดลงสำหรับการซ้อน 5 ชั้น)
        const gap = 0.20;          // ช่องว่างเท่ากันทุกตำแหน่ง
        
        const segments = 32;

        const sackGeo = new THREE.BoxGeometry(bagWidth, bagHeight, bagLength, segments, segments, segments);
        const pos = sackGeo.attributes.position;
        const uv = sackGeo.attributes.uv;
        const v3 = new THREE.Vector3();

        // ปรับรูปทรงโค้งนูน
        for (let i = 0; i < pos.count; i++) {
            v3.fromBufferAttribute(pos, i);
            
            const nx = v3.x / (bagWidth / 2);
            const ny = v3.y / (bagHeight / 2);
            const nz = v3.z / (bagLength / 2);
            
            const endCurve = Math.pow(Math.abs(nz), 2.2);
            v3.y *= (1 - endCurve * 0.25);
            v3.x *= (1 - endCurve * 0.08);
            
            const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
            v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
            
            const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
            v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
            
            pos.setXYZ(i, v3.x, v3.y, v3.z);
        }

        // UV Mapping
        for (let i = 0; i < pos.count; i++) {
            v3.fromBufferAttribute(pos, i);
            const normalX = sackGeo.attributes.normal.getX(i);
            const normalY = sackGeo.attributes.normal.getY(i);
            
            if (Math.abs(normalY) > 0.5) {
                if (normalY > 0) {
                    uv.setXY(i, (v3.x / bagWidth) + 0.5, 1.0 - ((v3.z / bagLength) + 0.5));
                } else {
                    uv.setXY(i, (v3.x / bagWidth) + 0.5, (v3.z / bagLength) + 0.5);
                }
            } else if (Math.abs(normalX) > 0.5) {
                const u = (v3.z / bagLength) + 0.5;
                const v = (v3.y / bagHeight) + 0.5;
                if (normalX > 0) {
                    uv.setXY(i, 1.0 - u, v);
                } else {
                    uv.setXY(i, u, v);
                }
            }
        }

        sackGeo.computeVertexNormals();

        // Materials
        const sideMatOriginal = new THREE.MeshStandardMaterial({ 
            map: sideTexOriginal, 
            roughness: 0.5, 
            metalness: 0.05,
            side: THREE.DoubleSide
        });
        
        const blankSideMat = new THREE.MeshStandardMaterial({ 
            map: blankTex, 
            roughness: 0.5, 
            metalness: 0.05,
            side: THREE.DoubleSide
        });
        
        const printedMat = new THREE.MeshStandardMaterial({ 
            map: topTex, 
            roughness: 0.45, 
            metalness: 0.05, 
            bumpMap: topTex, 
            bumpScale: 0.0008,
            side: THREE.DoubleSide
        });
        
        const blankMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 0.6,
            side: THREE.DoubleSide
        });

        const materials = [
            blankSideMat,       // Right
            sideMatOriginal,    // Left
            printedMat,         // Top
            printedMat,         // Bottom
            blankMat,           // Front
            blankMat            // Back
        ];

        // ฟังก์ชันสร้างถุง POLIMAXX
        function createPolimaxxBag(posX, posY, posZ, rotationY) {
            const sack = new THREE.Mesh(sackGeo, materials.map(mat => mat.clone()));
            sack.castShadow = true;
            sack.receiveShadow = true;
            
            // เพิ่มเม็ดพลาสติกด้านใน
            const pelletGroup = new THREE.Group();
            for (let i = 0; i < 30; i++) {
                const size = 0.008 + Math.random() * 0.006;
                const pelletGeo = new THREE.SphereGeometry(size, 4, 4);
                const pelletMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.4,
                    metalness: 0.02,
                    transparent: true,
                    opacity: 0.25
                });
                const pellet = new THREE.Mesh(pelletGeo, pelletMat);
                pellet.position.x = (Math.random() - 0.5) * 0.5;
                pellet.position.y = (Math.random() - 0.3) * 0.15;
                pellet.position.z = (Math.random() - 0.5) * 0.9;
                pellet.castShadow = false;
                pellet.receiveShadow = false;
                pelletGroup.add(pellet);
            }
            sack.add(pelletGroup);
            
            sack.position.set(posX, posY, posZ);
            sack.rotation.y = rotationY;
            
            return sack;
        }

        // --- สร้างพาเลทพลาสติก 2 ตัววางข้างๆกัน ---
        const pallet1 = new PlasticPallet({
            width: 2.3,
            depth: 2.3,
            height: 0.15,
            color: 0x6b7c8d,
            legColor: 0x5a6b7c
        });
        
        pallet1.setPosition(-2.5, -0.15, 0);  // วางซ้าย
        scene.add(pallet1.get());

        const pallet2 = new PlasticPallet({
            width: 2.3,
            depth: 2.3,
            height: 0.15,
            color: 0x6b7c8d,
            legColor: 0x5a6b7c
        });
        
        pallet2.setPosition(2.5, -0.15, 0);   // วางขวา
        scene.add(pallet2.get());

        // === วางถุง 5 ใบต่อชั้น แบบ 2+3 มีช่องว่างเท่ากัน 0.15 ===
        
        // === คำนวณระยะห่างแยกตามจำนวนถุง ให้เห็น gap ชัดเจน ===
        
        // --- ชั้นที่ 1 (Layer 1) ---
        
        // วาง 2 ถุงตามยาว (หมุน 90°) ด้านหน้า 
        const frontRowZ = -0.55;
        
        // สำหรับ 2 ถุง: เพิ่ม gap ให้เห็นช่องว่างชัดเจน
        // ถุงหมุน 90° ดังนั้นความกว้างในแกน X = bagLength = 1.1
        // ตำแหน่ง = ±(bagLength + gap_front)/2
        const gapFront = 0.25;  // เพิ่ม gap สำหรับ 2 ถุงให้ชัดเจน
        const frontBagSpacing = (bagLength + gapFront)/2;  // (1.1 + 0.25)/2 = 0.675
        
        const frontBagPositions = [
            {x: -frontBagSpacing, z: frontRowZ, rot: Math.PI/2},  // ถุงซ้าย (-0.675)  
            {x: frontBagSpacing, z: frontRowZ, rot: Math.PI/2}    // ถุงขวา (0.675)
        ];

        // (central front placement removed — bags placed per-pallet below)

        // วาง 3 ถุงตามขวาง (หมุน 0°) ด้านหลัง
        const rearRowZ = 0.6;
        
        // สำหรับ 3 ถุง: เพิ่ม gap ให้เห็นช่องว่างชัดเจน
        // ถุงไม่หมุน ดังนั้นความกว้างในแกน X = bagWidth = 0.75
        // ตำแหน่งถุงข้าง = ±(bagWidth + gap_rear)
        const gapRear = 0.45;   // เพิ่ม gap ให้เห็นช่องว่างชัดเจน
        const rearBagSpacing = bagWidth + gapRear;  // 0.75 + 0.35 = 1.10
        
        const rearBagPositions = [
            {x: -rearBagSpacing, z: rearRowZ, rot: 0},  // ถุงซ้ายสุด (-0.95)
            {x: 0, z: rearRowZ, rot: 0},                // ถุงกลาง (0)
            {x: rearBagSpacing, z: rearRowZ, rot: 0}    // ถุงขวาสุด (0.95)
        ];

        // === เรียงถุง 1 ชั้น บน 2 พาเลท ===
        
        // --- พาเลทซ้าย: 2 ถุงหน้า + 3 ถุงหลัง ---
        frontBagPositions.forEach(pos => {
            const bag = createPolimaxxBag(pos.x - 2.5, 0.2, pos.z, pos.rot);  // ลดตำแหน่ง X 2.5
            scene.add(bag);
        });

        rearBagPositions.forEach(pos => {
            const bag = createPolimaxxBag(pos.x - 2.5, 0.2, pos.z, pos.rot);  // ลดตำแหน่ง X 2.5
            scene.add(bag);
        });

        // --- พาเลทขวา: 3 ถุงหน้า + 2 ถุงหลัง ---
        // ปรับให้พาเลทขวาใช้ gap เล็กกว่าเพื่อให้ถุงอยู่ภายในขอบพาเลท (ไม่ล้น)
        const pallet2OffsetX = 2.5;
        const gapFrontRight = 0.15; // น้อยกว่า gapFront เพื่อดึงถุงเข้า
        const gapRearRight = 0.15;
        const frontBagSpacingRight = (bagLength + gapFrontRight) / 2;
        const rearBagSpacingRight = bagWidth + gapRearRight;

        const frontLayer2Positions = [
            {x: -rearBagSpacingRight + pallet2OffsetX, z: frontRowZ, rot: 0},
            {x: 0 + pallet2OffsetX, z: frontRowZ, rot: 0},
            {x: rearBagSpacingRight + pallet2OffsetX, z: frontRowZ, rot: 0}
        ];

        frontLayer2Positions.forEach(pos => {
            const bag = createPolimaxxBag(pos.x, 0.2, pos.z, pos.rot);
            scene.add(bag);
        });

        const rearLayer2Positions = [
            {x: -frontBagSpacingRight + pallet2OffsetX, z: rearRowZ, rot: Math.PI/2},
            {x: frontBagSpacingRight + pallet2OffsetX, z: rearRowZ, rot: Math.PI/2}
        ];

        rearLayer2Positions.forEach(pos => {
            const bag = createPolimaxxBag(pos.x, 0.2, pos.z, pos.rot);
            scene.add(bag);
        });

        // --- เพิ่มชั้นที่เหลือสำหรับ pallet1 (รวมเป็น 8 ชั้น) ---
        // pallet1 อยู่ที่ X offset = -2.5
        const pallet1OffsetX = -2.5;
        const layerCount = 8;
        const baseY = 0.2;
        const layerStep = 0.25; // ตามที่กำหนดก่อนหน้านี้

        for (let li = 1; li < layerCount; li++) {
            const y = baseY + li * layerStep;

            if (li % 2 === 1) {
                // ชั้นสลับ (3 หน้า + 2 หลัง)
                const pFront = [
                    { x: -rearBagSpacing + pallet1OffsetX, z: frontRowZ, rot: 0 },
                    { x: 0 + pallet1OffsetX, z: frontRowZ, rot: 0 },
                    { x: rearBagSpacing + pallet1OffsetX, z: frontRowZ, rot: 0 }
                ];
                pFront.forEach(pos => {
                    const bag = createPolimaxxBag(pos.x, y, pos.z, pos.rot);
                    scene.add(bag);
                });

                const pRear = [
                    { x: -frontBagSpacing + pallet1OffsetX, z: rearRowZ, rot: Math.PI/2 },
                    { x: frontBagSpacing + pallet1OffsetX, z: rearRowZ, rot: Math.PI/2 }
                ];
                pRear.forEach(pos => {
                    const bag = createPolimaxxBag(pos.x, y, pos.z, pos.rot);
                    scene.add(bag);
                });
            } else {
                // ชั้นแบบเดิม (2 หน้า + 3 หลัง)
                frontBagPositions.forEach(pos => {
                    const bag = createPolimaxxBag(pos.x + pallet1OffsetX, y, pos.z, pos.rot);
                    scene.add(bag);
                });
                rearBagPositions.forEach(pos => {
                    const bag = createPolimaxxBag(pos.x + pallet1OffsetX, y, pos.z, pos.rot);
                    scene.add(bag);
                });
            }
        }

        // --- เพิ่มเส้นบอกระยะและช่องว่าง ---
        
        // เส้นขอบพาเลทซ้าย
        const edgeMat = new THREE.LineBasicMaterial({ color: 0xf37021 });
        const pointsLeft = [
            [-3.65, 0.16, -1.15], [-1.35, 0.16, -1.15], 
            [-1.35, 0.16, 1.15], [-3.65, 0.16, 1.15], 
            [-3.65, 0.16, -1.15]
        ];
        const lineGeometryLeft = new THREE.BufferGeometry().setFromPoints(pointsLeft.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const lineLeft = new THREE.Line(lineGeometryLeft, edgeMat);
        scene.add(lineLeft);
        
        // เส้นขอบพาเลทขวา  
        const pointsRight = [
            [1.35, 0.16, -1.15], [3.65, 0.16, -1.15], 
            [3.65, 0.16, 1.15], [1.35, 0.16, 1.15], 
            [1.35, 0.16, -1.15]
        ];
        const lineGeometryRight = new THREE.BufferGeometry().setFromPoints(pointsRight.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const lineRight = new THREE.Line(lineGeometryRight, edgeMat);
        scene.add(lineRight);

        // เส้นแบ่งกึ่งกลางพาเลทซ้าย
        const centerLineMat = new THREE.LineBasicMaterial({ color: 0x88aacc, opacity: 0.3, transparent: true });
        const centerPointsLeft = [
            [-3.65, 0.17, 0], [-1.35, 0.17, 0]
        ];
        const centerLineGeoLeft = new THREE.BufferGeometry().setFromPoints(centerPointsLeft.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const centerLineLeft = new THREE.Line(centerLineGeoLeft, centerLineMat);
        scene.add(centerLineLeft);
        
        // เส้นแบ่งกึ่งกลางพาเลทขวา
        const centerPointsRight = [
            [1.35, 0.17, 0], [3.65, 0.17, 0]
        ];
        const centerLineGeoRight = new THREE.BufferGeometry().setFromPoints(centerPointsRight.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const centerLineRight = new THREE.Line(centerLineGeoRight, centerLineMat);
        scene.add(centerLineRight);

        // --- เพิ่มลูกศรแสดง Gap ---
        function createArrow(pos, dir, color, length = 0.2) {
            const arrowHelper = new THREE.ArrowHelper(
                new THREE.Vector3(dir[0], dir[1], dir[2]),
                new THREE.Vector3(pos[0], pos[1], pos[2]),
                length,
                color,
                0.1,
                0.05
            );
            scene.add(arrowHelper);
        }

        // แสดง Gap ระหว่างถุงหน้า
        createArrow([0, 0.3, -0.55], [1, 0, 0], 0xffaa00, 0.2);
        createArrow([0, 0.3, -0.55], [-1, 0, 0], 0xffaa00, 0.2);

        // --- พื้น ---
        const floorGeo = new THREE.CircleGeometry(15, 32);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x2a333d,
            roughness: 0.9,
            metalness: 0.1,
            side: THREE.DoubleSide
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.25;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(16, 20, 0x8899aa, 0x445566);
        gridHelper.position.y = -0.24;
        scene.add(gridHelper);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
