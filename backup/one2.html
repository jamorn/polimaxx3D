<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLIMAXX Bag Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        .panel { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            pointer-events: auto;
            max-width: 300px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="panel">
        <h1 class="text-xl font-bold text-gray-800 mb-2">POLIMAXX 3D</h1>
        <p class="text-xs text-gray-500 mb-4">แสดงผล Artwork และรูปทรงตาม Code ที่กำหนด</p>
        <div class="space-y-2 text-sm">
            <div class="flex justify-between">
                <span>Net Weight:</span>
                <span class="font-mono font-bold">25 KG</span>
            </div>
            <div class="flex justify-between">
                <span>Material:</span>
                <span class="font-mono font-bold">PP HOMO</span>
            </div>
            <div class="flex justify-between">
                <span>Batch:</span>
                <span class="font-mono text-blue-600">1126NK 0260204008</span>
            </div>
        </div>
        <hr class="my-4">
        <p class="text-[10px] leading-tight text-gray-400">
            *Artwork ประกอบด้วย: POLIMAXX Logo, PP Polyethylene, มอก. TIS.1306-2566, QR Code และสัญลักษณ์ RoHS
        </p>
    </div>
</div>

<script>
    // ============ CONFIG (จาก Code ของคุณ) ============
    const CONFIG = {
        PALLET: {
            WIDTH: 1.2,     // 1200 mm
            DEPTH: 1.0,     // 1000 mm
            HEIGHT: 0.15
        },
        BAG: {
            WIDTH: 0.3281,   // 328 mm
            LENGTH: 0.2007,  // 201 mm
            HEIGHT: 0.0993   // 99 mm
        },
        COLORS: {
            FRAME: 0xf37021,
            PALLET: 0x8B5A2B,
            WALL: 0xfc182f
        }
    };

    const MANUAL_PRESET_BAG = Object.freeze({
        WIDTH: 0.337,
        LENGTH: 0.233,
        HEIGHT: 0.14
    });

    const SHAPE_REFERENCE = Object.freeze({
        WIDTH: 0.525,
        LENGTH: 0.3211,
        HEIGHT: 0.1589,
        FRONT_BULGE_Z: 0.12,
        SIDE_BULGE_X: 0.22
    });

    // ============ Texture Factory (คัดลอกจาก Code ของคุณเพื่อความแม่นยำ) ============
    class TextureFactory {
        static createTopTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0e3a66';
            ctx.font = 'bold 220px sans-serif';
            ctx.fillText('POLIMAXX', centerX, 400);

            // วงกลมเล็กหลังชื่อ
            ctx.strokeStyle = '#f37021';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#f37021';
            ctx.font = 'bold 360px sans-serif';
            ctx.fillText('PP', centerX, 840);

            ctx.fillStyle = '#0e3a66';
            ctx.font = 'bold 150px sans-serif';
            ctx.fillText('POLYETHYLENE', centerX, 1040);

            // วงกลมขวาบน
            ctx.strokeStyle = '#f37021';
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.arc(1760, 400, 120, 0, Math.PI * 2);
            ctx.stroke();

            ctx.lineWidth = 20;
            ctx.beginPath();
            ctx.arc(1840, 640, 60, 0, Math.PI * 2);
            ctx.stroke();

            // จุดแดง 4 จุดด้านล่าง
            for (let i = 0; i < 4; i++) {
                const x = 400 + i * 170;
                const y = 1360;
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(x, y, 64, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x, y, 64, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#ff6666';
                ctx.beginPath();
                ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = '#111';
            ctx.font = 'bold 120px sans-serif';
            ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 16;
            tex.center.set(0.5, 0.5);
            tex.rotation = Math.PI; // หมุนตาม Code คุณ
            return tex;
        }

        static createFrontTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000000';
            ctx.textBaseline = 'middle';
            const midY = 512;
            let currentX = 650;

            ctx.textAlign = 'left';
            ctx.font = 'bold 130px sans-serif';
            ctx.fillText('1126NK 0260204008', currentX, midY);

            currentX += 1380;
            const symbolX = currentX;
            const symbolY = midY;

            // สัญลักษณ์ มอก.
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(symbolX, symbolY - 75);
            ctx.lineTo(symbolX + 75, symbolY);
            ctx.lineTo(symbolX, symbolY + 75);
            ctx.lineTo(symbolX - 75, symbolY);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX, symbolY - 75); ctx.lineTo(symbolX, symbolY + 75); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX - 35, symbolY); ctx.lineTo(symbolX + 35, symbolY); ctx.stroke();

            ctx.font = 'bold 60px sans-serif';
            ctx.fillText('TIS.1306-2566', symbolX + 110, midY - 38);
            ctx.fillText('PP-01-1-5-F', symbolX + 110, midY + 38);

            currentX += 540;
            const qrX = currentX;
            const qrY = midY - 85;
            ctx.fillStyle = '#000';
            ctx.fillRect(qrX, qrY, 170, 170);
            ctx.fillStyle = '#fff';
            // วาด QR จำลองตาม Code
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(qrX + 18 + i * 48, qrY + 18 + j * 48, 40, 40);
                    }
                }
            }

            ctx.fillStyle = '#000';
            currentX += 280;
            ctx.font = 'bold 75px sans-serif';
            ctx.fillText('PP HOMO', currentX, midY - 38);
            ctx.fillText('B 06:28', currentX, midY + 38);

            currentX += 460;
            ctx.font = 'italic bold 85px sans-serif';
            ctx.fillText('(RoHS)', currentX, midY);

            return new THREE.CanvasTexture(canvas);
        }

        static createBlankTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return new THREE.CanvasTexture(canvas);
        }
    }

    // ============ Bag Class (คัดลอกจาก Code ของคุณ) ============
    class POLIMAXBag {
        constructor() {
            this.dimensions = { 
                width: MANUAL_PRESET_BAG.WIDTH, 
                length: MANUAL_PRESET_BAG.LENGTH, 
                height: MANUAL_PRESET_BAG.HEIGHT 
            };
            this.geometry = this.createGeometry();
            this.textures = {
                top: TextureFactory.createTopTexture(),
                front: TextureFactory.createFrontTexture(),
                blank: TextureFactory.createBlankTexture()
            };
            this.materials = this.createMaterials();
            this.mesh = new THREE.Mesh(this.geometry, this.materials);
            this.mesh.castShadow = true;
            this.mesh.receiveShadow = true;
        }

        createGeometry() {
            const { width, length, height } = this.dimensions;
            const sideBulge = SHAPE_REFERENCE.SIDE_BULGE_X * (width / SHAPE_REFERENCE.WIDTH);
            const frontBulge = SHAPE_REFERENCE.FRONT_BULGE_Z * (length / SHAPE_REFERENCE.LENGTH);
            const segments = 32;
            const geo = new THREE.BoxGeometry(width, height, length, segments, segments, segments);
            
            const pos = geo.attributes.position;
            const v3 = new THREE.Vector3();

            for (let i = 0; i < pos.count; i++) {
                v3.fromBufferAttribute(pos, i);
                const nx = v3.x / (width / 2);
                const ny = v3.y / (height / 2);
                const nz = v3.z / (length / 2);
                
                const endCurve = Math.pow(Math.abs(nz), 2.2);
                v3.y *= (1 - endCurve * 0.25);
                v3.x *= (1 - endCurve * 0.08);
                
                const sideConvex = sideBulge * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
                
                const frontConvex = frontBulge * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
                
                pos.setXYZ(i, v3.x, v3.y, v3.z);
            }

            geo.computeVertexNormals();

            // UV Mapping ตาม Code คุณ
            const uv = geo.attributes.uv;
            const normal = geo.attributes.normal;
            for (let i = 0; i < pos.count; i++) {
                v3.fromBufferAttribute(pos, i);
                const normalX = normal.getX(i);
                const normalY = normal.getY(i);
                const normalZ = normal.getZ(i);

                if (Math.abs(normalY) > 0.5) { // TOP / BOTTOM
                    if (normalY > 0) {
                        uv.setXY(i, (v3.z / length) + 0.5, (v3.x / width) + 0.5);
                    } else {
                        uv.setXY(i, (v3.x / width) + 0.5, (v3.z / length) + 0.5);
                    }
                } else if (Math.abs(normalZ) > 0.5) { // FRONT / BACK
                    const u = (v3.x / width) + 0.5;
                    const v = (v3.y / height) + 0.5;
                    if (normalZ > 0) uv.setXY(i, u, v);
                    else uv.setXY(i, 1.0 - u, v);
                } else if (Math.abs(normalX) > 0.5) { // SIDES
                    const u = (v3.z / length) + 0.5;
                    const v = (v3.y / height) + 0.5;
                    if (normalX > 0) uv.setXY(i, 1.0 - u, v);
                    else uv.setXY(i, u, v);
                }
            }
            return geo;
        }

        createMaterials() {
            const blank = new THREE.MeshStandardMaterial({ map: this.textures.blank, roughness: 0.6 });
            const top = new THREE.MeshStandardMaterial({ map: this.textures.top, roughness: 0.45, metalness: 0.05 });
            const front = new THREE.MeshStandardMaterial({ map: this.textures.front, roughness: 0.4, metalness: 0.05 });
            // [right, left, top, bottom, front, back]
            return [blank, blank, top, blank, front, blank];
        }
    }

    // ============ Scene Setup ============
    let scene, camera, renderer, bag;

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf5f5f7);

        camera = new THREE.Camera(); // จะถูกแทนที่ด้วย PerspectiveCamera ใน window.onload
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 7);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // สร้างพื้น (Pallet จำลอง)
        const palletGeo = new THREE.BoxGeometry(CONFIG.PALLET.WIDTH, CONFIG.PALLET.HEIGHT, CONFIG.PALLET.DEPTH);
        const palletMat = new THREE.MeshStandardMaterial({ color: CONFIG.COLORS.PALLET });
        const pallet = new THREE.Mesh(palletGeo, palletMat);
        pallet.position.y = -CONFIG.PALLET.HEIGHT / 2;
        pallet.receiveShadow = true;
        scene.add(pallet);

        // สร้างถุง POLIMAXX
        bag = new POLIMAXBag();
        bag.mesh.position.y = MANUAL_PRESET_BAG.HEIGHT / 2;
        scene.add(bag.mesh);

        // Setup Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0.8, 0.8, 0.8);
        camera.lookAt(0, 0, 0);

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        bag.mesh.rotation.y += 0.005; // หมุนช้าๆ ให้เห็น Artwork รอบๆ
        renderer.render(scene, camera);
    }

    window.onload = init;
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>

</body>
</html>
