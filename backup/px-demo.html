<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POLIMAXX - Blue Pallet with 5 Bags (with lil-gui)</title>
    <style>
        body { margin:0; overflow:hidden; background:#1a1e2a; font-family: Arial, sans-serif; }
        .ui-panel {
            position: absolute; left: 20px; top: 20px; z-index: 100;
            background: rgba(0,0,0,0.85); color: #fff; padding: 18px 28px; border-radius: 12px;
            border-left: 5px solid #f37021; backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { margin: 0; font-size: 18px; color: #f37021; text-transform: uppercase; letter-spacing: 2px; }
        p { margin: 8px 0 0; font-size: 14px; opacity: 0.95; }
        .stats {
            position: absolute; bottom: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.7); color: #ccc; padding: 15px 25px; border-radius: 12px;
            border-left: 4px solid #4CAF50; backdrop-filter: blur(4px);
            font-size: 14px;
        }
        .dimension {
            position: absolute; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.7); color: #fff; padding: 15px 25px; border-radius: 12px;
            border-left: 4px solid #4CAF50; backdrop-filter: blur(4px);
            font-size: 14px;
        }
        /* lil-gui custom styling */
        .lil-gui { 
            z-index: 1000 !important; 
            top: 20px !important; 
            right: 20px !important;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
            }
        }
    </script>
</head>
<body>
    <div class="ui-panel">
        <h1>POLIMAXX - Blue Pallet with 5 Bags</h1>
        <p>✅ ใช้ lil-gui ปรับขนาดถุงทั้ง 5 ใบพร้อมกัน | หาขนาดที่พอดีกรอบ</p>
    </div>
    <div class="stats">
        <span style="color: #f37021; font-weight: bold;">⚡ คำแนะนำ:</span><br>
        🎛️ ใช้แผงควบคุมด้านขวาบนปรับขนาดถุง<br>
        📏 ปรับ WIDTH, LENGTH, HEIGHT จนกว่าจะพอดีกรอบ<br>
        ✅ เมื่อได้ค่าที่พอดีแล้ว บอกค่าให้ AI บันทึกครับ
    </div>
    <div class="dimension" id="dimInfo">
        Loading dimensions...
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import GUI from 'lil-gui';

        // ============ Global Bag Dimensions (ปรับผ่าน GUI) ============
        const bagDimensions = {
            WIDTH: 0.320,      // 320 mm (แกน X)
            LENGTH: 0.275,     // 275 mm (แกน Z)
            HEIGHT: 0.136,     // 136 mm (แกน Y)
            GAP: 0.150,        // 150 mm
            ROW_GAP: 0.080     // 80 mm
        };

        // ============ Texture Factory ============
        class TextureFactory {
            static createTopTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 2048; canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                
                const pad = 48;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, pad);
                ctx.fillRect(0, canvas.height - pad, canvas.width, pad);
                ctx.fillRect(0, 0, pad, canvas.height);
                ctx.fillRect(canvas.width - pad, 0, pad, canvas.height);

                ctx.fillStyle = '#0e3a66'; 
                ctx.textAlign = 'center'; 
                ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', canvas.width/2, 400);

                ctx.fillStyle = '#f37021';
                ctx.font = 'bold 360px sans-serif';
                ctx.fillText('PP', canvas.width/2, 840);

                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 150px sans-serif';
                ctx.fillText('POLYETHYLENE', canvas.width/2, 1040);

                for(let i = 0; i < 4; i++) {
                    const x = 400 + (i * 170);
                    const y = 1360;
                    
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.textAlign = 'left';
                ctx.fillStyle = '#111';
                ctx.font = 'bold 120px sans-serif';
                ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true;
                return tex;
            }

            static createBlankTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d'); 
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0,0,canvas.width,canvas.height);
                return new THREE.CanvasTexture(canvas);
            }
        }

        // ============ POLIMAXBag Class ============
        class POLIMAXBag {
            constructor(width, length, height) {
                this.BAG_WIDTH = width;
                this.BAG_LENGTH = length;
                this.BAG_HEIGHT = height;
                this.geometry = this.createGeometry();
                this.textures = {
                    top: TextureFactory.createTopTexture(),
                    blank: TextureFactory.createBlankTexture()
                };
                this.materials = this.createMaterials();
            }

            createGeometry() {
                const segments = 24;
                const geo = new THREE.BoxGeometry(
                    this.BAG_WIDTH, 
                    this.BAG_HEIGHT, 
                    this.BAG_LENGTH, 
                    segments, segments, segments
                );
                
                const pos = geo.attributes.position; 
                const v3 = new THREE.Vector3();
                
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const nx = v3.x / (this.BAG_WIDTH / 2);
                    const ny = v3.y / (this.BAG_HEIGHT / 2);
                    const nz = v3.z / (this.BAG_LENGTH / 2);
                    
                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.25);
                    v3.x *= (1 - endCurve * 0.08);
                    
                    const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
                    
                    const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
                    
                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }
                
                geo.computeVertexNormals();

                const uv = geo.attributes.uv; 
                const normal = geo.attributes.normal;
                
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const normalX = normal.getX(i); 
                    const normalY = normal.getY(i); 
                    const normalZ = normal.getZ(i);
                    
                    if (Math.abs(normalY) > 0.5) {
                        if (normalY > 0) 
                            uv.setXY(i, (v3.z / this.BAG_LENGTH) + 0.5, (v3.x / this.BAG_WIDTH) + 0.5);
                        else 
                            uv.setXY(i, (v3.x / this.BAG_WIDTH) + 0.5, (v3.z / this.BAG_LENGTH) + 0.5);
                    } else if (Math.abs(normalZ) > 0.5) {
                        const u = (v3.x / this.BAG_WIDTH) + 0.5; 
                        const v = (v3.y / this.BAG_HEIGHT) + 0.5;
                        if (normalZ > 0) 
                            uv.setXY(i, u, v); 
                        else 
                            uv.setXY(i, 1.0 - u, v);
                    } else if (Math.abs(normalX) > 0.5) {
                        const u = (v3.z / this.BAG_LENGTH) + 0.5; 
                        const v = (v3.y / this.BAG_HEIGHT) + 0.5;
                        if (normalX > 0) 
                            uv.setXY(i, 1.0 - u, v); 
                        else 
                            uv.setXY(i, u, v);
                    }
                }
                return geo;
            }

            createMaterials() {
                const sideMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
                const topMat = new THREE.MeshStandardMaterial({ map: this.textures.top, roughness: 0.45, metalness: 0.05, side: THREE.DoubleSide, transparent: true, opacity: 0.96 });
                const bottomMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide, transparent: true, opacity: 0.92 });
                
                return [sideMat, sideMat, topMat, bottomMat, sideMat, sideMat];
            }

            createInstance(posX, posY, posZ, rotationY = 0) {
                const clonedMats = this.materials.map(mat => mat.clone());
                const mesh = new THREE.Mesh(this.geometry, clonedMats);
                mesh.castShadow = true; 
                mesh.receiveShadow = true;
                mesh.position.set(posX, posY, posZ); 
                mesh.rotation.y = rotationY;
                return mesh;
            }
        }

        // ============ Blue Pallet Class (1200x1000) ============
        class BluePallet {
            constructor(width = 1.2, length = 1.0, height = 0.15, color = 0x0a3d91) {
                this.width = width;
                this.length = length;
                this.height = height;
                this.group = new THREE.Group();
                const plasticMat = new THREE.MeshLambertMaterial({ color: color });
                
                const topDeck = new THREE.Mesh(new THREE.BoxGeometry(width, 0.03, length), plasticMat);
                topDeck.position.y = height - 0.015;
                topDeck.castShadow = true;
                topDeck.receiveShadow = true;
                this.group.add(topDeck);
                
                const legPositions = [
                    {x:-0.52, z:-0.42}, {x:0, z:-0.42}, {x:0.52, z:-0.42},
                    {x:-0.52, z:0}, {x:0, z:0}, {x:0.52, z:0},
                    {x:-0.52, z:0.42}, {x:0, z:0.42}, {x:0.52, z:0.42}
                ];
                
                legPositions.forEach(pos => {
                    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.15, height - 0.03, 0.15), plasticMat);
                    leg.position.set(pos.x, (height - 0.03) / 2, pos.z);
                    leg.castShadow = true;
                    leg.receiveShadow = true;
                    this.group.add(leg);
                });

                const edgeMat = new THREE.LineBasicMaterial({ color: 0x4aa3df });
                const points = [
                    [-width/2, height + 0.01, -length/2], [width/2, height + 0.01, -length/2],
                    [width/2, height + 0.01, length/2], [-width/2, height + 0.01, length/2],
                    [-width/2, height + 0.01, -length/2]
                ];
                const lineGeometry = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
                const line = new THREE.Line(lineGeometry, edgeMat);
                this.group.add(line);
            }

            get() { return this.group; }
            setPosition(x, y, z) { this.group.position.set(x, y, z); }
        }

        // ============ Scene Setup ============
        const scene = new THREE.Scene(); 
        scene.background = new THREE.Color(0x1a1e2a);
        scene.fog = new THREE.FogExp2(0x1a1e2a, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 1.5, 3.5);
        camera.lookAt(0, 0.3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; 
        controls.autoRotate = false;
        controls.target.set(0, 0.3, 0);

        // ============ Lighting ============
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); 
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.5); 
        mainLight.position.set(4, 7, 6);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0x88aacc, 0.5);
        fillLight.position.set(-3, 2, 5);
        scene.add(fillLight);

        // ============ Ground ============
        const floorGeo = new THREE.CircleGeometry(8, 32);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a333d, roughness: 0.9, metalness: 0.1, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.25;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(10, 20, 0x8899aa, 0x445566);
        gridHelper.position.y = -0.24;
        scene.add(gridHelper);

        // ============ Create Blue Pallet ============
        const pallet = new BluePallet(1.2, 1.0, 0.15, 0x0a3d91);
        pallet.setPosition(0, -0.15, 0);
        scene.add(pallet.get());

        // ============ Create Bags ============
        let bagFactory = new POLIMAXBag(bagDimensions.WIDTH, bagDimensions.LENGTH, bagDimensions.HEIGHT);
        let bags = [];

        function createBags() {
            // Remove old bags
            bags.forEach(bag => pallet.get().remove(bag));
            bags = [];

            const bagW = bagDimensions.WIDTH;
            const bagL = bagDimensions.LENGTH;
            const bagH = bagDimensions.HEIGHT;
            const GAP = bagDimensions.GAP;
            const ROW_GAP = bagDimensions.ROW_GAP;
            const palletTop = pallet.height + 0.01;

            // Front Row: 2 Bags (0°)
            const frontZ = -0.25;
            const frontXOffset = bagW/2 + GAP/2;
            [-frontXOffset, frontXOffset].forEach(x => {
                const bag = bagFactory.createInstance(x, palletTop + bagH/2, frontZ, 0);
                pallet.get().add(bag);
                bags.push(bag);
            });

            // Rear Row: 3 Bags (90°)
            const rearZ = frontZ + (bagL/2) + (bagW/2) + ROW_GAP;
            const rearXOffset = bagL + GAP;
            [-rearXOffset, 0, rearXOffset].forEach(x => {
                const bag = bagFactory.createInstance(x, palletTop + bagH/2, rearZ, Math.PI/2);
                pallet.get().add(bag);
                bags.push(bag);
            });

            updateDimInfo();
        }

        createBags();

        // ============ 🎛️ lil-gui Control Panel ============
        const gui = new GUI({ title: '🎛️ Bag Dimensions', width: 320 });
        
        const params = {
            width_mm: bagDimensions.WIDTH * 1000,
            length_mm: bagDimensions.LENGTH * 1000,
            height_mm: bagDimensions.HEIGHT * 1000,
            gap_mm: bagDimensions.GAP * 1000,
            rowGap_mm: bagDimensions.ROW_GAP * 1000,
            reset: () => {
                params.width_mm = 320;
                params.length_mm = 275;
                params.height_mm = 136;
                params.gap_mm = 80;
                params.rowGap_mm = 80;
                gui.controllers.forEach(c => c.updateDisplay());
                updateDimensions();
            },
            copyValues: () => {
                const text = `WIDTH: ${params.width_mm} mm, LENGTH: ${params.length_mm} mm, HEIGHT: ${params.height_mm} mm, GAP: ${params.gap_mm} mm, ROW_GAP: ${params.rowGap_mm} mm`;
                navigator.clipboard.writeText(text);
                alert('✅ คัดลอกค่าแล้ว:\n' + text);
            }
        };

        const folder = gui.addFolder('📦 Bag Size (mm)');
        folder.add(params, 'width_mm', 100, 600, 1).name('WIDTH (X)').onChange(updateDimensions);
        folder.add(params, 'length_mm', 100, 600, 1).name('LENGTH (Z)').onChange(updateDimensions);
        folder.add(params, 'height_mm', 50, 300, 1).name('HEIGHT (Y)').onChange(updateDimensions);
        folder.open();

        const folder2 = gui.addFolder('📏 Gap Settings (mm)');
        folder2.add(params, 'gap_mm', 20, 150, 1).name('Gap ระหว่างถุง').onChange(updateDimensions);
        folder2.add(params, 'rowGap_mm', 20, 150, 1).name('Row Gap').onChange(updateDimensions);
        folder2.open();

        const folder3 = gui.addFolder('⚡ Actions');
        folder3.add(params, 'reset').name('🔄 Reset to Default');
        folder3.add(params, 'copyValues').name('📋 Copy Values');
        folder3.open();

        function updateDimensions() {
            bagDimensions.WIDTH = params.width_mm / 1000;
            bagDimensions.LENGTH = params.length_mm / 1000;
            bagDimensions.HEIGHT = params.height_mm / 1000;
            bagDimensions.GAP = params.gap_mm / 1000;
            bagDimensions.ROW_GAP = params.rowGap_mm / 1000;

            bagFactory = new POLIMAXBag(bagDimensions.WIDTH, bagDimensions.LENGTH, bagDimensions.HEIGHT);
            createBags();
        }

        function updateDimInfo() {
            const bagW = bagDimensions.WIDTH;
            const bagL = bagDimensions.LENGTH;
            const bagH = bagDimensions.HEIGHT;
            const GAP = bagDimensions.GAP;
            const ROW_GAP = bagDimensions.ROW_GAP;
            const frontXOffset = bagW/2 + GAP/2;
            const rearXOffset = bagL + GAP;
            const frontZ = -0.25;
            const rearZ = frontZ + (bagL/2) + (bagW/2) + ROW_GAP;

            // Check if bags fit within pallet
            const frontEdgeX = frontXOffset + bagW/2;
            const rearEdgeX = rearXOffset + bagL/2;
            const frontEdgeZ_front = Math.abs(frontZ) + bagL/2;
            const rearEdgeZ_rear = rearZ + bagW/2;
            
            const fitX = Math.max(frontEdgeX, rearEdgeX) <= 0.60;
            const fitZ = Math.max(frontEdgeZ_front, rearEdgeZ_rear) <= 0.50;

            document.getElementById('dimInfo').innerHTML = `
                <span style="color: #88aacc; font-weight: bold;">📐 ขนาดถุงปัจจุบัน:</span><br>
                ${Math.round(bagW*1000)} × ${Math.round(bagL*1000)} × ${Math.round(bagH*1000)} mm<br>
                <span style="color: #f37021;">Gap: ${Math.round(GAP*1000)} mm | Row: ${Math.round(ROW_GAP*1000)} mm</span><br>
                <hr style="border-color:#444; margin:8px 0;">
                🔹 แถวหน้า: X=[±${frontXOffset.toFixed(3)}] m<br>
                🔹 แถวหลัง: X=[±${rearXOffset.toFixed(3)}] m<br>
                <hr style="border-color:#444; margin:8px 0;">
                ${fitX && fitZ ? 
                    '<span style="color:#4CAF50; font-weight:bold;">✅ พอดีกรอบ! ไม่ล้น</span>' : 
                    '<span style="color:#f44336; font-weight:bold;">⚠️ ล้นกรอบ! ปรับลดขนาด</span>'}<br>
                Margin X: ${Math.round((0.60 - Math.max(frontEdgeX, rearEdgeX))*1000)} mm<br>
                Margin Z: ${Math.round((0.50 - Math.max(frontEdgeZ_front, rearEdgeZ_rear))*1000)} mm
            `;
        }

        // ============ Animation ============
        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
        });
    </script>
</body>
</html>
