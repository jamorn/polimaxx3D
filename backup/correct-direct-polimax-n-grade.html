<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Box Face Index Labels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2 class="text-lg font-bold mb-2">Box Controller</h2>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="labelToggle" checked class="w-5 h-5 cursor-pointer">
            <label for="labelToggle" class="cursor-pointer select-none">แสดงชื่อแบรนด์ / รหัสสินค้า</label>
        </div>
        <p class="text-xs mt-2 text-gray-500">คลิกขยับเมาส์เพื่อหมุนมุมมอง</p>
        <div class="mt-2 text-[10px] text-gray-600">
            <div>+Y: POLIMAXX (หัวไปทาง -X)</div>
            <div>+Z: 1126NK (หัวไปทาง +Y)</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls, box;
        let materialsWithLabels, plainMaterials;

        // กำหนดข้อมูลเฉพาะของแต่ละด้าน
        const faceData = [
            { id: 0, name: 'RIGHT (+X)', label: 'RIGHT' },
            { id: 1, name: 'LEFT (-X)', label: 'LEFT' },
            { id: 2, name: 'TOP (+Y)', label: 'POLIMAXX', rotation: Math.PI / 2 }, // หมุน 90 องศาให้หัวไปทาง -X
            { id: 3, name: 'BOTTOM (-Y)', label: 'BOTTOM' },
            { id: 4, name: 'FRONT (+Z)', label: '1126NK' }, // ปกติหัวขึ้นทาง +Y อยู่แล้ว
            { id: 5, name: 'BACK (-Z)', label: 'BACK' }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            setupMaterials();

            // สร้าง Box (Rectangle ยาว 3.0)
            const geometry = new THREE.BoxGeometry(3.0, 1.0, 1.2); 
            box = new THREE.Mesh(geometry, materialsWithLabels);
            scene.add(box);

            // แกนช่วยดูทิศทาง (X=แดง, Y=เขียว, Z=น้ำเงิน)
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);

            document.getElementById('labelToggle').addEventListener('change', (e) => {
                box.material = e.target.checked ? materialsWithLabels : plainMaterials;
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createFaceTexture(faceInfo) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // พื้นหลัง
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 512);

            // เส้นขอบ
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 20;
            ctx.strokeRect(0, 0, 512, 512);

            // เขียนข้อความหลัก
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 80px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // วาดข้อความตรงกลาง
            ctx.fillText(faceInfo.label, 256, 256);

            // เขียนชื่อด้านเล็กๆ มุมซ้ายบนเพื่อตรวจสอบความถูกต้อง
            ctx.font = '30px Arial';
            ctx.fillStyle = '#888888';
            ctx.textAlign = 'left';
            ctx.fillText(faceInfo.name, 40, 60);

            const texture = new THREE.CanvasTexture(canvas);
            
            // จัดการเรื่องการหมุน Texture
            if (faceInfo.rotation) {
                texture.center.set(0.5, 0.5);
                texture.rotation = faceInfo.rotation;
            }

            return texture;
        }

        function setupMaterials() {
            materialsWithLabels = faceData.map(face => {
                return new THREE.MeshStandardMaterial({
                    map: createFaceTexture(face),
                    roughness: 0.4,
                    metalness: 0.1
                });
            });

            plainMaterials = faceData.map(() => {
                return new THREE.MeshStandardMaterial({
                    color: 0xcccccc,
                    roughness: 0.5,
                    metalness: 0.1
                });
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
