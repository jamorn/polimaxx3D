<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shape — Single Bag</title>
    <style>
        body { margin:0; overflow:hidden; background:#222; font-family: Arial, sans-serif; }
        .info {
            position: absolute; left: 20px; top: 20px; z-index: 100;
            background: rgba(0,0,0,0.7); color: #fff; padding: 12px 16px; border-radius: 8px;
            border-left: 4px solid #f37021;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div class="info" id="dimInfo">Loading dimensions…</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Minimal TextureFactory (top / front / blank)
        class TextureFactory {
            static createTopTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 2048; canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                // white base and generous white padding to avoid edge artifacts
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                const pad = 48;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, pad);
                ctx.fillRect(0, canvas.height - pad, canvas.width, pad);
                ctx.fillRect(0, 0, pad, canvas.height);
                ctx.fillRect(canvas.width - pad, 0, pad, canvas.height);

                ctx.fillStyle = '#0e3a66'; ctx.textAlign = 'center'; ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', canvas.width/2, 400);

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = false;
                tex.anisotropy = 16;
                tex.needsUpdate = true;
                return tex;
            }

            static createFrontTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 4096; canvas.height = 1024;
                const ctx = canvas.getContext('2d');

                // white base and larger white padding to mask edge artifacts
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const pad = 64;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, pad);
                ctx.fillRect(0, canvas.height - pad, canvas.width, pad);
                ctx.fillRect(0, 0, pad, canvas.height);
                ctx.fillRect(canvas.width - pad, 0, pad, canvas.height);

                // centered text
                ctx.fillStyle = '#000000';
                ctx.textBaseline = 'middle';
                ctx.textAlign = 'center';
                ctx.font = 'bold 130px sans-serif';
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                ctx.fillText('1126NK 0260204008', centerX, centerY);

                const tex = new THREE.CanvasTexture(canvas);
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = false;
                tex.anisotropy = 16;
                tex.flipY = false;
                tex.needsUpdate = true;
                return tex;
            }

            static createBlankTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
                return new THREE.CanvasTexture(canvas);
            }
        }

        // POLIMAXBag (trimmed for single-bag view)
        class POLIMAXBag {
            static BAG_LENGTH = 0.5667;
            static BAG_WIDTH = 0.925;
            static BAG_HEIGHT = 0.28;

            constructor() {
                this.geometry = this.createGeometry();
                this.textures = {
                    top: TextureFactory.createTopTexture(),
                    front: TextureFactory.createFrontTexture(),
                    blank: TextureFactory.createBlankTexture()
                };

                // Ensure sampling is clean to avoid seams/artifacts when used on the back face
                // Do NOT flip here — the geometry UVs already handle orientation for the back face.
                this.textures.front.wrapS = THREE.ClampToEdgeWrapping;
                this.textures.front.minFilter = THREE.LinearFilter;
                this.textures.front.magFilter = THREE.LinearFilter;
                this.textures.front.generateMipmaps = false;
                this.textures.front.needsUpdate = true;
                this.materials = this.createMaterials();
            }

            createGeometry() {
                const segments = 24;
                const geo = new THREE.BoxGeometry(POLIMAXBag.BAG_WIDTH, POLIMAXBag.BAG_HEIGHT, POLIMAXBag.BAG_LENGTH, segments, segments, segments);
                const pos = geo.attributes.position; const v3 = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const nx = v3.x / (POLIMAXBag.BAG_WIDTH / 2);
                    const ny = v3.y / (POLIMAXBag.BAG_HEIGHT / 2);
                    const nz = v3.z / (POLIMAXBag.BAG_LENGTH / 2);
                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.25);
                    v3.x *= (1 - endCurve * 0.08);
                    const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
                    const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }
                geo.computeVertexNormals();

                const uv = geo.attributes.uv; const normal = geo.attributes.normal;
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const normalX = normal.getX(i); const normalY = normal.getY(i); const normalZ = normal.getZ(i);
                    if (Math.abs(normalY) > 0.5) {
                        if (normalY > 0) uv.setXY(i, (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5, (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5);
                        else uv.setXY(i, (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5, (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5);
                    } else if (Math.abs(normalZ) > 0.5) {
                        const u = (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5; const v = (v3.y / POLIMAXBag.BAG_HEIGHT) + 0.5;
                        if (normalZ > 0) uv.setXY(i, u, v); else uv.setXY(i, 1.0 - u, v);
                    } else if (Math.abs(normalX) > 0.5) {
                        const u = (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5; const v = (v3.y / POLIMAXBag.BAG_HEIGHT) + 0.5;
                        if (normalX > 0) uv.setXY(i, 1.0 - u, v); else uv.setXY(i, u, v);
                    }
                }
                return geo;
            }

            createMaterials() {
                const rightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const leftMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const topMat = new THREE.MeshStandardMaterial({ map: this.textures.top, roughness: 0.45, metalness: 0.05, side: THREE.DoubleSide });
                const bottomMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                // remove all artwork from the side faces for testing — use blank texture
                const frontMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const backMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                return [rightMat, leftMat, topMat, bottomMat, frontMat, backMat];
            }

            createInstance(posX, posY, posZ, rotationY = 0) {
                const clonedMats = this.materials.map(mat => mat.clone());
                const mesh = new THREE.Mesh(this.geometry, clonedMats);
                mesh.castShadow = true; mesh.receiveShadow = true;
                mesh.position.set(posX, posY, posZ); mesh.rotation.y = rotationY;
                return mesh;
            }
        }

        // Scene
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1.5, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0, 0.5, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambientLight);
        const dir = new THREE.DirectionalLight(0xffffff, 1.4); dir.position.set(3,5,4); dir.castShadow = true; scene.add(dir);

        const floorGeo = new THREE.PlaneGeometry(10,10); const floorMat = new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI/2; floor.position.y = -0.2; floor.receiveShadow = true; scene.add(floor);

        // Create single bag
        const bag = new POLIMAXBag();
        const w = POLIMAXBag.BAG_WIDTH, l = POLIMAXBag.BAG_LENGTH, h = POLIMAXBag.BAG_HEIGHT;
        const bagMesh = bag.createInstance(0, h/2, 0, 0);
        scene.add(bagMesh);

        // Show dimensions
        const dimInfo = document.getElementById('dimInfo');
        dimInfo.innerHTML = `Dimensions:<br>Width (X): ${w} m (${(w*1000).toFixed(0)} mm)<br>Length (Z): ${l} m (${(l*1000).toFixed(0)} mm)<br>Height (Y): ${h} m (${(h*1000).toFixed(0)} mm)`;

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
