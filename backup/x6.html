<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POLIMAXX — 5 Bags with Lock Default</title>
    <style>
        body { margin:0; overflow:hidden; background:#2a2a3a; font-family:'Arial',sans-serif; }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(30, 30, 40, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border-left: 4px solid #f37021;
            z-index: 100;
            pointer-events: auto;
            width: 320px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        h1 { margin:0; font-size:16px; color:#f37021; text-transform:uppercase; letter-spacing:1px; }
        p { margin:5px 0 0; font-size:12px; opacity:0.9; }
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f37021;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 200;
            box-shadow: 0 2px 15px #f37021;
        }
        .control-group {
            background: #2a2a3a;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #4a4a5a;
        }
        .bag-selector {
            display: flex;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .bag-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #666;
            background: #3a3a4a;
            color: white;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .bag-btn.active {
            border-color: #f37021;
            background: #f37021;
            color: black;
            transform: scale(1.1);
            box-shadow: 0 0 20px #f37021;
        }
        .slider-group {
            margin: 15px 0;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            color: #ddd;
        }
        input[type=range] {
            width: 100%;
            background: #4a4a5a;
            height: 5px;
            border-radius: 5px;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f37021;
            cursor: pointer;
        }
        .rotate-btns {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .rotate-btn {
            flex: 1;
            background: #3a3a4a;
            border: 1px solid #666;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .rotate-btn:hover {
            background: #f37021;
            color: black;
        }
        .value-display {
            background: #1a1a2a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 16px;
            text-align: center;
            margin: 10px 0;
            border: 1px solid #f37021;
            color: #f37021;
        }
        .action-btns {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .primary-btn {
            flex: 1;
            background: #f37021;
            border: none;
            color: black;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .primary-btn:hover {
            background: #ff8c42;
            transform: scale(1.02);
        }
        .secondary-btn {
            flex: 1;
            background: #4a6a9a;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .lock-btn {
            background: #4a4a5a;
            border: 2px solid #f37021;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin: 10px 0;
            font-size: 14px;
            transition: all 0.2s;
        }
        .lock-btn:hover {
            background: #f37021;
            color: black;
        }
        .lock-btn.locked {
            background: #f37021;
            color: black;
            border-color: white;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            margin: 10px 0;
            color: #ddd;
        }
        hr {
            border: 0;
            border-top: 1px solid #4a4a5a;
            margin: 15px 0;
        }
        .default-values {
            background: #1a1a2a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
            border: 1px dashed #666;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div class="badge">✨ ล็อกค่า default ได้</div>
    <div class="ui-panel">
        <h1>POLIMAXX - 5 Bags Controller</h1>
        <p>เลือกถุง ➔ ปรับ X / หมุน Y 90° ➔ ล็อกค่า default</p>
        
        <div class="control-group">
            <label style="color:#f37021; font-weight:bold;">🔘 เลือกถุง</label>
            <div class="bag-selector" id="bagSelector">
                <button class="bag-btn" data-bag="5">5</button>
                <button class="bag-btn" data-bag="4">4</button>
                <button class="bag-btn" data-bag="3">3</button>
                <button class="bag-btn" data-bag="2">2</button>
                <button class="bag-btn" data-bag="1">1</button>
            </div>

            <div class="value-display" id="bagInfo">
                ถุง 5 | X: -0.61 | หมุน Y: 0°
            </div>

            <div class="slider-group">
                <label>
                    <span>⬅️ ตำแหน่ง X ➔</span>
                    <span id="xValue">-0.61</span>
                </label>
                <input type="range" id="xSlider" min="-2" max="2" step="0.01" value="-0.61">
            </div>

            <div class="slider-group">
                <label>
                    <span>🔀 แยกแถวหน้า/หลัง (Gap Rows)</span>
                    <span id="gapRowsValue">0.00</span>
                </label>
                <input type="range" id="gapRowsSlider" min="0" max="1.2" step="0.01" value="0.00">
            </div>

            <div class="slider-group">
                <label>
                    <span>↔️ แยกถุง 1 & 3 จาก 2 (Gap Middle)</span>
                    <span id="gapMiddleValue">0.82</span>
                </label>
                <input type="range" id="gapMiddleSlider" min="0" max="1.5" step="0.01" value="0.82">
            </div>

            <div class="rotate-btns">
                <button class="rotate-btn" id="rotateCW">↻ 90° ตามเข็ม</button>
                <button class="rotate-btn" id="rotateCCW">↺ 90° ทวนเข็ม</button>
            </div>
        </div>

        <div class="action-btns">
            <button class="secondary-btn" id="resetBagBtn">⟲ รีเซ็ตถุงนี้</button>
            <button class="secondary-btn" id="alignViewBtn">👁️ จ้องมอง</button>
        </div>

        <button class="lock-btn" id="lockBtn">🔒 ล็อกค่าเป็น Default</button>

        <div class="default-values" id="defaultDisplay">
            ยังไม่มีค่าที่ล็อก
        </div>

        <hr>

        <div style="display:flex; gap:10px; margin:10px 0;">
            <button class="primary-btn" id="resetAllBtn">⟲ รีเซ็ตทั้งหมด</button>
            <button class="primary-btn" id="applyDefaultBtn">📥 ใช้ค่าที่ล็อก</button>
        </div>

        <label class="checkbox-label">
            <input type="checkbox" id="showIndex">
            แสดง Index Labels (ตัวเลขเล็ก)
        </label>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ Texture Factory (เหมือนเดิม) ============
        class TextureFactory {
            static createTopTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                ctx.textAlign = 'center';

                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', centerX, 400);

                ctx.strokeStyle = '#f37021';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#f37021';
                ctx.font = 'bold 360px sans-serif';
                ctx.fillText('PP', centerX, 840);

                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 150px sans-serif';
                ctx.fillText('POLYETHYLENE', centerX, 1040);

                ctx.strokeStyle = '#f37021';
                ctx.lineWidth = 30;
                ctx.beginPath();
                ctx.arc(1760, 400, 120, 0, Math.PI * 2);
                ctx.stroke();
                ctx.lineWidth = 20;
                ctx.beginPath();
                ctx.arc(1840, 640, 60, 0, Math.PI * 2);
                ctx.stroke();

                for (let i = 0; i < 4; i++) {
                    const x = 400 + i * 170;
                    const y = 1360;
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.textAlign = 'left';
                ctx.fillStyle = '#111';
                ctx.font = 'bold 120px sans-serif';
                ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 16;
                tex.center.set(0.5, 0.5);
                tex.rotation = Math.PI;
                tex.needsUpdate = true;
                return tex;
            }

            static createFrontTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 4096;
                canvas.height = 1024;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#000000';
                ctx.textBaseline = 'middle';
                const midY = 512;
                let currentX = 650;

                ctx.textAlign = 'left';
                ctx.font = 'bold 130px sans-serif';
                ctx.fillText('1126NK 0260204008', currentX, midY);
                currentX += 1380;

                const symbolX = currentX;
                const symbolY = midY;
                ctx.lineWidth = 14;
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(symbolX, symbolY - 75);
                ctx.lineTo(symbolX + 75, symbolY);
                ctx.lineTo(symbolX, symbolY + 75);
                ctx.lineTo(symbolX - 75, symbolY);
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath(); ctx.moveTo(symbolX, symbolY - 75); ctx.lineTo(symbolX, symbolY + 75); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(symbolX - 35, symbolY); ctx.lineTo(symbolX + 35, symbolY); ctx.stroke();

                ctx.font = 'bold 60px sans-serif';
                ctx.fillText('TIS.1306-2566', symbolX + 110, midY - 38);
                ctx.fillText('PP-01-1-5-F', symbolX + 110, midY + 38);
                currentX += 540;

                const qrX = currentX;
                const qrY = midY - 85;
                ctx.fillStyle = '#000';
                ctx.fillRect(qrX, qrY, 170, 170);
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if ((i + j) % 2 === 0) {
                            ctx.fillRect(qrX + 18 + i * 48, qrY + 18 + j * 48, 40, 40);
                        }
                    }
                }
                ctx.fillStyle = '#000';
                currentX += 280;

                ctx.font = 'bold 75px sans-serif';
                ctx.fillText('PP HOMO', currentX, midY - 38);
                ctx.fillText('B  06:28', currentX, midY + 38);
                currentX += 460;

                ctx.font = 'italic bold 85px sans-serif';
                ctx.fillText('(RoHS)', currentX, midY);

                return new THREE.CanvasTexture(canvas);
            }

            static createIndexTexture(index) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 200px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index.toString(), canvas.width/2, canvas.height/2);
                return new THREE.CanvasTexture(canvas);
            }

            static createBlankTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return new THREE.CanvasTexture(canvas);
            }
        }

        // ============ Bag Class ============
        class POLIMAXBag {
            static BAG_LENGTH = 0.5667;
            static BAG_WIDTH = 0.925;
            static BAG_HEIGHT = 0.28;

            constructor() {
                this.geometry = this.createGeometry();
                this.textures = {
                    top: TextureFactory.createTopTexture(),
                    front: TextureFactory.createFrontTexture(),
                    blank: TextureFactory.createBlankTexture(),
                    index: []
                };
                
                for (let i = 0; i < 6; i++) {
                    this.textures.index[i] = TextureFactory.createIndexTexture(i);
                }
                
                this.materials = this.createMaterials();
                this.indexMaterials = this.createIndexMaterials();
            }

            createGeometry() {
                const segments = 24;
                const geo = new THREE.BoxGeometry(
                    POLIMAXBag.BAG_WIDTH,
                    POLIMAXBag.BAG_HEIGHT,
                    POLIMAXBag.BAG_LENGTH,
                    segments, segments, segments
                );
                
                const pos = geo.attributes.position;
                const v3 = new THREE.Vector3();

                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const nx = v3.x / (POLIMAXBag.BAG_WIDTH / 2);
                    const ny = v3.y / (POLIMAXBag.BAG_HEIGHT / 2);
                    const nz = v3.z / (POLIMAXBag.BAG_LENGTH / 2);
                    
                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.25);
                    v3.x *= (1 - endCurve * 0.08);
                    
                    const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
                    
                    const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
                    
                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }

                geo.computeVertexNormals();

                const uv = geo.attributes.uv;
                const normal = geo.attributes.normal;
                
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const normalX = normal.getX(i);
                    const normalY = normal.getY(i);
                    const normalZ = normal.getZ(i);

                    if (Math.abs(normalY) > 0.5) {
                        if (normalY > 0) {
                            uv.setXY(i, (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5, (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5);
                        } else {
                            uv.setXY(i, (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5, (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5);
                        }
                    } else if (Math.abs(normalZ) > 0.5) {
                        const u = (v3.x / POLIMAXBag.BAG_WIDTH) + 0.5;
                        const v = (v3.y / POLIMAXBag.BAG_HEIGHT) + 0.5;
                        if (normalZ > 0) {
                            uv.setXY(i, u, v);
                        } else {
                            uv.setXY(i, 1.0 - u, v);
                        }
                    } else if (Math.abs(normalX) > 0.5) {
                        const u = (v3.z / POLIMAXBag.BAG_LENGTH) + 0.5;
                        const v = (v3.y / POLIMAXBag.BAG_HEIGHT) + 0.5;
                        if (normalX > 0) {
                            uv.setXY(i, 1.0 - u, v);
                        } else {
                            uv.setXY(i, u, v);
                        }
                    }
                }
                return geo;
            }

            createMaterials() {
                const rightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const leftMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const topMat = new THREE.MeshStandardMaterial({ map: this.textures.top, roughness: 0.45, metalness: 0.05, side: THREE.DoubleSide });
                const bottomMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const frontMat = new THREE.MeshStandardMaterial({ map: this.textures.front, roughness: 0.4, metalness: 0.05, side: THREE.DoubleSide });
                const backMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                return [rightMat, leftMat, topMat, bottomMat, frontMat, backMat];
            }

            createIndexMaterials() {
                return this.textures.index.map(tex => new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
            }

            createInstance(posX, posY, posZ, rotationY = 0, label = 0) {
                const clonedMats = this.materials.map(mat => mat.clone());
                const mesh = new THREE.Mesh(this.geometry, clonedMats);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.position.set(posX, posY, posZ);
                mesh.rotation.y = rotationY;
                mesh.userData.label = label;
                mesh.userData.initialPos = { x: posX, y: posY, z: posZ };
                mesh.userData.initialRot = rotationY;
                return mesh;
            }

            createIndexInstance(posX, posY, posZ, rotationY = 0) {
                const clonedMats = this.indexMaterials.map(mat => mat.clone());
                const mesh = new THREE.Mesh(this.geometry, clonedMats);
                mesh.position.set(posX, posY, posZ);
                mesh.rotation.y = rotationY;
                return mesh;
            }
        }

        // ============ Scene Setup (เพิ่มความสว่าง) ============
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a3a); // สว่างขึ้น

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.5, 2.2, 4.5);
        camera.lookAt(0, 0.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.5; // เพิ่มความสว่าง
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.6, 0);

        // Lighting - เพิ่มความสว่าง
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // เพิ่มเป็น 1.2
        scene.add(ambientLight);
        
        const light1 = new THREE.DirectionalLight(0xffffff, 1.8); // เพิ่มเป็น 1.8
        light1.position.set(3, 6, 4);
        light1.castShadow = true;
        light1.shadow.mapSize.width = 1024;
        light1.shadow.mapSize.height = 1024;
        scene.add(light1);
        
        const light2 = new THREE.DirectionalLight(0xffccaa, 1.2); // เพิ่มเป็น 1.2
        light2.position.set(-3, 4, 3);
        scene.add(light2);

        const fillLight = new THREE.PointLight(0x88aacc, 0.8); // เพิ่มเป็น 0.8
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);

        // Ground - สว่างขึ้น
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.7, emissive: new THREE.Color(0x111122) });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.2;
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(8, 20, 0xaaaaaa, 0x666666);
        gridHelper.position.y = -0.19;
        scene.add(gridHelper);

        // ============ Create 5 Bags ============
        const bag = new POLIMAXBag();
        
        const w = POLIMAXBag.BAG_WIDTH;
        const l = POLIMAXBag.BAG_LENGTH;
        const h = POLIMAXBag.BAG_HEIGHT;
        const baseY = h/2;
        
        // ตำแหน่งเริ่มต้น (ตั้งค่า default ตามที่ร้องขอ)
        const bags = [
            // ถุง 5: X=-0.78, 0°
            bag.createInstance(-0.78, baseY, l/2 + 0.2, 0, 5),
            // ถุง 4: X=0.60, 0°
            bag.createInstance(0.60,  baseY, l/2 + 0.2, 0, 4),
            // ถุง 3: X=-0.82, 270°
            bag.createInstance(-0.82, baseY, -l/2 - 0.2, 3 * Math.PI / 2, 3),
            // ถุง 2: X=0.00, 90°
            bag.createInstance(0.00,  baseY, -l/2 - 0.2, Math.PI / 2, 2),
            // ถุง 1: X=0.82, 90°
            bag.createInstance(0.82,  baseY, -l/2 - 0.2, Math.PI / 2, 1)
        ];

        bags.forEach(mesh => scene.add(mesh));

        // Index overlay (default false)
        const indexMesh = bag.createIndexInstance(0, 0.5, 0, 0);
        indexMesh.visible = false; // default false
        scene.add(indexMesh);

        // ============ UI Control ============
        let activeBag = bags[0]; // เริ่มที่ถุง 5
        let defaultValues = null; // ค่าที่ล็อก
        
        // ปุ่มเลือกถุง
        document.querySelectorAll('.bag-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.bag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const label = parseInt(btn.dataset.bag);
                activeBag = bags.find(b => b.userData.label === label);
                
                updateDisplay();
                document.getElementById('xSlider').value = activeBag.position.x;
                document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
            });
        });

        // X Slider
        const xSlider = document.getElementById('xSlider');
        xSlider.addEventListener('input', (e) => {
            if (!activeBag) return;
            const val = parseFloat(e.target.value);
            activeBag.position.x = val;
            document.getElementById('xValue').textContent = val.toFixed(2);
            updateDisplay();
        });

        // --- Gap sliders: map bags by label for easy access ---
        const bagByLabel = {};
        bags.forEach(b => { bagByLabel[b.userData.label] = b; });

        const gapRowsSlider = document.getElementById('gapRowsSlider');
        const gapRowsValue = document.getElementById('gapRowsValue');
        const gapMiddleSlider = document.getElementById('gapMiddleSlider');
        const gapMiddleValue = document.getElementById('gapMiddleValue');

        // initialize gapMiddle from current symmetric distance (bag1 - bag2)
        const initialGapMiddle = Math.abs(bagByLabel[1].position.x - bagByLabel[2].position.x);
        gapMiddleSlider.value = initialGapMiddle.toFixed(2);
        gapMiddleValue.textContent = parseFloat(gapMiddleSlider.value).toFixed(2);

        gapRowsSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            gapRowsValue.textContent = v.toFixed(2);
            // front row (4,5) move forward, back row (1,2,3) move backward
            [5,4].forEach(lbl => {
                const b = bagByLabel[lbl];
                if (b && b.userData && b.userData.initialPos) b.position.z = b.userData.initialPos.z + v;
            });
            [3,2,1].forEach(lbl => {
                const b = bagByLabel[lbl];
                if (b && b.userData && b.userData.initialPos) b.position.z = b.userData.initialPos.z - v;
            });
        });

        gapMiddleSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            gapMiddleValue.textContent = v.toFixed(2);
            const centerX = (bagByLabel[2] && bagByLabel[2].userData && bagByLabel[2].userData.initialPos) ? bagByLabel[2].userData.initialPos.x : 0;
            if (bagByLabel[2]) bagByLabel[2].position.x = centerX;
            if (bagByLabel[1]) bagByLabel[1].position.x = centerX + v;
            if (bagByLabel[3]) bagByLabel[3].position.x = centerX - v;
            // if activeBag is one of these, update the X slider display
            if (activeBag) {
                document.getElementById('xSlider').value = activeBag.position.x;
                document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
            }
        });

        // หมุนตามเข็ม
        document.getElementById('rotateCW').addEventListener('click', () => {
            if (!activeBag) return;
            const currentDeg = (activeBag.rotation.y * 180 / Math.PI + 360) % 360;
            let newDeg = Math.round((currentDeg + 90) / 90) * 90;
            if (newDeg >= 360) newDeg = 0;
            activeBag.rotation.y = newDeg * Math.PI / 180;
            updateDisplay();
        });

        // หมุนทวนเข็ม
        document.getElementById('rotateCCW').addEventListener('click', () => {
            if (!activeBag) return;
            const currentDeg = (activeBag.rotation.y * 180 / Math.PI + 360) % 360;
            let newDeg = Math.round((currentDeg - 90) / 90) * 90;
            if (newDeg < 0) newDeg = 270;
            activeBag.rotation.y = newDeg * Math.PI / 180;
            updateDisplay();
        });

        // รีเซ็ตถุงนี้
        document.getElementById('resetBagBtn').addEventListener('click', () => {
            if (!activeBag) return;
            activeBag.position.x = activeBag.userData.initialPos.x;
            activeBag.rotation.y = activeBag.userData.initialRot;
            document.getElementById('xSlider').value = activeBag.position.x;
            document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
            updateDisplay();
        });

        // รีเซ็ตทั้งหมด
        document.getElementById('resetAllBtn').addEventListener('click', () => {
            bags.forEach(b => {
                b.position.x = b.userData.initialPos.x;
                b.rotation.y = b.userData.initialRot;
            });
            if (activeBag) {
                document.getElementById('xSlider').value = activeBag.position.x;
                document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
            }
            updateDisplay();
        });

        // จ้องมองถุง active
        document.getElementById('alignViewBtn').addEventListener('click', () => {
            if (!activeBag) return;
            controls.target.copy(activeBag.position);
            controls.target.y = 0.5;
        });

        // ล็อกค่า default
        const lockBtn = document.getElementById('lockBtn');
        lockBtn.addEventListener('click', () => {
            // บันทึกค่าปัจจุบันของทุกถุง และสถานะ sliders
            const bagsSaved = bags.map(b => ({
                label: b.userData.label,
                x: b.position.x,
                rot: b.rotation.y
            }));

            defaultValues = {
                bags: bagsSaved,
                gapRows: parseFloat(gapRowsSlider.value),
                gapMiddle: parseFloat(gapMiddleSlider.value)
            };

            lockBtn.classList.add('locked');
            lockBtn.innerHTML = '🔒 ล็อกค่าแล้ว';

            // แสดงค่าที่ล็อก
            const defaultDisplay = document.getElementById('defaultDisplay');
            defaultDisplay.innerHTML = '<strong>✅ ค่าที่ล็อก:</strong><br>' +
                defaultValues.bags.map(v => `ถุง ${v.label}: X=${v.x.toFixed(2)}, ${Math.round(v.rot * 180 / Math.PI)}°`).join('<br>') +
                `<br><br><strong>Gap Rows:</strong> ${defaultValues.gapRows.toFixed(2)} m` +
                `<br><strong>Gap Middle:</strong> ${defaultValues.gapMiddle.toFixed(2)} m`;
        });

        // ใช้ค่าที่ล็อก
        document.getElementById('applyDefaultBtn').addEventListener('click', () => {
            if (!defaultValues) {
                alert('กรุณาล็อกค่าก่อน');
                return;
            }

            // apply bag positions/rots
            defaultValues.bags.forEach(v => {
                const bag = bags.find(b => b.userData.label === v.label);
                if (bag) {
                    bag.position.x = v.x;
                    bag.rotation.y = v.rot;
                }
            });

            // apply sliders and trigger handlers
            if (typeof defaultValues.gapRows === 'number') {
                gapRowsSlider.value = defaultValues.gapRows.toFixed(2);
                gapRowsSlider.dispatchEvent(new Event('input'));
            }
            if (typeof defaultValues.gapMiddle === 'number') {
                gapMiddleSlider.value = defaultValues.gapMiddle.toFixed(2);
                gapMiddleSlider.dispatchEvent(new Event('input'));
            }

            if (activeBag) {
                document.getElementById('xSlider').value = activeBag.position.x;
                document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
            }
            updateDisplay();
        });

        // Show/hide index (default false)
        document.getElementById('showIndex').addEventListener('change', (e) => {
            indexMesh.visible = e.target.checked;
        });

        function updateDisplay() {
            if (!activeBag) return;
            const deg = (activeBag.rotation.y * 180 / Math.PI + 360) % 360;
            document.getElementById('bagInfo').innerHTML = 
                `ถุง ${activeBag.userData.label} | X: ${activeBag.position.x.toFixed(2)} | หมุน Y: ${Math.round(deg)}°`;
        }

        // ตั้งค่าเริ่มต้น
        document.querySelector('[data-bag="5"]').classList.add('active');
        // ensure UI sliders reflect the active bag
        if (activeBag) {
            document.getElementById('xSlider').value = activeBag.position.x;
            document.getElementById('xValue').textContent = activeBag.position.x.toFixed(2);
        }
        // initialize gap sliders to current bag geometry
        gapMiddleSlider.dispatchEvent(new Event('input'));
        gapRowsSlider.dispatchEvent(new Event('input'));
        updateDisplay();

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
