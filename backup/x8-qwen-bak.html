<script type="importmap">
{

<body>
<div class="controls">
<button id="btn-reset" class="active">รีเซ็ตตำแหน่ง</button>
<button id="btn-align">จ้องมองถุง</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DObject, CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';
import GUI from 'lil-gui';
// ============ Configuration ============
const CONFIG = {
PALLET: {
WIDTH: 1.2,     // 1200 mm
DEPTH: 1.0,     // 1000 mm
HEIGHT: 0.15
},
BAG: {
WIDTH: 0.3281,   // 328 mm, scaled for 1200x1000 pallet
LENGTH: 0.2007,  // 201 mm, proportional to bag width
HEIGHT: 0.0993   // 99 mm, proportional to bag width
},
COLORS: {
FRAME: 0xf37021,
PALLET: 0x8B5A2B,
WALL: 0xfc182f
}
};
const BASE_BAG = { ...CONFIG.BAG };
const MANUAL_PRESET_BAG = Object.freeze({
WIDTH: 0.337,
LENGTH: 0.233,
HEIGHT: 0.14
});
const SHAPE_REFERENCE = Object.freeze({
WIDTH: 0.525,
LENGTH: 0.3211,
HEIGHT: 0.1589,
FRONT_BULGE_Z: 0.12,
SIDE_BULGE_X: 0.22
});
const DEFAULT_GAPS = Object.freeze({
rows: 0.0,
front: 0.295,
rear: 0.39
});
const DEFAULT_Z_OFFSETS_MM = Object.freeze({
front: 0,
rear: -28
});
const FRONT_ROW_MARGIN = 0.0;
const ROW_WALL_GAP = 0.03;
// ============ State Management ============
const state = {
activeBag: 5,
gapRows: DEFAULT_GAPS.rows,
gapFront: DEFAULT_GAPS.front,
gapMiddle: DEFAULT_GAPS.rear,
bagWidth: MANUAL_PRESET_BAG.WIDTH,
bagLength: MANUAL_PRESET_BAG.LENGTH,
bagHeight: MANUAL_PRESET_BAG.HEIGHT,
bagColor: '#00ff00',// initial bag color (white) #ffffff
frontRowOffsetMm: DEFAULT_Z_OFFSETS_MM.front,
rearRowOffsetMm: DEFAULT_Z_OFFSETS_MM.rear,
showWalls: true,
showPallet: true,
showGrid: true,
showLabels: false,
showLayer1: true,
showLayer2: true,
wallOpacity: 0.4,
wallColor: '#fc182f',
palletOpacity: 0.6,
palletColor: '#8B5A2B'
};
// ============ Texture Factory ============
class TextureFactory {
static createTopTexture(backgroundColor = state.bagColor) {
const canvas = document.createElement('canvas');
canvas.width = 2048;
canvas.height = 2048;
const ctx = canvas.getContext('2d');
ctx.fillStyle = backgroundColor;
ctx.fillRect(0, 0, canvas.width, canvas.height);
const centerX = canvas.width / 2;
ctx.textAlign = 'center';
ctx.fillStyle = '#0e3a66';
ctx.font = 'bold 220px sans-serif';
ctx.fillText('POLIMAXX', centerX, 400);
ctx.strokeStyle = '#f37021';
ctx.lineWidth = 4;
ctx.beginPath();
ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2);
ctx.stroke();
ctx.fillStyle = '#f37021';
ctx.font = 'bold 360px sans-serif';
ctx.fillText('PP', centerX, 840);
ctx.fillStyle = '#0e3a66';
ctx.font = 'bold 150px sans-serif';
ctx.fillText('POLYETHYLENE', centerX, 1040);
ctx.strokeStyle = '#f37021';
ctx.lineWidth = 30;
ctx.beginPath();
ctx.arc(1760, 400, 120, 0, Math.PI * 2);
ctx.stroke();
ctx.lineWidth = 20;
ctx.beginPath();
ctx.arc(1840, 640, 60, 0, Math.PI * 2);
ctx.stroke();
for (let i = 0; i < 4; i++) {
const x = 400 + i * 170;
const y = 1360;
ctx.fillStyle = '#ff0000';
ctx.beginPath();
ctx.arc(x, y, 64, 0, Math.PI * 2);
ctx.fill();
ctx.strokeStyle = '#333';
ctx.lineWidth = 6;
ctx.beginPath();
ctx.arc(x, y, 64, 0, Math.PI * 2);
ctx.stroke();
ctx.fillStyle = '#ff6666';
ctx.beginPath();
ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
ctx.fill();
}
ctx.textAlign = 'left';
ctx.fillStyle = '#111';
ctx.font = 'bold 120px sans-serif';
ctx.fillText('NET WEIGHT 25 KG', 360, 1760);
const tex = new THREE.CanvasTexture(canvas);
tex.anisotropy = 16;
tex.center.set(0.5, 0.5);
tex.rotation = Math.PI;
tex.needsUpdate = true;
return tex;
}
static createFrontTexture() {
const canvas = document.createElement('canvas');
canvas.width = 4096;
canvas.height = 1024;
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#000000';
ctx.textBaseline = 'middle';
const midY = 512;
let currentX = 650;
ctx.textAlign = 'left';
ctx.font = 'bold 130px sans-serif';
ctx.fillText('1126NK 0260204008', currentX, midY);
currentX += 1380;
const symbolX = currentX;
const symbolY = midY;
ctx.lineWidth = 14;
ctx.strokeStyle = '#000';
ctx.beginPath();
ctx.moveTo(symbolX, symbolY - 75);
ctx.lineTo(symbolX + 75, symbolY);
ctx.lineTo(symbolX, symbolY + 75);
ctx.lineTo(symbolX - 75, symbolY);
ctx.closePath();
ctx.stroke();
ctx.beginPath(); ctx.moveTo(symbolX, symbolY - 75); ctx.lineTo(symbolX, symbolY + 75); ctx.stroke();
ctx.beginPath(); ctx.moveTo(symbolX - 35, symbolY); ctx.lineTo(symbolX + 35, symbolY); ctx.stroke();
ctx.font = 'bold 60px sans-serif';
ctx.fillText('TIS.1306-2566', symbolX + 110, midY - 38);
ctx.fillText('PP-01-1-5-F', symbolX + 110, midY + 38);
currentX += 540;
const qrX = currentX;
const qrY = midY - 85;
ctx.fillStyle = '#000';
ctx.fillRect(qrX, qrY, 170, 170);
ctx.fillStyle = '#fff';
for (let i = 0; i < 3; i++) {
for (let j = 0; j < 3; j++) {
if ((i + j) % 2 === 0) {
ctx.fillRect(qrX + 18 + i * 48, qrY + 18 + j * 48, 40, 40);
}
}
}
ctx.fillStyle = '#000';
currentX += 280;
ctx.font = 'bold 75px sans-serif';
ctx.fillText('PP HOMO', currentX, midY - 38);
ctx.fillText('B  06:28', currentX, midY + 38);
currentX += 460;
ctx.font = 'italic bold 85px sans-serif';
ctx.fillText('(RoHS)', currentX, midY);
const tex = new THREE.CanvasTexture(canvas);
tex.anisotropy = 16;
tex.generateMipmaps = false;
tex.minFilter = THREE.LinearFilter;
tex.magFilter = THREE.LinearFilter;
tex.needsUpdate = true;
return tex;
}
static createIndexTexture(index) {
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');
ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 200px Arial';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText(index.toString(), canvas.width/2, canvas.height/2);
const tex = new THREE.CanvasTexture(canvas);
tex.needsUpdate = true;
return tex;
}
static createBlankTexture(backgroundColor = state.bagColor) {
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');
ctx.fillStyle = backgroundColor;
ctx.fillRect(0, 0, canvas.width, canvas.height);
const tex = new THREE.CanvasTexture(canvas);
tex.needsUpdate = true;
return tex;
}
}
// ============ Bag Class ============
class POLIMAXBag {
constructor(width = BASE_BAG.WIDTH, length = BASE_BAG.LENGTH, height = BASE_BAG.HEIGHT) {
this.dimensions = { width, length, height };
this.geometry = this.createGeometry();
this.textures = {
top: TextureFactory.createTopTexture(state.bagColor),
front: TextureFactory.createFrontTexture(),
blank: TextureFactory.createBlankTexture(state.bagColor),
index: []
};
for (let i = 0; i < 6; i++) {
this.textures.index[i] = TextureFactory.createIndexTexture(i);
}
this.materials = this.createMaterials();
}
setDimensions(width, length, height) {
this.dimensions = { width, length, height };
this.geometry = this.createGeometry();
return this.geometry;
}
createGeometry() {
const { width, length, height } = this.dimensions;
const sideBulge = SHAPE_REFERENCE.SIDE_BULGE_X * (width / SHAPE_REFERENCE.WIDTH);
const frontBulge = SHAPE_REFERENCE.FRONT_BULGE_Z * (length / SHAPE_REFERENCE.LENGTH);
const segments = 24;
const geo = new THREE.BoxGeometry(
width,
height,
length,
segments, segments, segments
);
const pos = geo.attributes.position;
const v3 = new THREE.Vector3();
for (let i = 0; i < pos.count; i++) {
v3.fromBufferAttribute(pos, i);
const nx = v3.x / (width / 2);
const ny = v3.y / (height / 2);
const nz = v3.z / (length / 2);
const endCurve = Math.pow(Math.abs(nz), 2.2);
v3.y *= (1 - endCurve * 0.25);
v3.x *= (1 - endCurve * 0.08);
const sideConvex = sideBulge * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
const frontConvex = frontBulge * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
pos.setXYZ(i, v3.x, v3.y, v3.z);
}
geo.computeVertexNormals();
const uv = geo.attributes.uv;
const normal = geo.attributes.normal;
for (let i = 0; i < pos.count; i++) {
v3.fromBufferAttribute(pos, i);
const normalX = normal.getX(i);
const normalY = normal.getY(i);
const normalZ = normal.getZ(i);
if (Math.abs(normalY) > 0.5) {
if (normalY > 0) {
uv.setXY(i, (v3.z / length) + 0.5, (v3.x / width) + 0.5);
} else {
uv.setXY(i, (v3.x / width) + 0.5, (v3.z / length) + 0.5);
}
} else if (Math.abs(normalZ) > 0.5) {
const u = (v3.x / width) + 0.5;
const v = (v3.y / height) + 0.5;
if (normalZ > 0) {
uv.setXY(i, u, v);
} else {
uv.setXY(i, 1.0 - u, v);
}
} else if (Math.abs(normalX) > 0.5) {
const u = (v3.z / length) + 0.5;
const v = (v3.y / height) + 0.5;
if (normalX > 0) {
uv.setXY(i, 1.0 - u, v);
} else {
uv.setXY(i, u, v);
}
}
}
return geo;
}
createMaterials() {
const rightMat = new THREE.MeshStandardMaterial({ color: state.bagColor, roughness: 0.6, side: THREE.FrontSide });
const leftMat = new THREE.MeshStandardMaterial({ color: state.bagColor, roughness: 0.6, side: THREE.FrontSide });
const topMat = new THREE.MeshStandardMaterial({ map: this.textures.top, color: 0xffffff, roughness: 0.45, metalness: 0.05, side: THREE.FrontSide });
const bottomMat = new THREE.MeshStandardMaterial({ map: this.textures.blank, color: 0xffffff, roughness: 0.6, side: THREE.FrontSide });
const frontMat = new THREE.MeshStandardMaterial({ color: state.bagColor, roughness: 0.4, metalness: 0.05, side: THREE.FrontSide });
const backMat = new THREE.MeshStandardMaterial({ color: state.bagColor, roughness: 0.6, side: THREE.FrontSide });
return [rightMat, leftMat, topMat, bottomMat, frontMat, backMat];
}
createInstance(posX, posY, posZ, rotationY = 0, label = 0) {
const clonedMats = this.materials.map(mat => mat.clone());
const mesh = new THREE.Mesh(this.geometry, clonedMats);
mesh.castShadow = true;
mesh.receiveShadow = true;
mesh.position.set(posX, posY, posZ);
mesh.rotation.y = rotationY;
mesh.userData.label = label;
mesh.userData.initialPos = { x: posX, y: posY, z: posZ };
mesh.userData.initialRot = rotationY;
return mesh;
}
}
// ============ Scene Setup ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a3a);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 2.5, 5);
camera.lookAt(0, 0.6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.className = 'label-layer';
document.body.appendChild(labelRenderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.zoomToCursor = true;
controls.target.set(0, 0.6, 0);
function getBagCenterY() {
return state.bagHeight / 2;
}
function getBagHalfSpanX(rotationY = 0) {
const localHalfX = state.bagWidth / 2 + getScaledSideBulgeX();
const localHalfZ = state.bagLength / 2 + getScaledFrontBulgeZ();
const cosY = Math.abs(Math.cos(rotationY));
const sinY = Math.abs(Math.sin(rotationY));
return (localHalfX * cosY) + (localHalfZ * sinY);
}
function getBagHalfSpanZ(rotationY = 0) {
const localHalfX = state.bagWidth / 2 + getScaledSideBulgeX();
const localHalfZ = state.bagLength / 2 + getScaledFrontBulgeZ();
const cosY = Math.abs(Math.cos(rotationY));
const sinY = Math.abs(Math.sin(rotationY));
return (localHalfZ * cosY) + (localHalfX * sinY);
}
// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);
const light1 = new THREE.DirectionalLight(0xffffff, 1.8);
light1.position.set(3, 6, 4);
light1.castShadow = true;
light1.shadow.mapSize.width = 1024;
light1.shadow.mapSize.height = 1024;
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xffccaa, 1.2);
light2.position.set(-3, 4, 3);
scene.add(light2);
const fillLight = new THREE.PointLight(0x88aacc, 0.8);
fillLight.position.set(1, 2, 2);
scene.add(fillLight);
// Ground
const floorGeo = new THREE.PlaneGeometry(10, 10);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.7 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.2;
floor.receiveShadow = true;
scene.add(floor);
const gridHelper = new THREE.GridHelper(10, 20, 0xaaaaaa, 0x666666);
gridHelper.position.y = -0.19;
scene.add(gridHelper);
// ============ Calculate Positions ============
const palletW = CONFIG.PALLET.WIDTH;
const palletD = CONFIG.PALLET.DEPTH;
const baseY = getBagCenterY();
function getScaledFrontBulgeZ() {
return SHAPE_REFERENCE.FRONT_BULGE_Z * (state.bagLength / SHAPE_REFERENCE.LENGTH);
}
function getScaledSideBulgeX() {
return SHAPE_REFERENCE.SIDE_BULGE_X * (state.bagWidth / SHAPE_REFERENCE.WIDTH);
}
function getFrontRowHalfDepth() {
return state.bagLength / 2 + getScaledFrontBulgeZ();
}
function getRearRowHalfDepth() {
return state.bagWidth / 2 + getScaledSideBulgeX();
}
function getRowGapBounds() {
return {
min: 0,
max: Math.max(0, (palletD / 2) - (rowAnchors.backZ + getRearRowHalfDepth()))
};
}
function normalizeRowGap(value) {
const { min, max } = getRowGapBounds();
return min > max ? min : THREE.MathUtils.clamp(value, min, max);
}
const rowAnchors = {
frontZ: -palletD / 2 + getFrontRowHalfDepth() + FRONT_ROW_MARGIN,
dividerZ: (-palletD / 2 + getFrontRowHalfDepth() + FRONT_ROW_MARGIN) + getFrontRowHalfDepth() + (ROW_WALL_GAP / 2),
backZ: (-palletD / 2 + getFrontRowHalfDepth() + FRONT_ROW_MARGIN) + getFrontRowHalfDepth() + ROW_WALL_GAP + getRearRowHalfDepth()
};
const frontXGap = DEFAULT_GAPS.front;
const backXGap = DEFAULT_GAPS.rear;
const bagPositions = [
{ label: 5, x: -frontXGap, z: rowAnchors.frontZ, rot: Math.PI, desc: "ถุง 5 (หน้าซ้าย)" },
{ label: 4, x: frontXGap, z: rowAnchors.frontZ, rot: Math.PI, desc: "ถุง 4 (หน้าขวา)" },
{ label: 3, x: -backXGap, z: rowAnchors.backZ, rot: THREE.MathUtils.degToRad(270), desc: "ถุง 3 (หลังซ้าย)" },
{ label: 2, x: 0, z: rowAnchors.backZ, rot: Math.PI/2, desc: "ถุง 2 (หลังกลาง)" },
{ label: 1, x: backXGap, z: rowAnchors.backZ, rot: Math.PI/2, desc: "ถุง 1 (หลังขวา)" }
];
function syncBaseRowAnchors() {
rowAnchors.frontZ = -palletD / 2 + getFrontRowHalfDepth() + FRONT_ROW_MARGIN;
rowAnchors.dividerZ = rowAnchors.frontZ + getFrontRowHalfDepth() + (ROW_WALL_GAP / 2);
rowAnchors.backZ = rowAnchors.frontZ + getFrontRowHalfDepth() + ROW_WALL_GAP + getRearRowHalfDepth();
if (walls[3]) {
walls[3].position.z = rowAnchors.dividerZ;
}
[5, 4].forEach(label => {
const initial = bagPositions.find(pos => pos.label === label);
if (initial) initial.z = rowAnchors.frontZ;
});
[3, 2, 1].forEach(label => {
const initial = bagPositions.find(pos => pos.label === label);
if (initial) initial.z = rowAnchors.backZ;
});
}
// ============ Create Bags ============
const bag = new POLIMAXBag(state.bagWidth, state.bagLength, state.bagHeight);
const bags = bagPositions.map(pos =>
bag.createInstance(pos.x, baseY, pos.z, pos.rot, pos.label)
);
bags.forEach(mesh => {
mesh.userData.layer = 1;
mesh.userData.sourceLabel = mesh.userData.label;
scene.add(mesh);
});
const bagByLabel = {};
bags.forEach(b => { bagByLabel[b.userData.label] = b; });
const previewLayer2Bags = [];
const SIDE_DECAL_KEY = 'sideDecal';

function createBagSideDecalMaterial() {
return new THREE.MeshBasicMaterial({
map: bag.textures.front,
transparent: true,
alphaTest: 0.08,
side: THREE.FrontSide,
depthWrite: false,
toneMapped: false
});
}

function syncBagSideDecal(bagMesh) {
if (!bagMesh) return;

let sideDecal = bagMesh.userData[SIDE_DECAL_KEY];
if (!sideDecal) {
sideDecal = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), createBagSideDecalMaterial());
sideDecal.renderOrder = 10;
sideDecal.userData.isSideDecal = true;
bagMesh.add(sideDecal);
bagMesh.userData[SIDE_DECAL_KEY] = sideDecal;
}

const previousGeometry = sideDecal.geometry;
sideDecal.geometry = new THREE.PlaneGeometry(state.bagWidth * 0.84, state.bagHeight * 0.36);
if (previousGeometry) previousGeometry.dispose();

sideDecal.position.set(
0,
state.bagHeight * 0.05,
(state.bagLength / 2) + getScaledFrontBulgeZ() + 0.003
);

if (sideDecal.material?.map !== bag.textures.front) {
sideDecal.material.map = bag.textures.front;
}
sideDecal.material.needsUpdate = true;
}

function getAllBags() {
return bags.concat(previewLayer2Bags);
}
bags.forEach(mesh => {
syncBagSideDecal(mesh);
});
function normalizeRotationY(angle) {
return THREE.MathUtils.euclideanModulo(angle, Math.PI * 2);
}
function getLayerCenterY(layerIndex) {
return getBagCenterY() + ((layerIndex - 1) * state.bagHeight);
}
function getLayer2FrontGroupBaseZ() {
return -(rowAnchors.backZ + state.gapRows);
}
function getLayer2RearGroupBaseZ() {
return -rowAnchors.frontZ;
}
function getLayer2FrontGroupCenterZ() {
return getLayer2FrontGroupBaseZ() - (state.rearRowOffsetMm / 1000);
}
function getLayer2RearGroupCenterZ() {
return getLayer2RearGroupBaseZ() - (state.frontRowOffsetMm / 1000);
}
function getLayer2PreviewLayout() {
const frontThreeZ = getLayer2FrontGroupCenterZ();
const backTwoZ = getLayer2RearGroupCenterZ();
return [
{ sourceLabel: 3, x: bagByLabel[3]?.position.x ?? -state.gapMiddle, z: frontThreeZ, rot: bagByLabel[3]?.rotation.y ?? THREE.MathUtils.degToRad(270) },

previousGeometry.dispose();
}
}
function getTopVisibleLayer() {
return getAllBags().reduce((topLayer, bagMesh) => {
if (!bagMesh.visible) return topLayer;
return Math.max(topLayer, bagMesh.userData.layer || 1);
}, 0);
}
function updateLabelPositions() {
const topVisibleLayer = getTopVisibleLayer();
bagLabels.forEach(label => {
const parentBag = label.userData.parentBag;
label.position.set(0, state.bagHeight * 0.72, 0);
label.visible = Boolean(
state.showLabels &&
parentBag &&
parentBag.visible &&
((parentBag.userData.layer || 1) === topVisibleLayer)
);
});
}
function updateLayerVisibility() {
bags.forEach(bagMesh => {
bagMesh.visible = state.showLayer1;
});
previewLayer2Bags.forEach(bagMesh => {
bagMesh.visible = state.showLayer2;
});
updateLabelPositions();
}
// ============ Gap Control Functions ============
function updateGapRows(value) {
const frontOffsetMm = state.frontRowOffsetMm;
const rearOffsetMm = state.rearRowOffsetMm;
state.gapRows = normalizeRowGap(value);
[5,4].forEach(label => {
const b = bagByLabel[label];
if (b) {
const initialZ = bagPositions.find(p => p.label === label).z;
b.position.z = initialZ;
}
});
[3,2,1].forEach(label => {
const b = bagByLabel[label];
if (b) {
const initialZ = bagPositions.find(p => p.label === label).z;
b.position.z = initialZ + state.gapRows;
}
});
walls[0].position.z = rowAnchors.frontZ;
walls[1].position.z = rowAnchors.backZ + state.gapRows;
walls[2].position.z = rowAnchors.backZ + state.gapRows;
syncDividerWallZ();
moveFrontGroupZByOffsetMm(frontOffsetMm);
moveRearGroupZByOffsetMm(rearOffsetMm);
updateActiveBagDisplay();
refreshZOffsetControllers();
}
function updateGapMiddle(value) {
state.gapMiddle = normalizeRearGap(value);
const centerX = getRearGroupCenterX();
walls[1].position.x = centerX - state.gapMiddle / 2;
walls[2].position.x = centerX + state.gapMiddle / 2;
if (bagByLabel[2]) bagByLabel[2].position.x = clampBagXPosition(2, centerX, bagByLabel[2].rotation.y);
if (bagByLabel[1]) bagByLabel[1].position.x = clampBagXPosition(1, centerX + state.gapMiddle, bagByLabel[1].rotation.y);
if (bagByLabel[3]) bagByLabel[3].position.x = clampBagXPosition(3, centerX - state.gapMiddle, bagByLabel[3].rotation.y);
updateActiveBagDisplay();
}
function updateActiveBagDisplay() {
syncPreviewLayer2();
updateLabelPositions();
}
// เรียกใช้ครั้งแรก
updateFrontGap(state.gapFront);
updateGapMiddle(state.gapMiddle);
updateGapRows(state.gapRows);
updateLayerVisibility();
// ============ UI Control Functions ============
function resetAllBags() {
applyManualPreset();
}
function alignViewToActive() {
const active = bagByLabel[state.activeBag];
if (active) {
controls.target.copy(active.position);
controls.target.y = 0.5;
}
}
function toggleWalls() {
state.showWalls = !state.showWalls;
walls.forEach(w => w.visible = state.showWalls);
}
// ============ Clean up existing GUI ============
const existingGui = document.querySelector('.lil-gui');
if (existingGui) existingGui.remove();
if (window.gui) {
try { window.gui.destroy(); } catch(e) {}
}
// ============ lil-gui Setup ============
const gui = new GUI({ title: 'ปรับแต่งโครงสร้าง', width: 300 });
window.gui = gui;

const dimensionControllers = [];
var frontZOffsetController;
var rearZOffsetController;

function updateControllerBounds(controller, bounds, fallbackPadding = 20) {
if (!controller) return;

if (bounds.min > bounds.max) {
const center = (bounds.min + bounds.max) / 2;
controller.min(center - fallbackPadding);
controller.max(center + fallbackPadding);
} else {
controller.min(bounds.min);
controller.max(bounds.max);
}

controller.updateDisplay();
}

function refreshZOffsetControllers() {
syncRowOffsetState();
updateControllerBounds(frontZOffsetController, getSharedFrontGroupOffsetBoundsMm(), 20);
updateControllerBounds(rearZOffsetController, getSharedRearGroupOffsetBoundsMm(), 20);
}

function setGroupCenters(frontCenterX = 0, rearCenterX = 0) {
if (walls[0]) walls[0].position.x = frontCenterX;
if (bagByLabel[2]) bagByLabel[2].position.x = rearCenterX;
if (walls[1]) walls[1].position.x = rearCenterX - state.gapMiddle / 2;
if (walls[2]) walls[2].position.x = rearCenterX + state.gapMiddle / 2;
}
function applyPackedFootprint({ refreshUi = true } = {}) {
const packed = getPackedBagDimensions();
state.bagWidth = packed.width;
state.bagLength = packed.length;
state.bagHeight = packed.height;
state.gapRows = 0;
state.gapFront = getIdealFrontGap();
state.gapMiddle = getIdealRearGap();
const frontLeft = bagPositions.find(pos => pos.label === 5);
const frontRight = bagPositions.find(pos => pos.label === 4);
const rearLeft = bagPositions.find(pos => pos.label === 3);
const rearCenter = bagPositions.find(pos => pos.label === 2);
const rearRight = bagPositions.find(pos => pos.label === 1);
if (frontLeft) frontLeft.x = -state.gapFront;
if (frontRight) frontRight.x = state.gapFront;
if (rearLeft) rearLeft.x = -state.gapMiddle;
if (rearCenter) rearCenter.x = 0;
if (rearRight) rearRight.x = state.gapMiddle;
setGroupCenters(0, 0);
syncDimensionParamsFromState();
applyBagDimensions();
state.frontRowOffsetMm = DEFAULT_Z_OFFSETS_MM.front;
state.rearRowOffsetMm = DEFAULT_Z_OFFSETS_MM.rear;
moveFrontGroupZByOffsetMm(state.frontRowOffsetMm);
moveRearGroupZByOffsetMm(state.rearRowOffsetMm);
if (refreshUi) {
refreshZOffsetControllers();
gui.controllers.forEach(controller => controller.updateDisplay());
}
}
function applyManualPreset({ refreshUi = true } = {}) {
state.bagWidth = MANUAL_PRESET_BAG.WIDTH;
state.bagLength = MANUAL_PRESET_BAG.LENGTH;
state.bagHeight = MANUAL_PRESET_BAG.HEIGHT;
state.gapRows = DEFAULT_GAPS.rows;
state.gapFront = DEFAULT_GAPS.front;
state.gapMiddle = DEFAULT_GAPS.rear;
const frontLeft = bagPositions.find(pos => pos.label === 5);
const frontRight = bagPositions.find(pos => pos.label === 4);
const rearLeft = bagPositions.find(pos => pos.label === 3);
const rearCenter = bagPositions.find(pos => pos.label === 2);
const rearRight = bagPositions.find(pos => pos.label === 1);
if (frontLeft) frontLeft.x = -DEFAULT_GAPS.front;
if (frontRight) frontRight.x = DEFAULT_GAPS.front;
if (rearLeft) rearLeft.x = -DEFAULT_GAPS.rear;
if (rearCenter) rearCenter.x = 0;
if (rearRight) rearRight.x = DEFAULT_GAPS.rear;
setGroupCenters(0, 0);
syncDimensionParamsFromState();
applyBagDimensions();
state.frontRowOffsetMm = DEFAULT_Z_OFFSETS_MM.front;
state.rearRowOffsetMm = DEFAULT_Z_OFFSETS_MM.rear;
moveFrontGroupZByOffsetMm(state.frontRowOffsetMm);
moveRearGroupZByOffsetMm(state.rearRowOffsetMm);
if (refreshUi) {
refreshZOffsetControllers();
gui.controllers.forEach(controller => controller.updateDisplay());
}
}
// --- Folder 2: ขนาดถุงทั้ง 5 ใบ ---
const sizeFolder = gui.addFolder('ขนาดถุงทั้ง 5 ใบ');
dimensionControllers.push(
sizeFolder.add(dimensionParams, 'width_mm', 250, 800, 1).name('WIDTH (X) mm').onChange(() => {
    state.bagWidth = dimensionParams.width_mm / 1000;
    state.bagLength = dimensionParams.length_mm / 1000;
    state.bagHeight = dimensionParams.height_mm / 1000;
    applyBagDimensions();
}),
sizeFolder.add(dimensionParams, 'length_mm', 150, 500, 1).name('LENGTH (Z) mm').onChange(() => {
    state.bagWidth = dimensionParams.width_mm / 1000;
    state.bagLength = dimensionParams.length_mm / 1000;
    state.bagHeight = dimensionParams.height_mm / 1000;
    applyBagDimensions();
}),
sizeFolder.add(dimensionParams, 'height_mm', 80, 250, 1).name('HEIGHT (Y) mm').onChange(() => {
    state.bagWidth = dimensionParams.width_mm / 1000;
    state.bagLength = dimensionParams.length_mm / 1000;
    state.bagHeight = dimensionParams.height_mm / 1000;
    applyBagDimensions();
})
);
sizeFolder.add({ resetSize: () => {
applyManualPreset();
}}, 'resetSize').name('รีเซ็ตขนาดถุง');
sizeFolder.add({ fitToPallet: () => applyPackedFootprint() }, 'fitToPallet').name('จัดถุงให้เต็มพาเลท');
sizeFolder.open();
// --- Folder 3: Z offset แยกแถว ---
const zOffsetFolder = gui.addFolder('Z Offset แยกแถว');
rearZOffsetController = zOffsetFolder.add(state, 'rearRowOffsetMm', -300, 300).name('แถว 1-2-3').step(1).listen().onChange(val => {
moveRearGroupZByOffsetMm(val);
});
frontZOffsetController = zOffsetFolder.add(state, 'frontRowOffsetMm', -300, 300).name('แถว 4-5').step(1).listen().onChange(val => {
moveFrontGroupZByOffsetMm(val);
});
zOffsetFolder.open();
// --- Folder 4: สีถุง ---
const bagColorFolder = gui.addFolder('สีถุง');
bagColorFolder.addColor(state, 'bagColor').name('สีตัวถุง').onChange(applyBagBodyColor);
bagColorFolder.open();
// --- Folder 4: ผนังกั้นช่อง ---
const wallFolder = gui.addFolder('ผนังกั้นช่อง');
wallFolder.add(state, 'showWalls').name('แสดงผนัง').onChange(val => walls.forEach(w => w.visible = val));
wallFolder.add(state, 'wallOpacity', 0, 1).name('ความโปร่งใส').step(0.05).onChange(val => {
walls.forEach(w => w.material.opacity = val);
});
wallFolder.addColor(state, 'wallColor').name('สี').onChange(val => {
walls.forEach(w => w.material.color.set(val));
});
wallFolder.open();
// --- Folder 5: พาเลท ---
const palletFolder = gui.addFolder('พาเลท');
palletFolder.add(pallet, 'visible').name('แสดงพาเลท');
palletFolder.add(state, 'palletOpacity', 0, 1).name('ความโปร่งใส').step(0.05).onChange(val => {
pallet.material.opacity = val;
});
palletFolder.addColor(state, 'palletColor').name('สี').onChange(val => {
pallet.material.color.set(val);
});
palletFolder.add(wireframe, 'visible').name('แสดงขอบพาเลท');
palletFolder.open();
// --- Folder 6: มุมมอง ---
const viewFolder = gui.addFolder('มุมมอง');
viewFolder.add(state, 'showLayer1').name('แสดงชั้น 1').onChange(updateLayerVisibility);
viewFolder.add(state, 'showLayer2').name('แสดงชั้น 2').onChange(updateLayerVisibility);
viewFolder.add(gridHelper, 'visible').name('แสดง Grid');
viewFolder.add(state, 'showLabels').name('แสดงตัวเลขถุง').onChange(val => {
state.showLabels = val;
updateLabelPositions();
});
viewFolder.open();
applyManualPreset({ refreshUi: false });
applyBagBodyColor();
refreshZOffsetControllers();
// ============ Button Event Listeners ============
document.getElementById('btn-reset').addEventListener('click', resetAllBags);
document.getElementById('btn-align').addEventListener('click', alignViewToActive);
document.getElementById('btn-wall-toggle').addEventListener('click', toggleWalls);
// ตั้งค่าเริ่มต้น
document.getElementById('btn-reset').classList.add('active');
updateActiveBagDisplay();
// ============ Animation Loop ============
function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
labelRenderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
