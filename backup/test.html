<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: http: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;">
    <title>Bag Shape — POLIMAXX (Single Bag, OOP) - Fixed</title>
    <style>
        body { margin:0; background:#111216; color:#ddd; font-family:Arial, sans-serif; }
        .ui { position: absolute; left:12px; top:12px; z-index:10; background:rgba(0,0,0,0.6); padding:10px 12px; border-radius:8px; border-left:4px solid #f37021; }
        .ui h2 { margin:0 0 6px 0; font-size:14px; color:#f37021 }
        .fixed-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #00ff88;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 20;
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div class="fixed-badge">✅ TEXTURE FIXED - No Stretching</div>
    <div class="ui"><h2>Bag Shape — Fixed Version</h2><div>Side texture now renders correctly without stretching</div></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --------- Bag class (OOP) with fixed textures ---------
        class PolimaxxBag {
            constructor(opts = {}) {
                this.width = opts.width ?? 0.925;
                this.height = opts.height ?? 0.28;
                this.length = opts.length ?? 0.5667;
                this.segments = opts.segments ?? 24;

                // สร้าง textures ด้วยวิธีที่ถูกต้อง
                this.topTexture = PolimaxxBag.makeTopTexture(-Math.PI / 2);
                this.sideTexture = PolimaxxBag.makeSideTextureFixed(); // ใช้ version ที่แก้ไขแล้ว
                this.bumpTexture = PolimaxxBag.makeFabricTexture();
                this.blankTexture = PolimaxxBag.makeBlankTexture();

                this.geometry = this._createGeometryFixed();
                this.materials = this._createMaterials();
                this.mesh = new THREE.Mesh(this.geometry, this.materials);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
            }

            _createGeometryFixed() {
                const segments = 24;
                const geo = new THREE.BoxGeometry(this.width, this.height, this.length, segments, segments, segments);
                const pos = geo.attributes.position;
                const normal = geo.attributes.normal;
                const v3 = new THREE.Vector3();
                
                // เก็บ original positions ไว้ใช้คำนวณ UV
                const origPosArray = new Float32Array(pos.array);

                // sculpt geometry (เหมือนเดิม)
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);

                    const nx = v3.x / (this.width / 2);
                    const ny = v3.y / (this.height / 2);
                    const nz = v3.z / (this.length / 2);

                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.25);
                    v3.x *= (1 - endCurve * 0.08);

                    const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;

                    const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;

                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }

                // คำนวณ normal ใหม่หลัง sculpt
                geo.computeVertexNormals();

                // UV Mapping ที่ถูกต้องสำหรับ side faces
                const uv = geo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    
                    // ดึง normal จาก geometry ที่คำนวณใหม่แล้ว
                    const normalX = normal.getX(i);
                    const normalY = normal.getY(i);
                    const normalZ = normal.getZ(i);

                    // อ่าน original coordinates
                    const ox = origPosArray[i * 3 + 0];
                    const oy = origPosArray[i * 3 + 1];
                    const oz = origPosArray[i * 3 + 2];

                    // Top/Bottom faces - ใช้ original XZ
                    if (Math.abs(normalY) > 0.5) {
                        if (normalY > 0) { // Top
                            uv.setXY(i, (ox / this.width) + 0.5, 1.0 - ((oz / this.length) + 0.5));
                        } else { // Bottom
                            uv.setXY(i, (ox / this.width) + 0.5, (oz / this.length) + 0.5);
                        }
                    }
                    // Side faces - UV mapping ที่ถูกต้องไม่ให้ข้อความกลับด้าน
                    else if (Math.abs(normalX) > 0.5) {
                        // U ใช้ original Z (ความยาว) เพื่อให้ texture วางตามแนวยาวของถุง
                        // V ใช้ sculpted Y (ความสูง) เพื่อให้ texture ติดตามการบิดเบี้ยว
                        
                        let u, v;
                        
                        if (normalX > 0) { // Right face (+X)
                            // กลับด้าน U เพื่อให้ข้อความอ่านจากซ้ายไปขวาเมื่อมองจากด้านขวา
                            u = 1.0 - ((oz / this.length) + 0.5);
                        } else { // Left face (-X)
                            // ไม่ต้องกลับ
                            u = (oz / this.length) + 0.5;
                        }
                        
                        // V ใช้ sculpted height (v3.y แทน oy) เพื่อให้ texture ติดตามการบิด
                        v = 1.0 - ((v3.y / this.height) + 0.5);
                        
                        // Clamp ค่าให้อยู่ในช่วง 0-1
                        u = Math.max(0, Math.min(1, u));
                        v = Math.max(0, Math.min(1, v));
                        
                        uv.setXY(i, u, v);
                    }
                    // Front/Back faces - ใช้ default UV ของ BoxGeometry
                }

                return geo;
            }

            _createMaterials() {
                // ตั้งค่า material ด้วย texture filtering ที่เหมาะสม
                const createMaterial = (map, color = 0xffffff, roughness = 0.6, metalness = 0.05, bumpMap = null, bumpScale = 0.0008) => {
                    const mat = new THREE.MeshStandardMaterial({
                        color: color,
                        map: map,
                        roughness: roughness,
                        metalness: metalness,
                        bumpMap: bumpMap,
                        bumpScale: bumpScale,
                        side: THREE.DoubleSide
                    });
                    
                    // ตั้งค่า texture filtering
                    if (map) {
                        map.minFilter = THREE.LinearMipMapLinearFilter;
                        map.magFilter = THREE.LinearFilter;
                        map.generateMipmaps = true;
                    }
                    
                    return mat;
                };

                const right = createMaterial(this.blankTexture);
                const left = createMaterial(this.sideTexture, 0xffffff, 0.5);
                const top = createMaterial(this.topTexture, 0xffffff, 0.45, 0.05, this.bumpTexture, 0.0008);
                const bottom = createMaterial(this.topTexture, 0xffffff, 0.45, 0.05, this.bumpTexture, 0.0008);
                const front = createMaterial(this.blankTexture);
                const back = createMaterial(this.blankTexture);

                return [right, left, top, bottom, front, back];
            }

            getMesh() { return this.mesh; }

            // static helpers
            static makeTopTexture(rotation = 0) {
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                if (rotation !== 0) {
                    ctx.translate(centerX, centerY);
                    ctx.rotate(rotation);
                    ctx.translate(-centerX, -centerY);
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', centerX, 400);

                ctx.strokeStyle = '#f37021'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2); ctx.stroke();

                ctx.fillStyle = '#f37021'; ctx.font = 'bold 360px sans-serif'; ctx.fillText('PP', centerX, 840);

                ctx.fillStyle = '#0e3a66'; ctx.font = 'bold 150px sans-serif'; ctx.fillText('POLYETHYLENE', centerX, 1040);

                ctx.strokeStyle = '#f37021'; ctx.lineWidth = 30;
                ctx.beginPath(); ctx.arc(1760, 400, 120, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 20; ctx.beginPath(); ctx.arc(1840, 640, 60, 0, Math.PI * 2); ctx.stroke();

                for (let i = 0; i < 4; i++) {
                    const x = 400 + (i * 170);
                    const y = 1360;
                    ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(x, y, 64, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, 64, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#ff6666'; ctx.beginPath(); ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2); ctx.fill();
                }

                ctx.textAlign = 'left'; ctx.fillStyle = '#111'; ctx.font = 'bold 120px sans-serif'; ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

                if (rotation !== 0) ctx.setTransform(1, 0, 0, 1, 0, 0);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 16;
                tex.minFilter = THREE.LinearMipMapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = true;
                tex.needsUpdate = true;
                return tex;
            }

            // FIXED: side texture ที่ไม่ยืด
            static makeSideTextureFixed() {
                const canvas = document.createElement('canvas');
                // ใช้สัดส่วนตามขนาดจริงของ side face (length : height)
                // length = 0.5667 m, height = 0.28 m → ratio ~2.02:1
                canvas.width = 2048;
                canvas.height = Math.round(2048 * (0.28 / 0.5667)); // ~1012 pixels
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // ใช้ relative sizing แทน fixed pixels
                const midY = canvas.height / 2;
                
                // กำหนดตำแหน่งและขนาดเป็น % ของ canvas
                const marginX = 0.03 * canvas.width;
                const startX = marginX;
                
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                
                // Batch text - 12% ของความสูง
                const fontSize1 = 0.12 * canvas.height;
                ctx.font = `bold ${fontSize1}px 'Arial', sans-serif`;
                ctx.fillStyle = '#000000';
                
                const batchText = '1126NK 0260204008';
                ctx.fillText(batchText, startX, midY);
                
                // วัดความกว้างข้อความ batch
                const batchWidth = ctx.measureText(batchText).width;
                
                // Diamond icon - ขนาด 4% ของความสูง
                const iconX = startX + batchWidth + (0.03 * canvas.width);
                const iconY = midY;
                const iconSize = 0.04 * canvas.height;
                
                ctx.lineWidth = Math.max(2, 0.01 * canvas.height);
                ctx.strokeStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(iconX, iconY - iconSize);
                ctx.lineTo(iconX + iconSize, iconY);
                ctx.lineTo(iconX, iconY + iconSize);
                ctx.lineTo(iconX - iconSize, iconY);
                ctx.closePath();
                ctx.stroke();
                
                // เส้นกากบาทใน diamond
                ctx.beginPath();
                ctx.moveTo(iconX, iconY - iconSize);
                ctx.lineTo(iconX, iconY + iconSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(iconX - iconSize, iconY);
                ctx.lineTo(iconX + iconSize, iconY);
                ctx.stroke();
                
                // TIS และ PP text - ขนาด 6% ของความสูง
                const fontSize2 = 0.06 * canvas.height;
                ctx.font = `bold ${fontSize2}px 'Arial', sans-serif`;
                
                const textX = iconX + (0.06 * canvas.width);
                const lineSpacing = 0.035 * canvas.height;
                
                ctx.fillText('TIS.1306-2566', textX, midY - lineSpacing);
                ctx.fillText('PP-01-1-5-F', textX, midY + lineSpacing);
                
                // QR Code block
                const qrX = textX + (0.18 * canvas.width);
                const qrY = midY - (0.06 * canvas.height);
                const qrSize = 0.1 * canvas.height;
                
                ctx.fillStyle = '#000000';
                ctx.fillRect(qrX, qrY, qrSize, qrSize);
                
                // สร้างลวดลาย QR แบบง่าย
                ctx.fillStyle = '#ffffff';
                const cellSize = qrSize / 9;
                for(let i = 0; i < 3; i++) {
                    for(let j = 0; j < 3; j++) {
                        if((i + j) % 2 === 0) {
                            ctx.fillRect(
                                qrX + (cellSize * (i * 3 + 1)),
                                qrY + (cellSize * (j * 3 + 1)),
                                cellSize * 2,
                                cellSize * 2
                            );
                        }
                    }
                }
                
                // PP HOMO text
                ctx.fillStyle = '#000000';
                const ppX = qrX + (0.1 * canvas.width);
                ctx.font = `bold ${fontSize2}px 'Arial', sans-serif`;
                ctx.fillText('PP HOMO', ppX, midY - lineSpacing);
                ctx.fillText('B  06:28', ppX, midY + lineSpacing);
                
                // RoHS ที่มุมขวา
                ctx.font = `italic bold ${fontSize2}px 'Arial', sans-serif`;
                ctx.textAlign = 'right';
                ctx.fillText('(RoHS)', canvas.width - marginX, midY);

                // เพิ่มเส้นขอบบางๆ รอบ canvas เพื่อดูขอบเขต
                ctx.strokeStyle = '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 16;
                tex.minFilter = THREE.LinearMipMapLinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.wrapS = THREE.ClampToEdgeWrapping;
                tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.generateMipmaps = true;
                tex.needsUpdate = true;
                
                return tex;
            }

            static makeFabricTexture() {
                const size = 512;
                const c = document.createElement('canvas'); 
                c.width = size; 
                c.height = size; 
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#bfbfbf'; 
                ctx.fillRect(0,0,size,size);
                ctx.strokeStyle = '#d7d7d7'; 
                ctx.lineWidth = 2;
                for (let i = -size; i < size*2; i += 8) {
                    ctx.beginPath(); 
                    ctx.moveTo(i, 0); 
                    ctx.lineTo(i + size, size); 
                    ctx.stroke();
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping; 
                tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(12, 24);
                tex.needsUpdate = true;
                return tex;
            }

            static makeBlankTexture() { 
                const c = document.createElement('canvas'); 
                c.width = 2048; 
                c.height = 512; 
                const ctx = c.getContext('2d'); 
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0,0,c.width,c.height); 
                const t = new THREE.CanvasTexture(c); 
                t.needsUpdate = true; 
                return t; 
            }
        }

        // --------- Scene setup ---------
        const scene = new THREE.Scene(); 
        scene.background = new THREE.Color(0x111216);

        const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100); 
        camera.position.set(1.6, 0.9, 2.6);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); 
        renderer.setSize(innerWidth, innerHeight); 
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement); 
        controls.enableDamping = true; 
        controls.target.set(0, 0.12, 0);

        // lights
        const hemi = new THREE.HemisphereLight(0xffffff, 0x111122, 0.7); 
        scene.add(hemi);
        
        const dir = new THREE.DirectionalLight(0xfff7e6, 1.2); 
        dir.position.set(2, 3, 1.5); 
        dir.castShadow = true; 
        dir.shadow.mapSize.set(2048, 2048); 
        dir.shadow.camera.near = 0.1; 
        dir.shadow.camera.far = 10; 
        dir.shadow.camera.left = -2; 
        dir.shadow.camera.right = 2; 
        dir.shadow.camera.top = 2; 
        dir.shadow.camera.bottom = -2; 
        scene.add(dir);

        // ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(10, 10), 
            new THREE.MeshStandardMaterial({ color: 0x1e2228, roughness: 0.95 })
        ); 
        ground.rotation.x = -Math.PI/2; 
        ground.position.y = -0.25; 
        ground.receiveShadow = true; 
        scene.add(ground);

        const grid = new THREE.GridHelper(6, 12, 0x444b55, 0x15171a); 
        grid.position.y = -0.249; 
        scene.add(grid);

        // create bag
        const extraGroup = new THREE.Group();
        const bag = new PolimaxxBag();
        const bagMesh = bag.getMesh(); 
        bagMesh.position.set(0, 0.12, 0); 
        extraGroup.add(bagMesh);

        // เพิ่ม anisotropy สูงสุด
        const maxAniso = renderer.capabilities.getMaxAnisotropy();
        if (bag.sideTexture) {
            bag.sideTexture.anisotropy = maxAniso;
            bag.sideTexture.needsUpdate = true;
        }
        if (bag.topTexture) {
            bag.topTexture.anisotropy = maxAniso;
            bag.topTexture.needsUpdate = true;
        }

        // pallet รองใต้ถุง
        const palletRef = new THREE.Mesh(
            new THREE.BoxGeometry(1.0, 0.02, 0.9), 
            new THREE.MeshStandardMaterial({ color: 0x25323a, roughness: 0.9 })
        ); 
        palletRef.position.set(0, 0.01, 0); 
        palletRef.receiveShadow = true; 
        extraGroup.add(palletRef);

        scene.add(extraGroup);

        // จัดตำแหน่งถุงให้อยู่บน pallet
        const palletHalf = (palletRef.geometry.parameters.height || 0.02) / 2;
        const palletTop = palletRef.position.y + palletHalf;
        const bagHalf = (bag.height || 0.28) / 2;
        const minAllowed = palletTop + bagHalf + 0.001;
        if (bagMesh.position.y < minAllowed) bagMesh.position.y = minAllowed;

        // สร้าง UI แบบง่าย
        const moveCtrl = document.createElement('div');
        moveCtrl.style.position = 'absolute'; 
        moveCtrl.style.top = '80px'; 
        moveCtrl.style.left = '12px'; 
        moveCtrl.style.background = 'rgba(0,0,0,0.6)'; 
        moveCtrl.style.color = '#fff'; 
        moveCtrl.style.padding = '10px'; 
        moveCtrl.style.borderRadius = '8px'; 
        moveCtrl.style.fontFamily = 'sans-serif'; 
        moveCtrl.style.zIndex = 999;
        moveCtrl.innerHTML = '<strong>Controls</strong><br/><small>Side texture fixed - no stretching</small>';
        document.body.appendChild(moveCtrl);

        // รีเซ็ตวิว
        const resetBtn = document.createElement('button');
        resetBtn.textContent = 'Reset View';
        resetBtn.style.position = 'absolute';
        resetBtn.style.top = '12px';
        resetBtn.style.right = '100px';
        resetBtn.style.zIndex = 1000;
        resetBtn.style.padding = '8px 16px';
        resetBtn.style.background = '#00ff88';
        resetBtn.style.color = '#000';
        resetBtn.style.border = 'none';
        resetBtn.style.borderRadius = '20px';
        resetBtn.style.cursor = 'pointer';
        resetBtn.style.fontWeight = 'bold';
        resetBtn.addEventListener('click', () => {
            camera.position.set(1.6, 0.9, 2.6);
            controls.target.set(0, 0.12, 0);
            controls.update();
        });
        document.body.appendChild(resetBtn);

        // animate
        function onResize() { 
            camera.aspect = innerWidth/innerHeight; 
            camera.updateProjectionMatrix(); 
            renderer.setSize(innerWidth, innerHeight); 
        }
        addEventListener('resize', onResize);

        function animate() { 
            requestAnimationFrame(animate); 
            controls.update(); 
            renderer.render(scene, camera); 
        }
        animate();

    </script>
</body>
</html>
