<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Resin Sack - Curved Shape with UI Controls</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222222;
            font-family: 'Arial', sans-serif;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border-left: 4px solid #f37021;
            z-index: 100;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            pointer-events: auto;
        }
        h1 { margin: 0; font-size: 16px; color: #f37021; text-transform: uppercase; letter-spacing: 1px; }
        p { margin: 5px 0 0; font-size: 12px; opacity: 0.8; }
        input[type="checkbox"] { cursor: pointer; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div class="ui-panel">
        <h1>POLIMAXX - Curved Resin Sack</h1>
        <p>ปรับทรงกระสอบให้โค้งมนพร้อมระบบแสดง Index พื้นผิว</p>
        <div class="controls">
            <input type="checkbox" id="showIndex">
            <label for="showIndex">แสดง Index บนแต่ละด้าน (Surface Labels)</label>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(9, 6, 11); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3; 
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const light1 = new THREE.SpotLight(0xffffff, 2.0);
        light1.position.set(10, 15, 10);
        light1.castShadow = true;
        scene.add(light1);

        const light2 = new THREE.PointLight(0xffffff, 1.2);
        light2.position.set(-10, -5, -5);
        scene.add(light2);

        // --- Helpers: Label Creation ---
        function createLabelTexture(index, baseColor = '#ffffff') {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // พื้นหลัง
            ctx.fillStyle = baseColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // ตัวเลข Index
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 300px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(index, 256, 256);
            
            // กรอบ
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 20;
            ctx.strokeRect(20, 20, 472, 472);

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        // --- Texture Creation: Top/Bottom ---
        function createTopTexture(showIndex = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048; canvas.height = 2048;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0e3a66';
            ctx.font = 'bold 220px sans-serif';
            ctx.fillText('POLIMAXX', centerX, 400);
            
            ctx.fillStyle = '#f37021';
            ctx.beginPath(); ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#f37021';
            ctx.font = 'bold 360px sans-serif';
            ctx.fillText('PP', centerX, 840);

            ctx.font = 'bold 150px sans-serif';
            ctx.fillText('POLYETHYLENE', centerX, 1040);

            ctx.strokeStyle = '#f37021'; ctx.lineWidth = 30;
            ctx.beginPath(); ctx.arc(1760, 400, 120, 0, Math.PI * 2); ctx.stroke();
            
            ctx.textAlign = 'left'; ctx.fillStyle = '#111'; ctx.font = 'bold 120px sans-serif';
            ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Texture Creation: Side ---
        function createSideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 4096; canvas.height = 1024; 
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000000';
            ctx.textBaseline = 'middle';
            
            const midY = 512;
            let currentX = 650; 

            ctx.textAlign = 'left';
            ctx.font = 'bold 130px sans-serif';
            ctx.fillText('1126NK 0260204008', currentX, midY);
            currentX += 1380; 

            const symbolX = currentX;
            const symbolY = midY;
            ctx.lineWidth = 14;
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(symbolX, symbolY - 75);
            ctx.lineTo(symbolX + 75, symbolY);
            ctx.lineTo(symbolX, symbolY + 75);
            ctx.lineTo(symbolX - 75, symbolY);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX, symbolY - 75); ctx.lineTo(symbolX, symbolY + 75); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(symbolX - 35, symbolY); ctx.lineTo(symbolX + 35, symbolY); ctx.stroke();

            ctx.font = 'bold 60px sans-serif';
            ctx.fillText('TIS.1306-2566', symbolX + 110, midY - 38);
            ctx.fillText('PP-01-1-5-F', symbolX + 110, midY + 38);
            currentX += 540; 

            const qrX = currentX;
            const qrY = midY - 85;
            ctx.fillRect(qrX, qrY, 170, 170); 
            ctx.fillStyle = '#fff';
            for(let i=0; i<3; i++) {
                for(let j=0; j<3; j++) {
                    if((i+j)%2==0) ctx.fillRect(qrX+18+(i*48), qrY+18+(j*48), 40, 40);
                }
            }
            ctx.fillStyle = '#000';
            currentX += 280; 

            ctx.font = 'bold 75px sans-serif';
            ctx.fillText('PP HOMO', currentX, midY - 38);
            ctx.fillText('B  06:28', currentX, midY + 38);
            currentX += 460; 
            
            ctx.font = 'italic bold 85px sans-serif';
            ctx.fillText('(RoHS)', currentX, midY);

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 16;
            return texture;
        }

        const topTex = createTopTexture();
        const sideTex = createSideTexture();

        // --- Realistic Sack Geometry ---
        const width = 2.4;
        const height = 0.95;
        const depth = 4.5; 
        const segments = 100;

        const sackGeo = new THREE.BoxGeometry(width, height, depth, segments, segments, segments);
        const pos = sackGeo.attributes.position;
        const uv = sackGeo.attributes.uv;
        const v3 = new THREE.Vector3();

        for (let i = 0; i < pos.count; i++) {
            v3.fromBufferAttribute(pos, i);
            const nx = v3.x / (width / 2);
            const ny = v3.y / (height / 2);
            const nz = v3.z / (depth / 2);
            const endEffect = Math.pow(Math.abs(nz), 4);
            v3.y *= (1.0 - endEffect * 0.7);
            v3.x *= (1.0 - endEffect * 0.2);
            const bulgeX = Math.cos(nx * Math.PI * 0.5);
            const bulgeY = Math.cos(ny * Math.PI * 0.5);
            const bulgeZ = Math.cos(nz * Math.PI * 0.5);
            if (Math.abs(nz) < 0.98) {
                const bulgeIntensity = 0.25; 
                v3.x += (v3.x > 0 ? 1 : -1) * bulgeIntensity * bulgeZ * bulgeY;
                v3.y += (v3.y > 0 ? 1 : -1) * (bulgeIntensity * 0.5) * bulgeZ * bulgeX;
                v3.y += Math.sin(v3.x * 10 + v3.z * 5) * 0.005;
            }
            pos.setXYZ(i, v3.x, v3.y, v3.z);
        }

        // UV Correction
        for (let i = 0; i < pos.count; i++) {
            v3.fromBufferAttribute(pos, i);
            const normalX = sackGeo.attributes.normal.getX(i);
            const normalY = sackGeo.attributes.normal.getY(i);
            if (Math.abs(normalY) > 0.6) { 
                uv.setXY(i, ((-v3.x) / (width + 0.8)) + 0.5, (v3.z / depth) + 0.5);
            } else if (normalX > 0.4) { 
                const u = 0.52 - (v3.z / (depth * 1.15)); 
                const v = (v3.y / (height * 2.5)) + 0.5; 
                uv.setXY(i, u, v);
            }
        }
        sackGeo.computeVertexNormals();

        // --- Materials ---
        const materialsBase = [
            new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.4, metalness: 0.05 }), // Index 0: Right (Side)
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),             // Index 1: Left
            new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.35, metalness: 0.05 }), // Index 2: Top
            new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.35, metalness: 0.05 }), // Index 3: Bottom
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),             // Index 4: Front
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 })              // Index 5: Back
        ];

        const materialsLabel = [
            new THREE.MeshStandardMaterial({ map: createLabelTexture(0) }),
            new THREE.MeshStandardMaterial({ map: createLabelTexture(1) }),
            new THREE.MeshStandardMaterial({ map: createLabelTexture(2) }),
            new THREE.MeshStandardMaterial({ map: createLabelTexture(3) }),
            new THREE.MeshStandardMaterial({ map: createLabelTexture(4) }),
            new THREE.MeshStandardMaterial({ map: createLabelTexture(5) })
        ];

        const sack = new THREE.Mesh(sackGeo, materialsBase);
        scene.add(sack);

        // --- UI Control Logic ---
        const checkbox = document.getElementById('showIndex');
        checkbox.addEventListener('change', (e) => {
            sack.material = e.target.checked ? materialsLabel : materialsBase;
        });

        // Floor Shadow
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.ShadowMaterial({ opacity: 0.15 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.2;
        floor.receiveShadow = true;
        scene.add(floor);

        function animate() {
            requestAnimationFrame(animate);
            // ปิดการหมุนอัตโนมัติ ให้ผู้ใช้หมุนเองด้วย OrbitControls
            // sack.rotation.y += 0.0012;
            // sack.rotation.z = Math.sin(Date.now() * 0.0004) * 0.03;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
