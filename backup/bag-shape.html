<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: https: http: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;">
    <title>Bag Shape — POLIMAXX (Single Bag, OOP)</title>
    <style>
        body { margin:0; background:#111216; color:#ddd; font-family:Arial, sans-serif; }
        .ui { position: absolute; left:12px; top:12px; z-index:10; background:rgba(0,0,0,0.6); padding:10px 12px; border-radius:8px; border-left:4px solid #f37021; }
        .ui h2 { margin:0 0 6px 0; font-size:14px; color:#f37021 }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div class="ui"><h2>Bag Shape — single instance (OOP)</h2><div>Displays one bag with top + side printed details and shadows.</div></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --------- Bag class (OOP) ---------
        class PolimaxxBag {
            constructor(opts = {}) {
                // match dimensions used in polimaxxV2 for visual parity (meters)
                this.width = opts.width ?? 0.925;   // X (462.5 mm)
                this.height = opts.height ?? 0.28; // Y (140 mm)
                this.length = opts.length ?? 0.5667; // Z (283.35 mm)
                this.segments = opts.segments ?? 24;

                // textures: top rotated so UV aligns with bag length like polimaxxV2
                this.topTexture = PolimaxxBag.makeTopTexture(-Math.PI / 2);
                // create side texture sized to the bag's physical aspect ratio to avoid UV stretching
                this.sideTexture = PolimaxxBag.makeSideTexture(this.length, this.height);
                this.bumpTexture = PolimaxxBag.makeFabricTexture();
                this.blankTexture = PolimaxxBag.makeBlankTexture();

                this.geometry = this._createGeometry();
                this.materials = this._createMaterials();
                this.mesh = new THREE.Mesh(this.geometry, this.materials);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
            }

            // create sculpted box geometry and UVs
            _createGeometry() {
                // Use the same sculpting and UV rules as the main scene for visual parity
                const segments = 24;
                const geo = new THREE.BoxGeometry(this.width, this.height, this.length, segments, segments, segments);
                const pos = geo.attributes.position;
                const v3 = new THREE.Vector3();
                // keep a copy of the original positions (before sculpting) so UVs can be computed
                // from the undeformed box coordinates to avoid UV distortion from sculpting
                const origPosArray = new Float32Array(pos.array);

                // sculpt: rounded bulge along length, subtle side/front convex
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);

                    const nx = v3.x / (this.width / 2);
                    const ny = v3.y / (this.height / 2);
                    const nz = v3.z / (this.length / 2);

                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.25);
                    v3.x *= (1 - endCurve * 0.08);

                    const sideConvex = 0.22 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;

                    const frontConvex = 0.12 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;

                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }

                // UV Mapping consistent with polimaxxV2 (Top/Bottom: X,Z; Sides: Z,Y)
                const uv = geo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const normalX = geo.attributes.normal.getX(i);
                    const normalY = geo.attributes.normal.getY(i);

                    // read original (pre-sculpt) coordinates from the saved array
                    const ox = origPosArray[i * 3 + 0];
                    const oy = origPosArray[i * 3 + 1];
                    const oz = origPosArray[i * 3 + 2];

                    if (Math.abs(normalY) > 0.5) {
                        // Top/Bottom: compute UV from original X/Z to avoid stretch from sculpt
                        if (normalY > 0) {
                            uv.setXY(i, (ox / this.width) + 0.5, 1.0 - ((oz / this.length) + 0.5));
                        } else {
                            uv.setXY(i, (ox / this.width) + 0.5, (oz / this.length) + 0.5);
                        }
                    } else if (Math.abs(normalX) > 0.5) {
                        // Sides: use original Z for U and the sculpted Y for V (height should reflect sculpt)
                        const u = (oz / this.length) + 0.5; // U follows length (from original geometry)
                        const v = 1.0 - ((v3.y / this.height) + 0.5); // V follows sculpted height

                        uv.setXY(i, u, v);
                    }
                }

                geo.computeVertexNormals();
                return geo;
            }

            _createMaterials() {
                // Align material parameters with polimaxxV2 for visual parity
                const right = new THREE.MeshStandardMaterial({ map: this.blankTexture, roughness: 0.6, metalness: 0.05, side: THREE.DoubleSide });

                // side (left) should show the inkjet artwork — keep it simple (no heavy bump)
                const left = new THREE.MeshStandardMaterial({ map: this.sideTexture, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide });

                // top/bottom: apply subtle fabric bump (small bumpScale) to show ribs without harsh edge artifacts
                const top = new THREE.MeshStandardMaterial({ map: this.topTexture, roughness: 0.45, metalness: 0.05, bumpMap: this.bumpTexture, bumpScale: 0.0008, side: THREE.DoubleSide });
                const bottom = new THREE.MeshStandardMaterial({ map: this.topTexture, roughness: 0.45, metalness: 0.05, bumpMap: this.bumpTexture, bumpScale: 0.0008, side: THREE.DoubleSide });

                const front = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });
                const back = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6, side: THREE.DoubleSide });

                // order: [Right, Left, Top, Bottom, Front, Back]
                return [right, left, top, bottom, front, back];
            }

            _addInteriorPellets() {
                const group = new THREE.Group();
                const pelletGeo = new THREE.SphereGeometry(0.006, 6, 6);
                const pelletMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.4, transparent:true, opacity:0.25 });
                for (let i = 0; i < 40; i++) {
                    const p = new THREE.Mesh(pelletGeo, pelletMat);
                    p.position.set((Math.random()-0.5)*0.45, (Math.random()-0.4)*0.16, (Math.random()-0.5)*0.9);
                    p.castShadow = false; p.receiveShadow = false;
                    group.add(p);
                }
                this.mesh.add(group);
            }

            getMesh() { return this.mesh; }

            // Static helpers for textures
            static makeTopTexture(rotation = 0) {
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                if (rotation !== 0) {
                    ctx.translate(centerX, centerY);
                    ctx.rotate(rotation);
                    ctx.translate(-centerX, -centerY);
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', centerX, 400);

                ctx.strokeStyle = '#f37021'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2); ctx.stroke();

                ctx.fillStyle = '#f37021'; ctx.font = 'bold 360px sans-serif'; ctx.fillText('PP', centerX, 840);

                ctx.fillStyle = '#0e3a66'; ctx.font = 'bold 150px sans-serif'; ctx.fillText('POLYETHYLENE', centerX, 1040);

                // decorative right circles
                ctx.strokeStyle = '#f37021'; ctx.lineWidth = 30;
                ctx.beginPath(); ctx.arc(1760, 400, 120, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 20; ctx.beginPath(); ctx.arc(1840, 640, 60, 0, Math.PI * 2); ctx.stroke();

                // red dots
                for (let i = 0; i < 4; i++) {
                    const x = 400 + (i * 170);
                    const y = 1360;
                    ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(x, y, 64, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#333'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, 64, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = '#ff6666'; ctx.beginPath(); ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2); ctx.fill();
                }

                ctx.textAlign = 'left'; ctx.fillStyle = '#111'; ctx.font = 'bold 120px sans-serif'; ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

                if (rotation !== 0) ctx.setTransform(1, 0, 0, 1, 0, 0);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 4; tex.needsUpdate = true; tex.encoding = THREE.sRGBEncoding;
                return tex;
            }

            static makeSideTexture(physLength = 0.5667, physHeight = 0.28) {
                // Create a canvas sized to the physical aspect ratio of the bag face so
                // pixels-per-meter are equal in U and V — this prevents apparent stretching
                const targetHeight = 512; // base pixel height
                const ratio = physLength / physHeight;
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(512, Math.round(targetHeight * ratio));
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');
                // white background
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                // scale factor relative to the previous 2048x512 reference layout
                const scale = canvas.width / 2048;
                const centerY = canvas.height / 2;

                // Left: batch / lot (large)
                ctx.fillStyle = '#000000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.font = Math.round(88 * scale) + 'px sans-serif';
                const leftX = Math.round(48 * scale);
                const batchText = '1126NK 0260204008';
                ctx.fillText(batchText, leftX, centerY);

                // Diamond/standard mark (icon) to the right of batch
                const iconX = leftX + ctx.measureText(batchText).width + Math.round(80 * scale);
                const iconY = centerY;
                ctx.lineWidth = Math.max(2, Math.round(8 * scale)); ctx.strokeStyle = '#000'; ctx.beginPath();
                ctx.moveTo(iconX, iconY - Math.round(36 * scale)); ctx.lineTo(iconX + Math.round(48 * scale), iconY);
                ctx.lineTo(iconX, iconY + Math.round(36 * scale)); ctx.lineTo(iconX - Math.round(48 * scale), iconY); ctx.closePath(); ctx.stroke();
                // cross inside
                ctx.beginPath(); ctx.moveTo(iconX, iconY - Math.round(36 * scale)); ctx.lineTo(iconX, iconY + Math.round(36 * scale)); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(iconX - Math.round(24 * scale), iconY); ctx.lineTo(iconX + Math.round(24 * scale), iconY); ctx.stroke();

                // TIS / PP lines — place just to right of icon, two lines stacked
                const specsX = iconX + Math.round(72 * scale);
                ctx.fillStyle = '#000'; ctx.font = Math.round(34 * scale) + 'px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('TIS.1306-2566', specsX, centerY - Math.round(18 * scale));
                ctx.fillText('PP-01-1-5-F', specsX, centerY + Math.round(22 * scale));

                // QR / blocks after specs
                const qrX = specsX + Math.round(280 * scale);
                const qrY = centerY - Math.round(48 * scale);
                ctx.fillStyle = '#000'; ctx.fillRect(qrX, qrY, Math.round(96 * scale), Math.round(96 * scale));
                ctx.fillStyle = '#fff'; ctx.fillRect(qrX + Math.round(18 * scale), qrY + Math.round(18 * scale), Math.round(18 * scale), Math.round(18 * scale)); ctx.fillRect(qrX + Math.round(54 * scale), qrY + Math.round(54 * scale), Math.round(18 * scale), Math.round(18 * scale));

                // PP HOMO and line code to the right of QR
                const ppX = qrX + Math.round(140 * scale);
                ctx.fillStyle = '#000'; ctx.font = Math.round(46 * scale) + 'px sans-serif'; ctx.fillText('PP HOMO', ppX, centerY - Math.round(12 * scale));
                ctx.font = Math.round(36 * scale) + 'px sans-serif'; ctx.fillText('B  06:28', ppX, centerY + Math.round(36 * scale));

                // (RoHS) at far right, italic style
                ctx.font = 'italic ' + Math.round(44 * scale) + 'px sans-serif'; ctx.fillText('(RoHS)', canvas.width - Math.round(120 * scale), centerY);

                const tex = new THREE.CanvasTexture(canvas);
                tex.needsUpdate = true; tex.encoding = THREE.sRGBEncoding; tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
                return tex;
            }

            // small repeating fabric bump texture (diagonal hatch)
            static makeFabricTexture() {
                const size = 512;
                const c = document.createElement('canvas'); c.width = size; c.height = size; const ctx = c.getContext('2d');
                ctx.fillStyle = '#bfbfbf'; ctx.fillRect(0,0,size,size);
                ctx.strokeStyle = '#d7d7d7'; ctx.lineWidth = 2;
                for (let i = -size; i < size*2; i += 8) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + size, size); ctx.stroke();
                }
                const tex = new THREE.CanvasTexture(c);
                tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
                tex.repeat.set(12, 24);
                tex.needsUpdate = true;
                return tex;
            }

            static makeBlankTexture(){ const c=document.createElement('canvas'); c.width=2048; c.height=512; const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height); const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t; }
        }

        // --------- Scene setup ---------
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111216);

        const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100); camera.position.set(1.6, 0.9, 2.6);
        const renderer = new THREE.WebGLRenderer({ antialias:true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0,0.12,0);

        // lights
        const hemi = new THREE.HemisphereLight(0xffffff, 0x111122, 0.7); scene.add(hemi);
        const dir = new THREE.DirectionalLight(0xfff7e6, 1.2); dir.position.set(2,3,1.5); dir.castShadow = true; dir.shadow.mapSize.set(2048,2048); dir.shadow.camera.near=0.1; dir.shadow.camera.far=10; dir.shadow.camera.left=-2; dir.shadow.camera.right=2; dir.shadow.camera.top=2; dir.shadow.camera.bottom=-2; scene.add(dir);

        // ground
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(10,10), new THREE.MeshStandardMaterial({ color:0x1e2228, roughness:0.95 })); ground.rotation.x = -Math.PI/2; ground.position.y = -0.25; ground.receiveShadow = true; scene.add(ground);

        const grid = new THREE.GridHelper(6, 12, 0x444b55, 0x15171a); grid.position.y = -0.249; scene.add(grid);

        // create a grouped pallet + bag so we can lift/rotate the unit if needed
        const extraGroup = new THREE.Group();
        // create bag and place at origin inside group (use polimaxxV2 dimensions)
        const bag = new PolimaxxBag();
        const bagMesh = bag.getMesh(); bagMesh.position.set(0, 0.12, 0); extraGroup.add(bagMesh);

        // Improve side texture sampling: enable anisotropic filtering and sensible filters
        try {
            const maxAniso = renderer.capabilities.getMaxAnisotropy();
            if (bag.sideTexture) {
                bag.sideTexture.anisotropy = Math.max(4, Math.min(16, maxAniso));
                bag.sideTexture.magFilter = THREE.LinearFilter;
                bag.sideTexture.minFilter = THREE.LinearMipMapLinearFilter;
                bag.sideTexture.encoding = THREE.sRGBEncoding;
                bag.sideTexture.needsUpdate = true;
            }
            if (bag.topTexture) {
                bag.topTexture.anisotropy = Math.max(4, Math.min(16, maxAniso));
                bag.topTexture.needsUpdate = true;
            }
        } catch (err) {}

        // small rim/pallet under bag for reference (part of the group)
        const palletRef = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.02, 0.9), new THREE.MeshStandardMaterial({ color:0x25323a, roughness:0.9 })); palletRef.position.set(0,0.01,0); palletRef.receiveShadow = true; extraGroup.add(palletRef);

        scene.add(extraGroup);

        // ensure the bag initially rests on the pallet (slight contact)
        (function placeBagOnPallet(){
            const palletHalf = (palletRef.geometry.parameters.height || 0.02) / 2;
            const palletTop = palletRef.position.y + palletHalf;
            const bagHalf = (bag.height || 0.28) / 2;
            const minAllowed = palletTop + bagHalf + 0.001; // 1mm clearance
            if (bagMesh.position.y < minAllowed) bagMesh.position.y = minAllowed;
        })();

        // preserve original materials so we can restore after top-only mode
        const originalMaterials = bag.materials.map(m=>m.clone());
        // build top-only materials (show Top and also show side artwork on Front)
        const topOnlyMaterials = originalMaterials.map((m,i)=>{
            if (i === 2) return originalMaterials[2];
            const mm = originalMaterials[i].clone();
            // show side artwork also on Front face (index 4)
            if (i === 4) {
                mm.map = bag.sideTexture;
                mm.bumpMap = null;
                mm.side = THREE.DoubleSide;
            } else {
                mm.map = bag.blankTexture;
                mm.bumpMap = null;
                mm.side = THREE.FrontSide;
            }
            return mm;
        });
        // default: top-only (checkbox off)
        bagMesh.material = topOnlyMaterials;
        let faceLabelSprites = []; // will contain meshes for indices
        // store initial states for reset
        const initialState = {
            cameraPos: camera.position.clone(),
            controlsTarget: controls.target.clone(),
            bagPos: bagMesh.position.clone(),
            bagRot: bagMesh.rotation.clone(),
            groupPos: extraGroup.position.clone(),
            facesVisible: false
        };

        // --- UI controls (Move + Rotate merged) ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        renderer.domElement.style.touchAction = 'none';
        window.addEventListener('pointermove', (ev) => { pointer.x = (ev.clientX / window.innerWidth) * 2 - 1; pointer.y = - (ev.clientY / window.innerHeight) * 2 + 1; }, { passive:true });
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = Math.exp(e.deltaY * 0.0015);
            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            const point = new THREE.Vector3();
            if (intersects.length > 0) point.copy(intersects[0].point); else raycaster.ray.at(10, point);
            const camToPoint = new THREE.Vector3().subVectors(camera.position, point).multiplyScalar(zoomFactor);
            camera.position.copy(point).add(camToPoint);
            const tgtToPoint = new THREE.Vector3().subVectors(controls.target, point).multiplyScalar(zoomFactor);
            controls.target.copy(point).add(tgtToPoint);
            controls.update();
        }, { passive:false });

        // --- Camera walk-in (pull) behavior: drag to walk camera toward the clicked bag ---
        let isPulling = false;
        let pullStartY = 0;
        let initialDistance = 0;
        let initialHitPoint = new THREE.Vector3();
        const minDistance = 0.35; // don't get closer than this to hit point
        const maxDistance = 10;
        const pullSensitivity = 0.007; // pixels -> meters

        // clamp camera above ground to prevent tunneling under floor
        const groundY = -0.25; // matches ground.position.y
        const minCameraY = groundY + 0.05;

        function getNDCPointer(e) { return { x: (e.clientX / window.innerWidth) * 2 - 1, y: - (e.clientY / window.innerHeight) * 2 + 1 }; }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            const ndc = getNDCPointer(e); pointer.x = ndc.x; pointer.y = ndc.y;
            raycaster.setFromCamera(pointer, camera);

            // only start pull if pointer hits the bag mesh
            const hits = raycaster.intersectObject(bagMesh, true);
            if (hits.length === 0) return;

            isPulling = true;
            pullStartY = e.clientY;
            initialHitPoint.copy(hits[0].point);
            initialDistance = camera.position.distanceTo(initialHitPoint);
            controls.enabled = false;
            try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
        }, { passive: false });

        renderer.domElement.addEventListener('pointermove', (e) => {
            const ndc = getNDCPointer(e); pointer.x = ndc.x; pointer.y = ndc.y;
            if (!isPulling) return;

            // vertical drag changes distance to the hit point
            const dy = e.clientY - pullStartY;
            const newDist = THREE.MathUtils.clamp(initialDistance + dy * pullSensitivity, minDistance, maxDistance);

            // compute camera position along the ray from the hit point back toward the camera
            const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
            const desiredCamPos = new THREE.Vector3().copy(initialHitPoint).add(camDir.clone().multiplyScalar(-newDist));

            // clamp camera Y to stay above ground
            if (desiredCamPos.y < minCameraY) desiredCamPos.y = minCameraY;

            camera.position.copy(desiredCamPos);
            controls.target.copy(initialHitPoint);
            controls.update();
        }, { passive: false });

        window.addEventListener('pointerup', (e) => {
            if (!isPulling) return;
            isPulling = false;
            controls.enabled = true;
            try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) {}
        });


        // build control panel (left) — Move + Y-mode + Rotate
        const moveCtrl = document.createElement('div');
        moveCtrl.style.position = 'absolute'; moveCtrl.style.top = '120px'; moveCtrl.style.left = '12px'; moveCtrl.style.background = 'rgba(0,0,0,0.6)'; moveCtrl.style.color = '#fff'; moveCtrl.style.padding = '10px'; moveCtrl.style.borderRadius = '8px'; moveCtrl.style.fontFamily = 'sans-serif'; moveCtrl.style.zIndex = 999;
        moveCtrl.innerHTML = '<strong>Bag Controls</strong><br/>';

        // X slider
        const xLabel = document.createElement('div'); xLabel.style.marginTop='6px'; xLabel.textContent = 'X: 0.00';
        const xSlider = document.createElement('input'); xSlider.type='range'; xSlider.min=-2; xSlider.max=2; xSlider.step=0.01; xSlider.value=0; xSlider.style.width='220px';
        xSlider.addEventListener('input', ()=>{ const v=parseFloat(xSlider.value); bagMesh.position.x = v; xLabel.textContent = 'X: ' + v.toFixed(2); });
        moveCtrl.appendChild(xLabel); moveCtrl.appendChild(xSlider);

        // Z slider
        const zLabel = document.createElement('div'); zLabel.style.marginTop='8px'; zLabel.textContent='Z: 0.00';
        const zSlider = document.createElement('input'); zSlider.type='range'; zSlider.min=-2; zSlider.max=2; zSlider.step=0.01; zSlider.value=0; zSlider.style.width='220px';
        zSlider.addEventListener('input', ()=>{ const v=parseFloat(zSlider.value); bagMesh.position.z = v; zLabel.textContent = 'Z: ' + v.toFixed(2); });
        moveCtrl.appendChild(zLabel); moveCtrl.appendChild(zSlider);

        // Y mode toggle (bag-only vs whole group)
        const yModeWrap = document.createElement('div'); yModeWrap.style.marginTop='8px';
        const yModeChk = document.createElement('input'); yModeChk.type='checkbox'; yModeChk.id='chk_y_whole'; yModeChk.style.marginRight='6px';
        const yModeLbl = document.createElement('label'); yModeLbl.htmlFor='chk_y_whole'; yModeLbl.textContent='Lift whole pile'; yModeLbl.style.userSelect='none';
        yModeWrap.appendChild(yModeChk); yModeWrap.appendChild(yModeLbl); moveCtrl.appendChild(yModeWrap);

        // Y slider
        const yLabel = document.createElement('div'); yLabel.style.marginTop='8px'; yLabel.textContent='Y: 0.12';
        const ySlider = document.createElement('input'); ySlider.type='range'; ySlider.min=-1; ySlider.max=4; ySlider.step=0.01; ySlider.value=bagMesh.position.y; ySlider.style.width='220px';
        ySlider.addEventListener('input', ()=>{
            const v = parseFloat(ySlider.value);
            const epsilon = 0.001;
            if (yModeChk.checked) {
                // clamp whole group's Y so pallet bottom doesn't go below ground
                const palletHalf = (palletRef.geometry.parameters.height || 0.02) / 2;
                const palletLocalBottom = palletRef.position.y - palletHalf;
                const minGroupY = (groundY + epsilon) - palletLocalBottom;
                const clamped = Math.max(v, minGroupY);
                extraGroup.position.y = clamped;
                if (clamped !== v) ySlider.value = clamped;
            } else {
                // prevent bag penetrating the pallet: compute minimal allowed Y (bag local)
                const palletHalf = (palletRef.geometry.parameters.height || 0.02) / 2;
                const palletTop = palletRef.position.y + palletHalf;
                const bagHalf = (bag.height || 0.28) / 2;
                const minAllowed = palletTop + bagHalf + epsilon;
                const clamped = Math.max(v, minAllowed);
                bagMesh.position.y = clamped;
                if (clamped !== v) ySlider.value = clamped;
            }
            yLabel.textContent = 'Y: ' + parseFloat(ySlider.value).toFixed(2);
        });
        moveCtrl.appendChild(yLabel); moveCtrl.appendChild(ySlider);

        // Rotation header
        const rotHeader = document.createElement('div'); rotHeader.style.marginTop='12px'; rotHeader.style.fontWeight='bold'; rotHeader.textContent='Rotate bag'; moveCtrl.appendChild(rotHeader);

        // Y rotation
        const rLabel = document.createElement('div'); rLabel.style.marginTop='6px'; rLabel.textContent='Y: 0°';
        const rSlider = document.createElement('input'); rSlider.type='range'; rSlider.min=-180; rSlider.max=180; rSlider.step=1; rSlider.value=0; rSlider.style.width='220px';
        rSlider.addEventListener('input', ()=>{
            let deg = parseFloat(rSlider.value);
            if (stepChk && stepChk.checked) { deg = Math.round(deg / 90) * 90; rSlider.value = deg; }
            rLabel.textContent = 'Y: ' + deg.toFixed(0) + '°';
            bagMesh.rotation.y = deg * Math.PI/180;
        });
        moveCtrl.appendChild(rLabel); moveCtrl.appendChild(rSlider);

        // X rotation
        const xRotLabel = document.createElement('div'); xRotLabel.style.marginTop='8px'; xRotLabel.textContent='X: 0°';
        const xRotSlider = document.createElement('input'); xRotSlider.type='range'; xRotSlider.min=-180; xRotSlider.max=180; xRotSlider.step=1; xRotSlider.value=0; xRotSlider.style.width='220px';
        xRotSlider.addEventListener('input', ()=>{
            let deg = parseFloat(xRotSlider.value);
            if (stepChk && stepChk.checked) { deg = Math.round(deg / 90) * 90; xRotSlider.value = deg; }
            xRotLabel.textContent = 'X: ' + deg.toFixed(0) + '°';
            bagMesh.rotation.x = deg * Math.PI/180;
        });
        moveCtrl.appendChild(xRotLabel); moveCtrl.appendChild(xRotSlider);

        // --- Extra UI: face index labels + show-all-faces toggle ---
        const extrasWrap = document.createElement('div'); extrasWrap.style.marginTop='12px';

        // face index labels checkbox
        const idxChk = document.createElement('input'); idxChk.type='checkbox'; idxChk.id='chk_face_idx'; idxChk.style.marginRight='6px';
        const idxLbl = document.createElement('label'); idxLbl.htmlFor='chk_face_idx'; idxLbl.textContent='Show face indices'; idxLbl.style.userSelect='none';
        extrasWrap.appendChild(idxChk); extrasWrap.appendChild(idxLbl);

        // show-all-faces (default OFF = top-only)
        const facesChk = document.createElement('input'); facesChk.type='checkbox'; facesChk.id='chk_show_all'; facesChk.style.marginLeft='12px'; facesChk.style.marginRight='6px';
        const facesLbl = document.createElement('label'); facesLbl.htmlFor='chk_show_all'; facesLbl.textContent='Show all faces (default: top only)'; facesLbl.style.userSelect='none';
        extrasWrap.appendChild(facesChk); extrasWrap.appendChild(facesLbl);

        moveCtrl.appendChild(extrasWrap);

        // Reset button
        const resetBtn = document.createElement('button'); resetBtn.textContent = 'Reset view'; resetBtn.style.display='block'; resetBtn.style.marginTop='10px'; resetBtn.style.width='100%'; resetBtn.style.padding='10px 14px'; resetBtn.style.fontSize='15px'; resetBtn.style.fontWeight='600'; resetBtn.style.borderRadius='8px'; resetBtn.style.cursor='pointer';
        resetBtn.addEventListener('click', resetAll);
        moveCtrl.appendChild(resetBtn);

        // append panel
        document.body.appendChild(moveCtrl);

        // sync toggle changes
        yModeChk.addEventListener('change', ()=>{
            if (yModeChk.checked) {
                // clamp and sync slider to group position (respecting ground)
                const palletHalf = (palletRef.geometry.parameters.height || 0.02) / 2;
                const palletLocalBottom = palletRef.position.y - palletHalf;
                const minGroupY = (groundY + 0.001) - palletLocalBottom;
                const cur = Math.max(extraGroup.position.y, minGroupY);
                extraGroup.position.y = cur;
                ySlider.value = cur;
                yLabel.textContent = 'Y: '+parseFloat(ySlider.value).toFixed(2);
            } else {
                // sync to bag local Y
                const cur = bagMesh.position.y;
                ySlider.value = cur;
                yLabel.textContent = 'Y: '+parseFloat(ySlider.value).toFixed(2);
            }
        });

        // render loop
        function onResize(){ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
        addEventListener('resize', onResize);

        // --- Face index labels and material toggle handlers ---
        function makeLabelTexture(n, name) {
            const c = document.createElement('canvas'); c.width = 256; c.height = 128; const ctx = c.getContext('2d');
            // full gray background (no transparency)
            ctx.fillStyle = '#dcdcdc'; ctx.fillRect(0,0,c.width,c.height);
            // inset darker rect to give subtle border
            ctx.fillStyle = '#e8e8e8'; ctx.fillRect(8,8,c.width-16,c.height-16);
            // text
            ctx.fillStyle = '#111'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(n + '/' + name, c.width/2, c.height/2);
            const t = new THREE.CanvasTexture(c); t.needsUpdate = true; t.encoding = THREE.sRGBEncoding; return t;
        }

        function createFaceLabels() {
            const labels = [];
            const names = ['right','left','top','bottom','front','back'];
            const offs = 0.006; // small offset to avoid z-fighting (meters)
            for (let i = 0; i < 6; i++) {
                const map = makeLabelTexture(i, names[i]);
                const mat = new THREE.MeshBasicMaterial({ map: map, transparent: false, side: THREE.DoubleSide });
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.1), mat);
                // render on top to avoid being occluded by bag geometry
                plane.renderOrder = 999;
                plane.material.depthTest = false;
                plane.material.depthWrite = false;
                // position and orientation per face (plane default normal +Z)
                switch(i) {
                    case 0: // Right (+X)
                        plane.position.set((bag.width/2) + offs, 0, 0);
                        plane.rotation.set(0, -Math.PI/2, 0);
                        break;
                    case 1: // Left (-X)
                        plane.position.set(-(bag.width/2) - offs, 0, 0);
                        plane.rotation.set(0, Math.PI/2, 0);
                        break;
                    case 2: // Top (+Y)
                        plane.position.set(0, (bag.height/2) + offs, 0);
                        plane.rotation.set(-Math.PI/2, 0, 0);
                        break;
                    case 3: // Bottom (-Y)
                        plane.position.set(0, -(bag.height/2) - offs, 0);
                        plane.rotation.set(Math.PI/2, 0, 0);
                        break;
                    case 4: // Front (+Z)
                        plane.position.set(0, 0, (bag.length/2) + offs);
                        plane.rotation.set(0, 0, 0);
                        break;
                    case 5: // Back (-Z)
                        plane.position.set(0, 0, -(bag.length/2) - offs);
                        plane.rotation.set(0, Math.PI, 0);
                        break;
                }
                plane.visible = false;
                bagMesh.add(plane);
                labels.push(plane);
            }
            return labels;
        }

        // create labels (hidden by default)
        faceLabelSprites = createFaceLabels();

        // add step-rotation checkbox (default ON)
        const stepChk = document.createElement('input'); stepChk.type='checkbox'; stepChk.id='chk_step_rot'; stepChk.checked = true; stepChk.style.marginLeft='12px'; stepChk.style.marginRight='6px';
        const stepLbl = document.createElement('label'); stepLbl.htmlFor='chk_step_rot'; stepLbl.textContent='Step rotation (90°)'; stepLbl.style.userSelect='none';
        extrasWrap.appendChild(stepChk); extrasWrap.appendChild(stepLbl);

        // idx checkbox behavior
        idxChk.addEventListener('change', ()=>{
            faceLabelSprites.forEach(s=>s.visible = idxChk.checked);
        });

        facesChk.addEventListener('change', ()=>{
            if (facesChk.checked) {
                bagMesh.material = originalMaterials.map(m=>m.clone());
            } else {
                bagMesh.material = topOnlyMaterials.map(m=>m.clone());
            }
        });

        // Reset function restores initial camera/group/bag state and UI
        function resetAll() {
            // restore camera & controls
            camera.position.copy(initialState.cameraPos);
            controls.target.copy(initialState.controlsTarget);
            controls.update();

            // restore transforms
            bagMesh.position.copy(initialState.bagPos);
            bagMesh.rotation.copy(initialState.bagRot);
            extraGroup.position.copy(initialState.groupPos);

            // restore materials and toggles
            facesChk.checked = false; facesChk.dispatchEvent(new Event('change'));
            idxChk.checked = false; idxChk.dispatchEvent(new Event('change'));
            stepChk.checked = true;

            // reset sliders and labels
            ySlider.value = bagMesh.position.y; yLabel.textContent = 'Y: '+parseFloat(ySlider.value).toFixed(2);
            rSlider.value = (bagMesh.rotation.y * 180/Math.PI); rLabel.textContent = 'Y: '+parseFloat(rSlider.value).toFixed(0)+'°';
            xRotSlider.value = (bagMesh.rotation.x * 180/Math.PI); xRotLabel.textContent = 'X: '+parseFloat(xRotSlider.value).toFixed(0)+'°';
        }

        const clock = new THREE.Clock();
        function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();

        // --- Mobile/Tablet quick help (show only on touch devices) ---
        try {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);
            if (isTouch) {
                const helpBar = document.createElement('div');
                helpBar.style.position = 'fixed'; helpBar.style.left = '12px'; helpBar.style.right = '12px'; helpBar.style.bottom = '12px'; helpBar.style.zIndex = 2000;
                helpBar.style.background = 'rgba(0,0,0,0.6)'; helpBar.style.color = '#fff'; helpBar.style.padding = '10px 12px'; helpBar.style.borderRadius = '8px'; helpBar.style.fontSize = '13px'; helpBar.style.fontFamily = 'sans-serif';
                helpBar.innerHTML = '<strong>Touch controls</strong> — 1: แตะค้างที่ถุงแล้วลากขึ้น/ลง → ดึงกล้องเข้า/ออก (walk-in). 2: ใช้สองนิ้ว (pinch) เพื่อซูม หรือสองนิ้วลากเพื่อหมุน/แพน';
                document.body.appendChild(helpBar);
            }
        } catch (err) {}

    </script>
</body>
</html>
