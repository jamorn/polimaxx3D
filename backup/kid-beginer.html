<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rendering Comparison (Correct vs Default)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        .label { position: absolute; padding: 10px; background: rgba(0,0,0,0.7); border-radius: 5px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="container" class="relative w-screen h-screen">
        <!-- Labels -->
        <div class="label top-5 left-5">
            <h2 class="font-bold text-red-400">การแสดงผลแบบค่าเริ่มต้น (มักจะดูแบน/สีเพี้ยน)</h2>
            <p class="text-xs text-gray-300">Default Lighting, No Gamma Correction</p>
        </div>
        <div class="label top-5 right-5 text-right">
            <h2 class="font-bold text-green-400">การแสดงผลที่ปรับจูนแล้ว (สมจริง/สีตรง)</h2>
            <p class="text-xs text-gray-300">PBR, sRGB, Tone Mapping, Shadows</p>
        </div>

        <div id="canvas-container" class="w-full h-full"></div>
        
        <!-- Controls Overlay -->
        <div class="absolute bottom-10 left-1/2 -translate-x-1/2 bg-black/80 p-6 rounded-xl border border-white/20 backdrop-blur-md max-w-md text-center">
            <p class="mb-4 text-sm">ลองใช้เมาส์คลิกค้างแล้วลากเพื่อหมุนมุมกล้อง</p>
            <div class="flex gap-4 justify-center">
                <button id="toggle-light" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-sm transition">สลับโหมดแสง</button>
                <button id="reset-cam" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">รีเซ็ตกล้อง</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, cube1, cube2, floor;
        let isEnhanced = true;

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);

            // 3. Renderer Setup (หัวใจสำคัญของการแสดงผล)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // การตั้งค่าที่ทำให้ภาพ "เหมือนต้นฉบับ"
            renderer.outputEncoding = THREE.sRGBEncoding; // จัดการ Color Space
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // ปรับช่วงแสงให้สมจริง
            renderer.shadowMap.enabled = true; // เปิดใช้งานเงา
            
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. Geometry & Materials
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const sphereGeo = new THREE.SphereGeometry(0.7, 32, 32);
            
            // ฝั่งซ้าย: วัสดุแบบพื้นฐาน (Basic Material - ไม่รับแสง)
            const matBasic = new THREE.MeshPhongMaterial({ color: 0xff4444 });
            cube1 = new THREE.Mesh(geometry, matBasic);
            cube1.position.x = -2;
            cube1.castShadow = true;
            scene.add(cube1);

            // ฝั่งขวา: วัสดุแบบ PBR (Standard Material - สมจริง)
            const matPBR = new THREE.MeshStandardMaterial({ 
                color: 0x44ff44,
                metalness: 0.7,
                roughness: 0.2
            });
            cube2 = new THREE.Mesh(sphereGeo, matPBR);
            cube2.position.x = 2;
            cube2.castShadow = true;
            scene.add(cube2);

            // พื้น (Floor)
            const floorGeo = new THREE.PlaneGeometry(10, 10);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1;
            floor.receiveShadow = true;
            scene.add(floor);

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            // ตั้งค่าความละเอียดเงา
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            scene.add(directionalLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Rotation animation
            cube1.rotation.y += 0.01;
            cube1.rotation.x += 0.005;
            cube2.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }

        // Interactivity
        let isMouseDown = false;
        let mouseX = 0;
        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                camera.position.x = Math.sin(e.clientX * 0.005) * 5;
                camera.position.z = Math.cos(e.clientX * 0.005) * 5;
                camera.lookAt(0, 0, 0);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.getElementById('toggle-light').onclick = () => {
            isEnhanced = !isEnhanced;
            if (isEnhanced) {
                renderer.outputEncoding = THREE.sRGBEncoding;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                scene.background = new THREE.Color(0x111111);
            } else {
                renderer.outputEncoding = THREE.LinearEncoding;
                renderer.toneMapping = THREE.NoToneMapping;
                scene.background = new THREE.Color(0x000000);
            }
            // Force update
            cube1.material.needsUpdate = true;
            cube2.material.needsUpdate = true;
        };

        document.getElementById('reset-cam').onclick = () => {
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
        };

        window.onload = init;
    </script>
</body>
</html>
