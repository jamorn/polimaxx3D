<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLIMAXX Container - 3 Sizes with POLIMAXX Bags</title>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .controls { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; border: 1px solid #ff007f; display: flex; flex-direction: column; gap: 10px; z-index: 10; max-height: calc(100vh - 40px); overflow-y: auto; width: 280px; }
        
        /* Custom scrollbar styling for controls panel */
        .controls::-webkit-scrollbar {
            width: 8px;
        }
        
        .controls::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        
        .controls::-webkit-scrollbar-thumb {
            background: #ff007f;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .controls::-webkit-scrollbar-thumb:hover {
            background: #ff4da6;

        /* Firefox scrollbar */

        .slider-group .value { color: #ff007f; font-size: 0.7rem; text-align: right; }

        <div style="display:flex;align-items:center;gap:6px;">

    <div class="label-container">
        <div class="label"><b>20ft</b><br>6.06m | กระเป๋า POLIMAXX (ลดรายละเอียดเพื่อประสิทธิภาพ)</div>
        <div class="label"><b>40ft</b><br>12.19m | กระเป๋า POLIMAXX (ลดรายละเอียดเพื่อประสิทธิภาพ)</div> 
        <div class="label"><b>40ft HC</b><br>12.19m x 2.89m | กระเป๋า POLIMAXX (ลดรายละเอียดเพื่อประสิทธิภาพ)</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // TextureFactory สำหรับสร้าง texture (อัพเดทจาก index.html)
        class TextureFactory {
            static createTopTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 2048;
                const ctx = canvas.getContext('2d');
                
                // White background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                ctx.textAlign = 'center';

                // Main POLIMAXX text
                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 220px sans-serif';
                ctx.fillText('POLIMAXX', centerX, 400);

                // Orange circle accent
                ctx.strokeStyle = '#f37021';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(centerX - 416, 336, 30, 0, Math.PI * 2);
                ctx.stroke();

                // Large PP text
                ctx.fillStyle = '#f37021';
                ctx.font = 'bold 360px sans-serif';
                ctx.fillText('PP', centerX, 840);

                // Polyethylene text
                ctx.fillStyle = '#0e3a66';
                ctx.font = 'bold 150px sans-serif';
                ctx.fillText('POLYETHYLENE', centerX, 1040);

                // Side decorative circles
                ctx.strokeStyle = '#f37021';
                ctx.lineWidth = 30;
                ctx.beginPath();
                ctx.arc(1760, 400, 120, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.lineWidth = 20;
                ctx.beginPath();
                ctx.arc(1840, 640, 60, 0, Math.PI * 2);
                ctx.stroke();

                // Bottom indicators (red circles)
                for (let i = 0; i < 4; i++) {
                    const x = 400 + i * 170;
                    const y = 1360;
                    
                    // Main red circle
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Black outline
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(x, y, 64, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Highlight
                    ctx.fillStyle = '#ff6666';
                    ctx.beginPath();
                    ctx.arc(x - 10, y - 10, 16, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Weight text
                ctx.textAlign = 'left';
                ctx.fillStyle = '#111';
                ctx.font = 'bold 120px sans-serif';
                ctx.fillText('NET WEIGHT 25 KG', 360, 1760);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 16;
                tex.center.set(0.5, 0.5);
                tex.rotation = Math.PI;
                tex.needsUpdate = true;
                return tex;
            }

            static createFrontTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 2048;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // White background
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Product code - centered and clean
                ctx.fillStyle = '#000000';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = 'bold 120px sans-serif';
                ctx.fillText('1126NK 0260204008', canvas.width / 2, canvas.height / 2);

                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 16;
                tex.center.set(0.5, 0.5);
                tex.rotation = Math.PI / 2; // หมุน 90 องศา เพื่อให้ข้อความไม่กลับหัว
                tex.needsUpdate = true;
                return tex;
            }

            static createBlankTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                return texture;
            }
        }

        // POLIMAXBag class สำหรับสร้างกระเป๋า
        class POLIMAXBag {
            // ขนาดกระเป๋าหลัง scale 0.527
            static BAG_WIDTH = 0.487;   // 0.925 × 0.527
            static BAG_HEIGHT = 0.148;  // 0.28 × 0.527
            static BAG_LENGTH = 0.299;  // 0.5667 × 0.527

            constructor() {
                this.geometry = this.createGeometry();
                this.textures = this.createTextures();
                this.materials = this.createMaterials();
            }

            createGeometry() {
                // ใช้ segments น้อย เพื่อให้มีรูปร่าง bulging แต่มีลายตาข่าย mesh
                const segments = 2;  // กลับไปใช้ 2 segments เพื่อให้เห็นตาข่าย
                const geo = new THREE.BoxGeometry(
                    POLIMAXBag.BAG_WIDTH,
                    POLIMAXBag.BAG_HEIGHT,
                    POLIMAXBag.BAG_LENGTH,
                    segments, segments, segments
                );
                
                const pos = geo.attributes.position;
                const v3 = new THREE.Vector3();

                // Deform geometry เพื่อรูปร่าง bulging ของถุง
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    const nx = v3.x / (POLIMAXBag.BAG_WIDTH / 2);
                    const ny = v3.y / (POLIMAXBag.BAG_HEIGHT / 2);
                    const nz = v3.z / (POLIMAXBag.BAG_LENGTH / 2);
                    
                    // Slight bulging เหมือนถุงจริง
                    const endCurve = Math.pow(Math.abs(nz), 2.2);
                    v3.y *= (1 - endCurve * 0.15);
                    v3.x *= (1 - endCurve * 0.05);
                    
                    const sideConvex = 0.1 * (1 - nz * nz * 0.2) * (1 - ny * ny * 0.3);
                    v3.x += (v3.x > 0 ? 1 : -1) * sideConvex;
                    
                    const frontConvex = 0.05 * (1 - nx * nx * 0.3) * (1 - ny * ny * 0.3);
                    v3.z += (v3.z > 0 ? 1 : -1) * frontConvex;
                    
                    pos.setXYZ(i, v3.x, v3.y, v3.z);
                }

                geo.computeVertexNormals();
                return geo;
            }

            createTextures() {
                return {
                    top: TextureFactory.createTopTexture(),
                    front: TextureFactory.createFrontTexture(),
                    blank: TextureFactory.createBlankTexture()
                };
            }

            createMaterials() {
                return [
                    // Right face - ผิวเรียบมันวาว เหมือน film packaging
                    new THREE.MeshStandardMaterial({ 
                        color: 0xffffff, 
                        roughness: 0.1,   // มันวาวเหมือน film
                        metalness: 0.05,  // เพิ่ม metalness เล็กน้อยเพื่อความมัน
                        transparent: true,
                        opacity: 0.95,    // โปร่งแสงเล็กน้อยเหมือน film
                        side: THREE.DoubleSide 
                    }),
                    // Left face  
                    new THREE.MeshStandardMaterial({ 
                        color: 0xffffff, 
                        roughness: 0.1, 
                        metalness: 0.05,
                        transparent: true,
                        opacity: 0.95,
                        side: THREE.DoubleSide 
                    }),
                    // Top face - คง artwork เดิมไว้ แต่ทำให้มันวาว
                    new THREE.MeshStandardMaterial({ 
                        map: this.textures.top, 
                        roughness: 0.2,   // มันวาวมากขึ้น
                        metalness: 0.1,   // เพิ่ม metalness
                        transparent: true,
                        opacity: 0.98,
                        side: THREE.DoubleSide 
                    }),
                    // Bottom face
                    new THREE.MeshStandardMaterial({ 
                        map: this.textures.blank, 
                        color: 0xffffff, 
                        roughness: 0.1,   // มันวาว
                        metalness: 0.05,
                        transparent: true,
                        opacity: 0.95,
                        side: THREE.FrontSide
                    }),
                    // Front face - เปลี่ยนเป็น blank texture
                    new THREE.MeshStandardMaterial({ 
                        color: 0xffffff, 
                        roughness: 0.1,   // มันวาว
                        metalness: 0.05,
                        transparent: true,
                        opacity: 0.95,
                        side: THREE.DoubleSide 
                    }),
                    // Back face - ย้าย front texture กลับมาที่นี่
                    new THREE.MeshStandardMaterial({ 
                        map: this.textures.front, 
                        roughness: 0.2,   // มันวาวมากขึ้น
                        metalness: 0.1,   // เพิ่ม metalness
                        transparent: true,
                        opacity: 0.98,
                        side: THREE.DoubleSide 
                    })
                ];
            }

            createInstance(posX, posY, posZ, rotationY = 0) {
                const clonedMats = this.materials.map(mat => mat.clone());
                const mesh = new THREE.Mesh(this.geometry, clonedMats);
                
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.position.set(posX, posY, posZ);
                mesh.rotation.y = rotationY;
                
                return mesh;
            }
        }

        class OneContainer {
            constructor(options = {}) {
                this.index = options.index || 0;
                this.width = 2.44; // มาตรฐาน
                this.height = options.height || 2.59;
                this.depth = options.length || 6.06;
                this.isHighCube = options.isHighCube || false;
                this.color = 0xce117b;
                this.group = new THREE.Group();
                
                // ค่า spacing multiplier เริ่มต้น
                this.spacingMultiplierX = 1.15;
                this.spacingMultiplierY = 1.1; 
                this.spacingMultiplierZ = 1.2;
                
                // จำนวนถุงเริ่มต้น (5 ถุง)
                this.bagsCount = 5;
                
                this.walls = [];
                // Create POLIMAXBag instance
                this.bagClass = new POLIMAXBag();
                this.cargo = [];
                this.frameElements = [];
                
                this._init();
            }

            _createDoorTextures() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                // keep a tall canvas matching the door aspect; increase width for layout room
                canvas.width = 1400;
                canvas.height = 2048;
                
                // Background color
                ctx.fillStyle = '#ce117b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // ขาว
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 15;
                
                // ONE logo: place more centrally on the left panel area
                ctx.font = 'bold 380px Arial Black';
                ctx.fillStyle = '#ffffff';
                const oneX = Math.round(canvas.width * 0.08);
                const oneY = 480;
                ctx.fillText('ONE', oneX, oneY);
                
                // OCEAN NETWORK EXPRESS (under ONE)
                ctx.font = 'bold 64px Arial';
                ctx.fillText('OCEAN NETWORK EXPRESS', oneX, oneY + 140);
                
                // Right-side info block (CSC plate + weights) placed on the right panel
                const infoX = Math.round(canvas.width * 0.56);
                let infoY = 760;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.strokeRect(infoX, infoY - 20, 420, 520);

                ctx.font = 'bold 46px Arial';
                ctx.fillText('CSC SAFETY', infoX + 24, infoY + 30);
                ctx.fillText('APPROVAL', infoX + 24, infoY + 86);

                ctx.font = 'bold 48px Arial';
                ctx.fillText(this.isHighCube ? '45G1' : '42G1', infoX + 24, infoY + 150);
                ctx.font = 'bold 40px Arial';
                ctx.fillText('035041 2', infoX + 24, infoY + 200);
                ctx.fillText('4509', infoX + 24, infoY + 250);

                // weights block
                ctx.font = 'bold 34px Arial';
                let wy = infoY + 320;
                ctx.fillText('MAX.GROSS', infoX + 24, wy);
                ctx.fillText(this.isHighCube ? '32.500KGS' : '30.480KGS', infoX + 220, wy);
                wy += 46;
                ctx.fillText('TARE', infoX + 24, wy);
                ctx.fillText(this.depth > 10 ? '3.820KG' : '2.230KG', infoX + 220, wy);
                wy += 46;
                ctx.fillText('NET', infoX + 24, wy);
                ctx.fillText(this.isHighCube ? '28.680KGS' : '28.250KGS', infoX + 220, wy);

                // CU.CAP
                ctx.fillText('CU.CAP', infoX + 24, wy + 56);
                ctx.fillText(this.depth > 10 ? '67.5CU.M' : '33.2CU.M', infoX + 220, wy + 56);
                
                // CAUTION block: move to lower-left area and scale down for readability
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 110px Arial Black';
                ctx.fillText('CAUTION', oneX, 1420);
                ctx.font = 'bold 120px Arial Black';
                ctx.fillText(this.isHighCube ? '108"' : '96"', oneX, 1560);
                ctx.font = 'bold 90px Arial Black';
                ctx.fillText('HIGH CONTAINER', oneX, 1700);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            _createSideTexture() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 2048;
                canvas.height = 1024;
                
                ctx.fillStyle = '#ce117b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // ลายลูกฟูก
                ctx.strokeStyle = '#a00e63';
                ctx.lineWidth = 20;
                for(let i = 100; i < canvas.height; i += 100) {
                    ctx.beginPath();
                    ctx.moveTo(0, i);
                    ctx.lineTo(canvas.width, i);
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 400px Arial Black';
                ctx.fillText('ONE', 200, 550);
                
                ctx.font = 'bold 70px Arial';
                ctx.fillText('OCEAN NETWORK EXPRESS', 200, 700);
                
                ctx.font = 'bold 60px Arial';
                ctx.fillText('ONEU 035041 2', 1400, 300);
                ctx.fillText(this.isHighCube ? '45G1' : '42G1', 1400, 400);
                
                ctx.font = 'bold 35px Arial';
                ctx.fillText(`MAX.GROSS ${this.isHighCube ? '32.500KGS' : '30.480KGS'} ${this.isHighCube ? '71.650LBS' : '67.200LBS'}`, 200, 850);
                ctx.fillText(`TARE ${this.depth > 10 ? '3.820KG' : '2.230KG'} ${this.depth > 10 ? '8.420LB' : '4.920LB'}`, 200, 900);
                ctx.fillText(`NET ${this.isHighCube ? '28.680KGS' : '28.250KGS'} ${this.isHighCube ? '63.230LBS' : '62.280LBS'}`, 200, 950);
                
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 40px Arial';
                ctx.fillText('COR-TEN STEEL', 1400, 600);
                ctx.fillText('CONTAINER', 1400, 660);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            _createFrontTexture() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 1024;
                
                ctx.fillStyle = '#ce117b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 150px Arial Black';
                ctx.fillText('ONE', 100, 400);
                
                ctx.font = 'bold 40px Arial';
                ctx.fillText('OCEAN NETWORK EXPRESS', 100, 500);
                
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 60px Arial Black';
                ctx.fillText('CAUTION', 100, 700);
                ctx.fillText(this.isHighCube ? '108" HIGH' : '96" HIGH', 100, 800);
                ctx.fillText('CONTAINER', 100, 900);
                
                const texture = new THREE.CanvasTexture(canvas);
                return texture;
            }

            _buildFrame() {
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.9, roughness: 0.2 });
                const thickness = 0.12;
                const cornerSize = 0.18;
                
                const hw = this.width/2; 
                const hh = this.height/2; 
                const hd = this.depth/2;
                
                // เสามุม 8 เสา (แก้ไขให้เชื่อมกันด้วยคาน)
                const cornerPositions = [
                    [hw, hh, hd], [-hw, hh, hd], 
                    [hw, hh, -hd], [-hw, hh, -hd],
                    [hw, -hh, hd], [-hw, -hh, hd],
                    [hw, -hh, -hd], [-hw, -hh, -hd]
                ];
                
                cornerPositions.forEach(pos => {
                    const corner = new THREE.Mesh(
                        new THREE.BoxGeometry(cornerSize, cornerSize, cornerSize),
                        new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.9 })
                    );
                    corner.position.set(pos[0], pos[1], pos[2]);
                    this.group.add(corner);
                    this.frameElements.push(corner);
                });

                // คานตั้ง - เชื่อมเสาบน-ล่าง
                const verticalBeams = [
                    [hw, 0, hd], [-hw, 0, hd], [hw, 0, -hd], [-hw, 0, -hd]
                ];
                
                verticalBeams.forEach(pos => {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(thickness, this.height, thickness),
                        frameMat
                    );
                    beam.position.set(pos[0], pos[1], pos[2]);
                    this.group.add(beam);
                    this.frameElements.push(beam);
                });

                // คานแนวนอน (บน-ล่าง) - เชื่อมหัว-ท้าย
                const topBottomBeams = [
                    // คานบน (top)
                    [0, hh, hd, this.width, thickness, thickness],    // หัว-ท้าย ด้านหน้า
                    [0, hh, -hd, this.width, thickness, thickness],   // หัว-ท้าย ด้านหลัง
                    [hw, hh, 0, thickness, thickness, this.depth],    // หน้า-หลัง ด้านขวา
                    [-hw, hh, 0, thickness, thickness, this.depth],   // หน้า-หลัง ด้านซ้าย
                    // คานล่าง (bottom)
                    [0, -hh, hd, this.width, thickness, thickness],   // หัว-ท้าย ด้านหน้า
                    [0, -hh, -hd, this.width, thickness, thickness],  // หัว-ท้าย ด้านหลัง
                    [hw, -hh, 0, thickness, thickness, this.depth],   // หน้า-หลัง ด้านขวา
                    [-hw, -hh, 0, thickness, thickness, this.depth]   // หน้า-หลัง ด้านซ้าย
                ];
                
                topBottomBeams.forEach(([x, y, z, w, h, d]) => {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(w, h, d),
                        frameMat
                    );
                    beam.position.set(x, y, z);
                    this.group.add(beam);
                    this.frameElements.push(beam);
                });
            }

            _addCargo() {
                // วาง POLIMAXX bags ตามรูปแบบ index.html (5 ถุง)
                const floorY = -this.height/2;
                
                // ใช้จำนวนที่กำหนดจาก UI (default = 5)
                const bagsCount = this.bagsCount || 5;
                
                console.log(`Container ${this.depth > 10 ? '40ft' : '20ft'}: สร้าง ${bagsCount} กระเป๋า (ตามรูปแบบ index.html)`);
                
                // เก็บข้อมูลตำแหน่งและการหมุนของทุกถุง
                this.bagPositions = [];
                this.bagRotations = [];
                this.bagOriginalStates = []; // เก็บสถานะเดิมสำหรับ return function
                
                // กำหนดตำแหน่งเริ่มต้นแบบ index.html (5 ถุง)
                const h = POLIMAXBag.BAG_HEIGHT;
                const l = POLIMAXBag.BAG_LENGTH;
                const w = POLIMAXBag.BAG_WIDTH;
                const baseY = floorY + h/2 + 0.22;
                
                // ตำแหน่งและการหมุนเหมือน index.html (scale ลงให้พอดีกับ container)
                const bagConfigs = [
                    // ถุง 5: X=-0.39 (scale จาก -0.78), 0°
                    { x: -0.39, y: baseY, z: l/4 + 0.1, rot: 0, label: 5 },
                    // ถุง 4: X=0.30 (scale จาก 0.60), 0°
                    { x: 0.30, y: baseY, z: l/4 + 0.1, rot: 0, label: 4 },
                    // ถุง 3: X=-0.41 (scale จาก -0.82), 270°
                    { x: -0.41, y: baseY, z: -l/4 - 0.1, rot: 3 * Math.PI / 2, label: 3 },
                    // ถุง 2: X=0.00, 90°
                    { x: 0.00, y: baseY, z: -l/4 - 0.1, rot: Math.PI / 2, label: 2 },
                    // ถุง 1: X=0.41 (scale จาก 0.82), 90°
                    { x: 0.41, y: baseY, z: -l/4 - 0.1, rot: Math.PI / 2, label: 1 }
                ];
                
                // สร้างถุงตามจำนวนที่กำหนด
                for (let i = 0; i < Math.min(bagsCount, bagConfigs.length); i++) {
                    const config = bagConfigs[i];
                    
                    // ตรวจสอบไม่ให้ล้นออกนอก container
                    if (Math.abs(config.x) > (this.width/2 - w/2 - 0.05)) continue;
                    if (Math.abs(config.z) > (this.depth/2 - l/2 - 0.05)) continue;
                    if (config.y > (this.height/2 - h/2 - 0.05)) continue;
                    
                    // สร้างถุงด้วย material ที่ปรับ texture rotation
                    const bag = this.bagClass.createInstance(config.x, config.y, config.z, config.rot);
                    
                    // ปรับ texture rotation ตามการหมุนของถุง
                    this.adjustTextureRotation(bag, config.rot);
                    
                    // เก็บตำแหน่งและการหมุนเริ่มต้น
                    this.bagPositions.push({ x: 0, y: 0, z: 0, scale: 1, baseX: config.x, baseZ: config.z });
                    this.bagRotations.push(config.rot);
                    this.bagOriginalStates.push({ y: config.y, scale: 1 }); // เก็บ Y และ scale เดิม
                    
                    this.group.add(bag);
                    this.cargo.push(bag);
                }
                
                console.log(`สร้างกระเป๋า POLIMAXX: ${this.cargo.length} ใบ (ตามรูปแบบ index.html)`);
            }

            _init() {
                this._buildFrame();
                
                // คานขวางพื้น
                const beamMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
                for(let z = -this.depth/2 + 0.3; z < this.depth/2 - 0.25; z += 0.3) {
                    const beam = new THREE.Mesh(
                        new THREE.BoxGeometry(this.width - 0.2, 0.12, 0.08),
                        beamMat
                    );
                    beam.position.set(0, -this.height/2 + 0.14, z);
                    this.group.add(beam);
                    this.frameElements.push(beam);
                }
                
                // พื้นไม้
                const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
                const floor = new THREE.Mesh(
                    new THREE.BoxGeometry(this.width - 0.1, 0.05, this.depth - 0.2),
                    floorMat
                );
                floor.position.set(0, -this.height/2 + 0.185, 0);
                this.group.add(floor);
                
                // Corner castings
                const castingMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 });
                const hw = this.width/2; const hh = this.height/2; const hd = this.depth/2;
                const positions = [
                    [hw, hh, hd], [-hw, hh, hd], [hw, -hh, hd], [-hw, -hh, hd],
                    [hw, hh, -hd], [-hw, hh, -hd], [hw, -hh, -hd], [-hw, -hh, -hd]
                ];
                
                positions.forEach(pos => {
                    const casting = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), castingMat);
                    casting.position.set(...pos);
                    this.group.add(casting);
                });

                // ผนัง
                const wallMaterial = {
                    RIGHT: new THREE.MeshStandardMaterial({ map: this._createSideTexture(), side: THREE.DoubleSide }),
                    LEFT: new THREE.MeshStandardMaterial({ map: this._createSideTexture(), side: THREE.DoubleSide }),
                    FRONT: new THREE.MeshStandardMaterial({ map: this._createFrontTexture(), side: THREE.DoubleSide }),
                    BACK: new THREE.MeshStandardMaterial({ map: this._createDoorTextures(), side: THREE.DoubleSide })
                };

                const sideGeo = new THREE.PlaneGeometry(this.depth - 0.1, this.height - 0.1);
                const rightWall = new THREE.Mesh(sideGeo, wallMaterial.RIGHT);
                rightWall.position.set(this.width/2 - 0.02, 0, 0);
                rightWall.rotation.y = Math.PI/2;
                this.group.add(rightWall);
                this.walls.push(rightWall);

                const leftWall = new THREE.Mesh(sideGeo, wallMaterial.LEFT);
                leftWall.position.set(-this.width/2 + 0.02, 0, 0);
                leftWall.rotation.y = -Math.PI/2;
                this.group.add(leftWall);
                this.walls.push(leftWall);

                const frontGeo = new THREE.PlaneGeometry(this.width - 0.1, this.height - 0.1);
                const frontWall = new THREE.Mesh(frontGeo, wallMaterial.FRONT);
                frontWall.position.set(0, 0, -this.depth/2 + 0.02);
                frontWall.rotation.y = 0;
                this.group.add(frontWall);
                // If front decor appears mirrored, flip its texture horizontally
                try {
                    if (frontWall.material && frontWall.material.map) {
                        const m = frontWall.material.map;
                        m.center = m.center || new THREE.Vector2(0.5, 0.5);
                        m.repeat = m.repeat || new THREE.Vector2(1, 1);
                        m.repeat.x = -1;
                        m.wrapS = THREE.RepeatWrapping;
                        m.needsUpdate = true;
                    }
                } catch (e) { console.warn('flip front wall failed', e); }
                this.walls.push(frontWall);

                const backWall = new THREE.Mesh(frontGeo, wallMaterial.BACK);
                backWall.position.set(0, 0, this.depth/2 - 0.02);
                backWall.rotation.y = Math.PI;
                this.group.add(backWall);
                // Mirror only the BACK wall texture horizontally so decor reads correctly.
                // Use RepeatWrapping when repeat.x is negative so the flipped texture is sampled correctly.
                try {
                    if (backWall.material && backWall.material.map) {
                        const m = backWall.material.map;
                        m.center = m.center || new THREE.Vector2(0.5, 0.5);
                        m.repeat = m.repeat || new THREE.Vector2(1, 1);
                        m.repeat.x = -1;
                        m.wrapS = THREE.RepeatWrapping;
                        m.needsUpdate = true;
                    }
                } catch (e) { console.warn('flip back wall failed', e); }
                this.walls.push(backWall);

                // สร้างป้ายบอกด้านและป้าย index (แต่ซ่อนเริ่มต้นไว้)
                this.faceLabels = [];
                this.indexSprite = null;
                try {
                    const makeSprite = (text, opts = {}) => {
                        const size = opts.size || 256;
                        const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = Math.round(size * 0.45);
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = opts.bg || 'rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                        ctx.fillStyle = opts.color || '#ffffff'; ctx.font = (opts.fontSize || Math.round(canvas.height * 0.5)) + 'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
                        ctx.fillText(text, canvas.width/2, canvas.height/2);
                        const tex = new THREE.CanvasTexture(canvas); tex.encoding = THREE.sRGBEncoding; tex.needsUpdate = true;
                        const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false });
                        const s = new THREE.Sprite(mat);
                        s.scale.set(opts.scaleX || 0.9, opts.scaleY || 0.4, 1);
                        s.visible = false;
                        return s;
                    };

                    // attach center labels to each wall (positioned slightly in front)
                    const rLabel = makeSprite('RIGHT', { scaleX: 1.0, scaleY: 0.45 });
                    rightWall.add(rLabel); rLabel.position.set(0, 0, 0.02); this.faceLabels.push(rLabel);

                    const lLabel = makeSprite('LEFT', { scaleX: 1.0, scaleY: 0.45 });
                    leftWall.add(lLabel); lLabel.position.set(0, 0, 0.02); this.faceLabels.push(lLabel);

                    const fLabel = makeSprite('FRONT', { scaleX: 1.2, scaleY: 0.45 });
                    frontWall.add(fLabel); fLabel.position.set(0, 0, 0.02); this.faceLabels.push(fLabel);

                    const bLabel = makeSprite('BACK', { scaleX: 1.2, scaleY: 0.45 });
                    backWall.add(bLabel); bLabel.position.set(0, 0, 0.02); this.faceLabels.push(bLabel);

                    // container index sprite above roof center
                    const idx = makeSprite(String(this.index), { scaleX: 0.5, scaleY: 0.5, fontSize: Math.round(80) });
                    idx.position.set(0, this.height/2 + 0.25, 0);
                    this.group.add(idx); this.indexSprite = idx;
                } catch (e) { /* ignore sprite failures */ }

                // หลังคา
                const roofGeo = new THREE.PlaneGeometry(this.width - 0.1, this.depth - 0.1);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0xce117b, side: THREE.DoubleSide });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(0, this.height/2 - 0.02, 0);
                roof.rotation.x = Math.PI/2;
                this.group.add(roof);
                this.walls.push(roof);

                // เพิ่มสินค้า
                this._addCargo();

                // กำหนดตำแหน่ง Y เริ่มต้นให้อยู่เหนือพื้น
                this.group.position.y = 0; // เริ่มที่ 0 (พื้นที่ world)
                
                // ตรวจสอบไม่ให้ frame element มุดลงใต้ world y=0
                // โดยยก group ขึ้นตามความจำเป็น
                try {
                    let minBottom = Infinity;
                    this.frameElements.forEach(el => {
                        if (!el || !el.geometry) return;
                        el.geometry.computeBoundingBox();
                        const bbMinY = el.geometry.boundingBox.min.y;
                        const worldBottom = this.group.position.y + el.position.y + bbMinY;
                        if (worldBottom < minBottom) minBottom = worldBottom;
                    });
                    if (isFinite(minBottom) && minBottom < 0) {
                        this.group.position.y += (-minBottom) + 0.001;
                    }
                } catch (e) { console.warn('adjust group Y failed', e); }
            }

            setWallsVisible(visible) {
                this.walls.forEach(el => el.visible = visible);
            }

            // ปรับ texture rotation ตามการหมุนของถุง
            adjustTextureRotation(bag, rotation) {
                if (!bag.material || !Array.isArray(bag.material)) return;
                
                // ปรับ top texture (index 2) และ back texture (index 5)
                const topMaterial = bag.material[2]; // top face
                const backMaterial = bag.material[5]; // back face (ย้าย front texture มาที่นี่แล้ว)
                
                if (topMaterial && topMaterial.map) {
                    // หมุน top texture ตามการหมุนของถุง
                    // เอา base-flip ออก (ใช้ -rotation) เพื่อกลับทิศทาง artwork ตามที่ต้องการ
                    topMaterial.map.center.set(0.5, 0.5);
                    topMaterial.map.rotation = -rotation;
                    topMaterial.map.needsUpdate = true;
                }

                if (backMaterial && backMaterial.map) {
                    // หมุน back texture ตามการหมุนของถุง (รวม base rotation ของ front texture)
                    backMaterial.map.center.set(0.5, 0.5);
                    // createFrontTexture ใช้ base rotation = Math.PI/2
                    backMaterial.map.rotation = -rotation + (Math.PI / 2);
                    backMaterial.map.needsUpdate = true;
                }
            }
            
            // อัพเดทจำนวนถุง
            updateBagsCount(newCount) {
                this.bagsCount = newCount;
                
                // ลบถุงเก่าออกก่อน
                this.cargo.forEach(bag => this.group.remove(bag));
                this.cargo = [];
                
                // สร้างถุงใหม่ด้วยจำนวนใหม่
                this._addCargo();
            }
            
            // ปรับตำแหน่งถุงแต่ละตัว
            updateBagPosition(bagIndex, xOffset, yOffset, zOffset) {
                if (bagIndex >= 0 && bagIndex < this.cargo.length) {
                    const bag = this.cargo[bagIndex];
                    
                    // คำนวณตำแหน่งเริ่มต้น + offset
                    const baseX = this.bagPositions[bagIndex].baseX || bag.position.x;
                    const baseY = this.bagOriginalStates[bagIndex].y;
                    const baseZ = this.bagPositions[bagIndex].baseZ || bag.position.z;
                    
                    bag.position.x = baseX + xOffset;
                    bag.position.y = baseY + yOffset;
                    bag.position.z = baseZ + zOffset;
                    
                    // เก็บ offset ไว้สำหรับ slider
                    this.bagPositions[bagIndex].x = xOffset;
                    this.bagPositions[bagIndex].y = yOffset;
                    this.bagPositions[bagIndex].z = zOffset;
                }
            }
            
            // ปรับขนาดถุงแต่ละตัว
            updateBagScale(bagIndex, scale) {
                if (bagIndex >= 0 && bagIndex < this.cargo.length) {
                    const bag = this.cargo[bagIndex];
                    bag.scale.setScalar(scale);
                    this.bagPositions[bagIndex].scale = scale;
                }
            }
            
            // ยกถุงขึ้นดูรายละเอียด (ตำแหน่งกลางหน้าจอ + ขยายใหญ่)
            liftBagToInspect(bagIndex) {
                if (bagIndex >= 0 && bagIndex < this.cargo.length) {
                    const bag = this.cargo[bagIndex];
                    
                    // เก็บสถานะเดิม
                    this.bagOriginalStates[bagIndex] = {
                        y: bag.position.y,
                        scale: bag.scale.x
                    };
                    
                    // ยกขึ้นกลางหน้าจอและขยายใหญ่
                    bag.position.y = 4; // ยกขึ้นสูง
                    bag.scale.setScalar(6); // ขยาย 6 เท่า
                    
                    // อัพเดท slider values
                    this.bagPositions[bagIndex].y = 4;
                    this.bagPositions[bagIndex].scale = 6;
                }
            }
            
            // กลับตำแหน่งเดิม
            returnBagToOriginal(bagIndex) {
                if (bagIndex >= 0 && bagIndex < this.cargo.length) {
                    const bag = this.cargo[bagIndex];
                    const originalState = this.bagOriginalStates[bagIndex];
                    
                    // กลับตำแหน่งและขนาดเดิม
                    bag.position.y = originalState.y;
                    bag.scale.setScalar(originalState.scale);
                    
                    // อัพเดท slider values
                    this.bagPositions[bagIndex].y = 0;
                    this.bagPositions[bagIndex].scale = 1;
                }
            }
            
            // หมุนถุงแต่ละตัว (พร้อมปรับ texture)
            rotateBag(bagIndex, angle) {
                if (bagIndex >= 0 && bagIndex < this.cargo.length) {
                    const bag = this.cargo[bagIndex];
                    this.bagRotations[bagIndex] += angle;
                    bag.rotation.y = this.bagRotations[bagIndex];
                    
                    // ปรับ texture rotation ตามการหมุนใหม่
                    this.adjustTextureRotation(bag, this.bagRotations[bagIndex]);
                }
            }
            
            setCargoVisible(visible) {
                this.cargo.forEach(el => el.visible = visible);
            }
            
            // อัพเดทระยะห่างของถุง
            updateBagSpacing(xMultiplier, yMultiplier, zMultiplier) {
                this.spacingMultiplierX = xMultiplier;
                this.spacingMultiplierY = yMultiplier;
                this.spacingMultiplierZ = zMultiplier;
                
                // ลบถุงเก่าออกก่อน
                this.cargo.forEach(bag => this.group.remove(bag));
                this.cargo = [];
                
                // สร้างถุงใหม่ด้วยระยะห่างใหม่
                this._addCargo();
            }

            getGroup() { return this.group; }
        }

        class ContainerApp {
            constructor() {
                this.scene = new THREE.Scene();
                this.containers = [];
                this.wallsVisible = true;
                this.cargoVisible = true;
                
                // UI state
                this.selectedContainer = 0; // container ที่เลือกอยู่
                this.selectedBag = 0; // ถุงที่เลือกอยู่
                
                this._init();
                this._addObjects();
                this._animate();
                this._setupEvents();
            }

            _init() {
                this.renderer = new THREE.WebGLRenderer({ antialias: false }); // ปิด antialias เพื่อประสิทธิภาพ
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // จำกัด pixelRatio
                this.renderer.shadowMap.enabled = true;
                document.body.appendChild(this.renderer.domElement);

                this.camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(12, 6, 25);

                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.target.set(0, 1.5, 0);
                
                this.scene.background = new THREE.Color(0x111122);
                
                // แสง
                const ambientLight = new THREE.AmbientLight(0x404060);
                this.scene.add(ambientLight);
                
                const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
                sunLight.position.set(5, 10, 7);
                sunLight.castShadow = true;
                this.scene.add(sunLight);
                
                const fillLight = new THREE.PointLight(0x4466ff, 0.3);
                fillLight.position.set(-3, 3, 5);
                this.scene.add(fillLight);
            }

            _addObjects() {
                // 20ft container (หมุน 180 องศาตาม Y)
                const c1 = new OneContainer({ 
                    index: 1, 
                    length: 6.06,
                    height: 2.59,
                    isHighCube: false
                });
                // ใช้ Y position ที่ class คำนวณมาให้ (ถูกต้องเดิม)
                c1.getGroup().position.set(-7, c1.getGroup().position.y, -2);
                c1.getGroup().rotation.y = Math.PI + 0.1; // 180 องศา + เล็กน้อย
                this.scene.add(c1.getGroup());
                this.containers.push(c1);

                // 40ft container (หมุน 180 องศาตาม Y)
                const c2 = new OneContainer({ 
                    index: 2, 
                    length: 12.19,
                    height: 2.59,
                    isHighCube: false
                });
                c2.getGroup().position.set(0, c2.getGroup().position.y, 0);
                c2.getGroup().rotation.y = Math.PI; // 180 องศา
                this.scene.add(c2.getGroup());
                this.containers.push(c2);

                // 40ft HC container (หมุน 180 องศาตาม Y)
                const c3 = new OneContainer({ 
                    index: 3, 
                    length: 12.19,
                    height: 2.89,
                    isHighCube: true
                });
                c3.getGroup().position.set(7, c3.getGroup().position.y, 2);
                c3.getGroup().rotation.y = Math.PI - 0.1; // 180 องศา - เล็กน้อย
                this.scene.add(c3.getGroup());
                this.containers.push(c3);

                // store base X/Z/Y and rotation for each container so the UI sliders apply relative deltas
                this.containers.forEach(c => {
                    try {
                        const g = c.getGroup();
                        c.baseX = g.position.x;
                        c.baseZ = g.position.z;
                        c.baseY = g.position.y;  // เก็บ Y position ที่คำนวณมาจาก class
                        c.baseRot = g.rotation.y;
                    } catch (e) {}
                });

                // apply initial containers Y slider value (default 0.10 m)
                try {
                    const initEl = document.getElementById('containersY');
                    const initVal = initEl ? parseFloat(initEl.value) : 0.0;
                    if (!isNaN(initVal) && initVal !== 0) {
                        this.containers.forEach(c => {
                            try { c.getGroup().position.y = (typeof c.baseY === 'number' ? c.baseY : c.getGroup().position.y) + initVal; } catch (e) {}
                        });
                    }
                } catch (e) { }

                // Grid
                const gridHelper = new THREE.GridHelper(30, 30, 0xff007f, 0x333333);
                gridHelper.position.y = -0.01;
                this.scene.add(gridHelper);
            }

            _setupEvents() {
                document.getElementById('toggleWalls').addEventListener('click', () => {
                    this.wallsVisible = !this.wallsVisible;
                    this.containers.forEach(c => c.setWallsVisible(this.wallsVisible));
                });

                document.getElementById('toggleCargo').addEventListener('click', () => {
                    this.cargoVisible = !this.cargoVisible;
                    this.containers.forEach(c => c.setCargoVisible(this.cargoVisible));
                });

                // toggle face/index labels for all containers
                const lblChk = document.getElementById('toggleLabels');
                if (lblChk) {
                    lblChk.addEventListener('change', () => {
                        const show = lblChk.checked;
                        this.containers.forEach(c => {
                            try {
                                if (c.faceLabels && Array.isArray(c.faceLabels)) c.faceLabels.forEach(s => s.visible = show);
                                if (c.indexSprite) c.indexSprite.visible = show;
                            } catch (e) {}
                        });
                    });
                }
                
                // Container Y position control
                const containerYSlider = document.getElementById('containerY');
                const containerYValue = document.getElementById('containerYValue');
                if (containerYSlider && containerYValue) {
                    containerYSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        containerYValue.textContent = value.toFixed(2);
                        this.containers.forEach(c => {
                            const group = c.getGroup();
                            // ใช้ baseY + slider value (คืนค่าระบบเดิมที่ถูกต้อง)
                            group.position.y = (c.baseY || 0) + value;
                        });
                    });
                    
                    // ตั้งค่า default เมื่อเริ่มต้น (container อยู่บนพื้น)
                    const defaultValue = 0.0;  // เปลี่ยนจาก 1.3 เป็น 0.0
                    containerYSlider.value = defaultValue;
                    containerYValue.textContent = defaultValue.toFixed(2);
                    this.containers.forEach(c => {
                        const group = c.getGroup();
                        group.position.y = (c.baseY || 0) + defaultValue;
                    });
                }
                
                // Bag spacing controls
                const setupSpacingSlider = (sliderId, valueId, updateFn) => {
                    const slider = document.getElementById(sliderId);
                    const valueDisplay = document.getElementById(valueId);
                    if (slider && valueDisplay) {
                        slider.addEventListener('input', (e) => {
                            const value = parseFloat(e.target.value);
                            valueDisplay.textContent = value.toFixed(2);
                            updateFn(value);
                        });
                    }
                };
                
                setupSpacingSlider('bagSpacingX', 'bagSpacingXValue', (value) => {
                    this.containers.forEach(c => {
                        const yVal = parseFloat(document.getElementById('bagSpacingY').value);
                        const zVal = parseFloat(document.getElementById('bagSpacingZ').value);
                        c.updateBagSpacing(value, yVal, zVal);
                    });
                });
                
                setupSpacingSlider('bagSpacingY', 'bagSpacingYValue', (value) => {
                    this.containers.forEach(c => {
                        const xVal = parseFloat(document.getElementById('bagSpacingX').value);
                        const zVal = parseFloat(document.getElementById('bagSpacingZ').value);
                        c.updateBagSpacing(xVal, value, zVal);
                    });
                });
                
                setupSpacingSlider('bagSpacingZ', 'bagSpacingZValue', (value) => {
                    this.containers.forEach(c => {
                        const xVal = parseFloat(document.getElementById('bagSpacingX').value);
                        const yVal = parseFloat(document.getElementById('bagSpacingY').value);
                        c.updateBagSpacing(xVal, yVal, value);
                    });
                });

                // Container selector events
                const containerBtns = document.querySelectorAll('.container-btn');
                containerBtns.forEach((btn) => {
                    btn.addEventListener('click', (e) => {
                        // data-container already matches the containers array index (0..n-1)
                        const containerIndex = parseInt(e.target.dataset.container);
                        if (containerIndex >= 0 && containerIndex < this.containers.length) {
                            this.selectedContainer = containerIndex;

                            // Update UI
                            containerBtns.forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');

                            this.updateBagSelector();
                            this.updateSliderValues();
                        }
                    });
                });

                // Bag selector events
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('bag-btn')) {
                        const bagIndex = parseInt(e.target.dataset.bag);
                        if (!isNaN(bagIndex) && bagIndex >= 0) {
                            this.selectedBag = bagIndex;
                            
                            // Update active button
                            document.querySelectorAll('.bag-btn').forEach(b => b.classList.remove('active'));
                            e.target.classList.add('active');
                            
                            this.updateSliderValues();
                        }
                    }
                });

                // Bag position sliders
                const bagXSlider = document.getElementById('bagX');
                const bagXValue = document.getElementById('bagXValue');
                if (bagXSlider && bagXValue) {
                    bagXSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        bagXValue.textContent = value.toFixed(2);
                        
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            const bagPos = container.bagPositions[this.selectedBag] || { y: 0, z: 0 };
                            container.updateBagPosition(this.selectedBag, value, bagPos.y, bagPos.z);
                        }
                    });
                }

                const bagYSlider = document.getElementById('bagY');
                const bagYValue = document.getElementById('bagYValue');
                if (bagYSlider && bagYValue) {
                    bagYSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        bagYValue.textContent = value.toFixed(2);
                        
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            const bagPos = container.bagPositions[this.selectedBag] || { x: 0, z: 0 };
                            container.updateBagPosition(this.selectedBag, bagPos.x, value, bagPos.z);
                        }
                    });
                }

                const bagZSlider = document.getElementById('bagZ');
                const bagZValue = document.getElementById('bagZValue');
                if (bagZSlider && bagZValue) {
                    bagZSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        bagZValue.textContent = value.toFixed(2);
                        
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            const bagPos = container.bagPositions[this.selectedBag] || { x: 0, y: 0 };
                            container.updateBagPosition(this.selectedBag, bagPos.x, bagPos.y, value);
                        }
                    });
                }

                const bagScaleSlider = document.getElementById('bagScale');
                const bagScaleValue = document.getElementById('bagScaleValue');
                if (bagScaleSlider && bagScaleValue) {
                    bagScaleSlider.addEventListener('input', (e) => {
                        const value = parseFloat(e.target.value);
                        bagScaleValue.textContent = value.toFixed(2);
                        
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.updateBagScale(this.selectedBag, value);
                        }
                    });
                }

                // Rotation buttons
                const rotateLeftBtn = document.getElementById('rotateLeft');
                const rotateRightBtn = document.getElementById('rotateRight');
                
                if (rotateLeftBtn) {
                    rotateLeftBtn.addEventListener('click', () => {
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.rotateBag(this.selectedBag, -Math.PI / 2); // หมุนซ้าย 90 องศา
                        }
                    });
                }

                if (rotateRightBtn) {
                    rotateRightBtn.addEventListener('click', () => {
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.rotateBag(this.selectedBag, Math.PI / 2); // หมุนขวา 90 องศา
                        }
                    });
                }

                // Bags count slider
                const bagsCountSlider = document.getElementById('bagsCount');
                const bagsCountValue = document.getElementById('bagsCountValue');
                if (bagsCountSlider && bagsCountValue) {
                    bagsCountSlider.addEventListener('input', (e) => {
                        const count = parseInt(e.target.value);
                        bagsCountValue.textContent = count;
                        
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.updateBagsCount(count);
                            this.updateBagSelector();
                            this.updateSliderValues();
                        }
                    });
                }

                // Lift to inspect and return buttons
                const liftBtn = document.getElementById('liftToInspect');
                const returnBtn = document.getElementById('returnToOriginal');
                
                if (liftBtn) {
                    liftBtn.addEventListener('click', () => {
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.liftBagToInspect(this.selectedBag);
                            this.updateSliderValues();
                        }
                    });
                }

                if (returnBtn) {
                    returnBtn.addEventListener('click', () => {
                        const container = this.containers[this.selectedContainer];
                        if (container) {
                            container.returnBagToOriginal(this.selectedBag);
                            this.updateSliderValues();
                        }
                    });
                }

                // Rotate-all control removed; camera orbit is used for viewing.

                document.getElementById('resetView').addEventListener('click', () => {
                    this.camera.position.set(12, 6, 25);
                    this.controls.target.set(0, 1.5, 0);
                });

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            // อัพเดท bag selector ตามจำนวนถุงใน container ที่เลือก
            updateBagSelector() {
                const container = this.containers[this.selectedContainer];
                if (!container) return;
                
                const bagBtns = document.querySelectorAll('.bag-btn');
                const bagsCount = container.cargo.length;
                
                bagBtns.forEach((btn, index) => {
                    if (index < bagsCount) {
                        btn.style.display = 'block';
                        btn.textContent = index + 1;
                        btn.dataset.bag = index;
                    } else {
                        btn.style.display = 'none';
                    }
                });
                
                // รีเซ็ต selected bag ถ้าเกินขอบเขต
                if (this.selectedBag >= bagsCount) {
                    this.selectedBag = Math.max(0, bagsCount - 1);
                }
                
                // อัพเดท active button
                bagBtns.forEach(b => b.classList.remove('active'));
                if (bagBtns[this.selectedBag]) {
                    bagBtns[this.selectedBag].classList.add('active');
                }
            }
            
            // อัพเดท slider values ตาม bag ที่เลือก
            updateSliderValues() {
                const container = this.containers[this.selectedContainer];
                if (!container || !container.bagPositions || this.selectedBag >= container.bagPositions.length) return;
                
                const bagPos = container.bagPositions[this.selectedBag];
                
                const bagXSlider = document.getElementById('bagX');
                const bagXValue = document.getElementById('bagXValue');
                const bagYSlider = document.getElementById('bagY');
                const bagYValue = document.getElementById('bagYValue');
                const bagZSlider = document.getElementById('bagZ');
                const bagZValue = document.getElementById('bagZValue');
                const bagScaleSlider = document.getElementById('bagScale');
                const bagScaleValue = document.getElementById('bagScaleValue');
                
                if (bagXSlider && bagXValue) {
                    bagXSlider.value = bagPos.x || 0;
                    bagXValue.textContent = (bagPos.x || 0).toFixed(2);
                }
                
                if (bagYSlider && bagYValue) {
                    bagYSlider.value = bagPos.y || 0;
                    bagYValue.textContent = (bagPos.y || 0).toFixed(2);
                }
                
                if (bagZSlider && bagZValue) {
                    bagZSlider.value = bagPos.z || 0;
                    bagZValue.textContent = (bagPos.z || 0).toFixed(2);
                }
                
                if (bagScaleSlider && bagScaleValue) {
                    bagScaleSlider.value = bagPos.scale || 1;
                    bagScaleValue.textContent = (bagPos.scale || 1).toFixed(2);
                }
            }

            _animate() {
                requestAnimationFrame(() => this._animate());
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        }

        window.onload = () => {
            const app = new ContainerApp();
            
            // เริ่มต้น UI state
            app.updateBagSelector();
            app.updateSliderValues();
            
            // Set default active states
            const firstContainerBtn = document.querySelector('.container-btn');
            if (firstContainerBtn) {
                firstContainerBtn.classList.add('active');
            }
        };
    </script>
</body>
</html>
